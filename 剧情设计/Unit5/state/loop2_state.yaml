expose:
  id: 502
  scene_id: 5005
  target_npc: 504
  talk: L2_expose_vivian
  is_liar: true
  player_inquiry: null
  source_anchor: 剧情设计/Unit5/Unit5_大纲.md:435
  progress: {doubts: 3, fragments: 0, denominator: 3, required_percent: 100}
  prerequisites:
    required_doubt_ids: [5201, 5202, 5203]
    required_item_ids: [5201, 5202, 5203, 5204]
    required_environment_ids: [5252]
    required_testimony_ids: [5032001, 5042001, 5052001]
    required_talks: [L2_talk_corridor_stair_position, L2_talk_corridor_stage_departure, L2_talk_stage_death_sequence, L2_event_public_approval]
    previous_events_completed: [waking_promise, corridor_arrival, public_approval]
    required_flags: {u5_fire_card_seen: true}
    runtime_status: special_adapter_required
  expose_lie_ids: [5042901, 5042902]
  rounds:
    - round: 1
      lie_source: 5042001
      lie: 我们 18:05 离开时，楼梯已经在 A。此后没有人再动过；Pierce 所谓 21:15 的 B 位是他看错了。
      evidence_set: [{type: item, id: 5202}]
      result: 21:15客观处于B；离场在A且无人再动的说法不成立，不推测她18:05操作过楼梯。
      retreat: 底片可能是前一天同一时刻的彩排旧片。
    - round: 2
      lie_source: 5042901
      lie: 钟面只能说明时间，不能说明日期。
      evidence_set: [{type: item, id: 5203}]
      result: 底片中批准联属于案发当天，不可能是前一天旧片；底片本身为已知前提，不重复出示。
      retreat: 即使后来发生 B→A，也可能早于刀创，只是未登记的舞台调整。
    - round: 3
      lie_source: 5042902
      lie: 那次移动发生在刀创之前，与伤后现场处理无关。
      evidence_set: [{type: item, id: 5201}]
      prerequisites: {required_testimony_ids: [5052001]}
      result: 刀创活体喷溅先出现，回转轮后拖开血滴；发现现场不是刀创时原状，仍不知道操作者。
  post_expose:
    talk: L2_post_expose_concealment
    scene_id: 5005
    source_anchor: 剧情设计/Unit5/Unit5_大纲.md:461
    testimony_ids: []
    required_beats:
      - Vivian 承认知道团队离场仍B、破门却A，为保蓝月亮与承办位置隐瞒状态异常。
      - 她18:05未操作，不曾见后来的操作者，也不知道回转晚于刀创；不升级共谋或杀人结论。
      - 玩家选择如何划定隐瞒的边界，然后由A位顶端异常引向公开两层是否占满建筑的测高问题。
    choices:
      - {id: restraint, meaning: 只确认隐瞒异常，不扩大为操作者或共谋杀人, set_flags: {u5_vivian_hint: true}}
      - {id: overreach, meaning: 把隐瞒异常扩大为亲自操作或参与共谋杀人, set_flags: {u5_vivian_hint: false}}
    choice_boundary: 只改变终局B观察提示资格，不改变线索、风险、成功权限、票型、生死或后续固定信息。
    runtime_exit: {action: loop_end, next_loop: 3, next_talk: L3_opening_measurement_proposal}
post_expose_knowledge:
  - Emma 主动申请当天20:30—22:30彩排并约老 Charles 于21:30到舞台。
  - 老 Charles 先高处坠落重伤，后遭致命刀刺；刀创喷溅早于楼梯B到A回转。
  - Vivian 隐瞒楼梯状态异常，不等于她操作楼梯、共谋或杀人。
  - A位顶端是用途不明的木合地布景板，尚不能称暗门。
  - Zack 没有隐瞒彩排批准联，Emma 见证他遵守查清真相的承诺。
