unit: Unit5
episode: EPI05
loop: 2
chapter_id: 502
title: Vivian——刀创之后才移动的楼梯
schema_contract: state_contract.yaml
validation_status: DESIGN_REVIEW_PASS
player_context:
  goals:
    - 核对楼梯是否曾从 B 回转至 A，以及回转与致命刀创的先后。
    - 在入口已可破解但出口未知的条件下，调查 A 位顶端异常。
  known_facts:
    - Zack 持有水源风险与 Sean 旧报告异常页面，尚不足以定案老 Charles 对 1912 年事件的完整责任。
    - O'Hara 已送往圣心医院，Rosa 已得到同一水源风险警告。
    - Pierce 的镜中观察不能排除第二名正常入口者，未确认具体进入者。
    - 中央镜至礼堂门约十秒、全程约二十秒，Pierce 打点低头十四秒。
    - Pierce 说21:15楼梯在B、破门却在A，尚须客观影像验证。
    - Emma 昏睡并被独立看守；她与 Zack 的信任尚未修复。
    - 21:38止付发送联使用M-7提前登记死亡，授权人未知。
  historical_fact_policy: known_facts保留前序原句；历史昏睡记载由本轮opening苏醒更新当前状态，不再让Emma继续昏睡。
  opening_facts:
    - Emma 已在独立客房苏醒，承认主动申请彩排及约老 Charles 于21:30赴舞台。
    - Emma 只记得零碎声音、不能确定刀是否由自己刺下；Zack 承诺即使不利也公开真相。
    - Emma 观察了旧消防维护卡，原件留在客房，未入包。
  new_directions: [客观底片与当天批准联, 导轨血迹与完整死亡顺序, A位顶端用途不明木板]
  forbidden_conclusions: [布景板已是暗门, 夹层确实存在, 楼梯操作者身份, Vivian共谋或杀人, E-12投药与远端刻录, 暗角钥石变化]
opening:
  type: cutscene_sequence
  runtime_root: {table: ChapterConfig, init_scene: 5008, init_talk: L2_opening_waking_promise}
  sequence:
    - event_id: waking_promise
      talk: L2_opening_waking_promise
      scene_id: 5008
      location: Emma 独立客房
      cast: [501, 502]
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:386
      required_beats:
        - Emma 苏醒，承认彩排由自己申请，也承认主动约老 Charles 于21:30到舞台。
        - 她无法判断刀是否由自己刺下，只记得失去意识前后零碎声响。
        - Zack 承诺带她出去，Emma 要求查清真相而非包庇；若证据证明她杀人也不能隐瞒，Zack 答应。
        - 临走前 Zack 问房间进出，Emma 只能回忆模糊刀刃入肉声；不说远端安排、E-12与握姿。
        - Emma 查看应急疏散册夹着的旧消防维护卡，清楚展示三个正三角空间锚点与右侧不对称卡扣，随后留在房内。
      observations: [{type: environment_observed, id: 5251, observer: 502}]
      set_flags: {u5_fire_card_seen: true}
      runtime_exit: {action: change_scene, target_scene_id: 5009, continuation: next_talk, next_talk: L2_opening_corridor_arrival}
    - event_id: corridor_arrival
      talk: L2_opening_corridor_arrival
      scene_id: 5009
      location: 礼堂入口走廊
      cast: [501]
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:394
      required_beats:
        - Zack 抵达走廊，调查由入口转向出口；只回扣一条可能进入路线，不声称确有第二人走过。
        - 恢复控制后，Pierce 与 Vivian 的明确可对话条目由玩家分别询问，不由开场自动发放证言。
      runtime_exit: {action: release_to_exploration}
  player_control_restored_after: corridor_arrival
