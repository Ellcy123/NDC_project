        mindset: 得到导轨血迹才写完整顺序，不受手帕关系选择或 Zack 施压改变专业结论。
        player_inquiry: "导轨回转轮下血滴与尚未完成的死亡顺序" # 10
        is_liar: false
        unlock_condition: [{type: item, param: 5201}]
        testimony_ids:
          - id: 5052001
            kind: testimony
            content: 老 Charles 除刀伤外还有高空坠落造成的伤势。坠落使他重伤，但没有立即致死；真正的致命伤是随后形成的刀刺。回转轮下的血滴与尸旁刀创形成时的活体喷溅连续。
            acquisition_talk: L2_talk_stage_death_sequence
