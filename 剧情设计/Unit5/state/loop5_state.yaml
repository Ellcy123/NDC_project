    -
      id: "L5_finale_vivian_betrayal"
      source_anchor: "剧情设计/Unit5/Unit5_小Charles正确路线_终局线性流程.md:252"
      entry_state:
        - "从唯一合法前驱进入，按分支condition核验。"
      consumes:
        - "消费前段人物行动与未解决压力。"
      required_beats:
        - "镜头短暂切回旧档案区附近的封闭试听室：Foster 带着乙醚赶到，只看见 Zack 的尸体与已经离开的 Pierce。"
        - "Foster 判断继续追赶持枪的 Pierce 已经无法救回 Zack，只会让自己以及仍被拘禁的 Lula、Moore 一同陷入危险，因此带着乙醚撤回嫌疑人走廊。"
        - "画面切回飞行机械馆。Pierce 持枪站到小 Charles 一方，封住机械馆出口并把枪口转向 Vivian。"
        - "隔断后的小 Charles 继续通过射击缝隙控制 Emma 与 Lawson。"
        - "Vivian 先看向门口，确认不会再有 Zack；再看向两处枪线，确认自己已经无法同时保住 Lawson、Emma 与自己。"
        - "Lawson 此时已经负伤挡在 Vivian 面前。Vivian 从身后拉住他；Lawson 回头后，她吻了他，随后用自己偷偷带入庄园的 `Colt Vest Pocket Model 1908` 开枪杀死他。"
        - "Vivian 放低枪口，主动提出由自己接管 TideWater、处理投毒文件并维持官方叙事，以此向小 Charles 与 Pierce 投诚。"
        - "Vivian 同时要求留下 Emma 的性命：杀死记者只会制造烈士，摧毁她的信誉、让整座城市拒绝相信她，才是更安全的处理方式。"
        - "小 Charles 接受这套方案，保住 Miller 家族；Pierce 继续控制机械馆出口。"
        - "Emma 没有母盘，也没有能被城市权力结构采信的决定性证据。她被塑造成煽动枪击、害死 Lawson 的失控记者。"
        - "Vivian 与小 Charles 都向 Emma 提供过住所、工作或金钱。Emma 全部拒绝，独自承受整座城市的排斥。"
