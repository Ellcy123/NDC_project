    source_text: "22:10 与 22:15 两张玻璃底片使用同一固定机位，两次曝光之间相机与舞台装置没有移动；可见人物与 C-3 正面 Lawson 的站位保持不变，只有 Lawson 与景墙背面的小 Charles 能接触暗角。"
