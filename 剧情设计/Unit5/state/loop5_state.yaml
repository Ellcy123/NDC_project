        - "小 Charles 来不及返回飞行模拟主厅，只能横起枪托卡住隔断下缘，在地面上方留下一道狭窄射击缝隙。"
        - "他要求 Emma 升起隔断。Emma 的拒绝属于固定人物行为；他随后隔着缝隙射伤 Emma 的左腿，期间不再交还玩家操作。"
        - "小 Charles 随即向 Vivian 开枪，试图迫使藏匿的 Lawson 自己现身。"
        - "Lawson 从单人校准舱的传声管里听见枪声与 Vivian 的惨叫，自行打开门冲出来保护她。"
        - "小 Charles 从缝隙中击伤 Lawson，但受隔断限制，无法立刻补枪。"
        - "飞行机械馆入口随即出现一个持枪人影；来人是谁，只负责揭晓此前被延迟的 A 结算，不会改变已经锁定的 B 成功。"
      exit_state:
        -
          continuation: "next_talk"
          next_talk: "L5_finale_arrival_reveal"
      hands_off_to:
        - "L5_finale_arrival_reveal"
