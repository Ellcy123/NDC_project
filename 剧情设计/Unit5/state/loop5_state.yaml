        - "防火隔断是机械馆闭馆后的消防改造，平时收在天花板夹层内。隔断与逃生门之间留有一块消防检修前室；主厅一侧的消防机械墙上设有多根实体拉杆及各自的机械线路。"
        - "消防逃生门已经被冻胀的门框与门外积雪卡死，短时间内无法打开；它从主厅看去仍像一条可信的逃生路线，正适合被 Emma 用作诱饵。"
        - "演出不立刻揭示 Emma 把 Lawson 推向哪一边。实际选择是让 Lawson 藏进主控台后的单人校准舱，并保持传声管畅通；Lawson 可以从内部自行开门。"
        - "Emma 与 Vivian 留在飞行模拟主厅一侧。Emma 面对消防机械墙上的多根实体拉杆，意识到终局现场没有 L2 旧消防维护卡原件，只能靠脑内记忆判断哪根拉杆控制防火隔断。"
