        - "Foster 随后出示 L4 已经取得的同一份 1928 年 TideWater 投毒文件，以及法医相关方提供的官方字迹鉴定报告；报告由专门鉴定人员签署，Foster 只负责在证言顺序中将其提交法庭。"
        - "字迹鉴定确认：投毒命令上的“老 Charles”签名实际由小 Charles 仿写；传递记录显示命令经 Pierce 的执行渠道送入南区。"
        - "该材料证明小 Charles 是投毒命令的真正签发者、Pierce 是知情执行者，但仍不能证明小 Charles 亲手杀死父亲。"
        - "Foster 最后确认：老 Charles 当晚的真正致命伤是刀伤，而不是坠落或其他伤势。"
        - "法官指出：刀伤只能确定死因，不能单独确定持刀者就是小 Charles。"
        - "Foster 示意自己的证言已经完成，该换下一组证人和物证。"
        - "法官的问题落下后，镜头扫过证物桌与唱片箱；Zack 与 Emma 对视，身体已经准备走向证物桌。"
        - "画面只保留一至两秒调查前摇，不开放界面，也不给玩家取得操作权。"
        - "Watts 抱着一张已经封存的母盘赶进法庭：“母盘在我办公室里啦！不用找了！”"
        - "Emma 在晚宴前只把舞台拾音线路单向接入 Watts 办公室的远端刻录设备，并不知道是否录制成功、母盘是否存在或录到了什么。"
        - "Watts 后来在办公室发现唯一母盘，按远端设备编号与录制日期登记、封存并形成书面保全记录；该记录已经先行提交法庭。"
        - "书记员核对母盘上的设备编号、日期、封条与在卷保全记录，法官准许播放。"
        - "笑点来自 Watts 的迟到和 Zack、Emma 刚准备继续工作的反应；本段不开放玩家操作。"
        - "唯一母盘被装上法庭留声机，并通过法庭内部扩音设备播放给法官、陪审团、记者与旁听者。"
        - "录音先播放老 Charles 临死前与小 Charles 的谈话，并留下能够明确辨认父子身份的称呼与回应。"
        - "随后响起小 Charles 实施致命刀刺以及仍留在现场的连续声音。"
        - "方才因 Zack 与 Emma 吵嘴而稍显松动的法庭气氛立刻冷下来。"
        - "记者席与旁听席一片哗然，法官敲槌也无法立刻恢复秩序。"
        - "场景停在公众第一次共同听见完整弑父真相的时刻。"
