    -
      event_id: "L5_finale_moore_depression"
      talk: "L5_finale_moore_depression"
      scene_id: 5039
      source_anchor: "剧情设计/Unit5/Unit5_误指坏结局.md:55"
      cast:
        - 501
        - 502
      player_control: false
      required_beats:
        - "约一周后，挤兑击穿艾斯弗德的银行、地产和市政信用。外部金融机构及时隔离风险，并依据暴露的问题提前避险，使 1929 年的全国危机只发展为短期衰退；艾斯弗德却独自陷入长期萧条，世博会、南区开发和 Tidewater 项目全部停摆。"
        - "失去 Miller 约束的银月会接管烂尾建筑、地下信贷和大批失业人员，正式成为公开的城市势力。银行劫案、绑架、私酒、保护费和帮派火并取代开发计划，艾斯弗德由此变成经典美国犯罪片式的帮派都市。"
        - "无尽犯罪让 Zack 的事务所异常繁荣。他有钱、有名、永远不缺客户，却清楚这些案件源于自己当年的错误裁决，因此开始拖延开案、只做最低限度的工作，不再相信破案能够让城市变好。"
        - "Emma 则成为著名犯罪记者。她一次次准备离开，又因新的失踪和冤案留下；她救下具体的人，报社却把整座城市的苦难经营成畅销的犯罪传奇。她越努力报道，艾斯弗德的“犯罪之城”品牌便越成功。两人偶尔仍交换案件材料，但不因此恢复原来的关系。"
      runtime_binding:
        kind: "chained_talk"
        adapter: "special_adapter"
        status: "not_implemented"
        unique_entry: true
      runtime_exit:
        action: "change_scene"
        target_scene_id: 5040
        continuation: "next_talk"
        next_talk: "L5_finale_moore_premiere"
      next: "L5_finale_moore_premiere"
    -
      event_id: "L5_finale_moore_premiere"
      talk: "L5_finale_moore_premiere"
      scene_id: 5040
      source_anchor: "剧情设计/Unit5/Unit5_误指坏结局.md:67"
      cast:
        - 501
        - 502
      player_control: false
      required_beats:
        - "好莱坞最终把艾斯弗德拍成犯罪电影，将 Zack 与 Emma 塑造成恢复城市秩序的英雄。结局在首映礼与真实街道之间交叉：观众在银幕前鼓掌，银月会仍控制着夜晚；Zack 面前还有一份没有打开的委托，Emma 又走向下一宗冤案，老 Charles 的真凶始终没有被揭露。"
        - "> 美国没有迎来大萧条，艾斯弗德独自承担了它。  \n> Zack 与 Emma 没有失去事业，反而被这座犯罪之城成就。"
      runtime_binding:
        kind: "chained_talk"
        adapter: "special_adapter"
        status: "not_implemented"
        unique_entry: true
