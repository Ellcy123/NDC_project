        - "若 A 成功，Emma 可以说出 Lawson 已成为唯一受益继承人、其异常死亡会触发外部追查等明确条款；若 A 失败，她只能抓住小 Charles 切断调查、又立即派人追杀 Lawson 的行动，试探 Lawson 究竟触碰了什么利益。A 失败分支不允许 Emma 引用“零散录音”、遗嘱原句或任何具体继承安排。"
        - "若 A 成功，Emma 逼问小 Charles：既然杀死父亲也拿不回继承权，他接下来还准备杀多少人；若 A 失败，她则逼问：为什么调查刚碰到夹层，他就非要 Lawson 死。"
