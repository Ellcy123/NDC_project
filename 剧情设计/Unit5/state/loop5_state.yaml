time: "1928年12月8—13日暴风雪封锁期间；本轮各调查段无另定精确分钟"
player_context:
  goals:
    - "到底是谁在众人进入现场后拿走了断翼鸢尾钥石；Lawson 房间里那套看似完整的凶手证据，究竟是他的秘密，还是别人替他写好的故事？"
    - "证明取石、闩门与暗门离场的行为链；将致命刀刺判断保留到最终裁决。"
  known_facts:
    - "Zack 持有水源风险与 Sean 旧报告异常页面，尚不足以定案老 Charles 对 1912 年事件的完整责任。"
    - "O'Hara 已送往圣心医院，Rosa 已得到同一水源风险警告。"
    - "Pierce 的镜中观察不能排除第二名正常入口者，未确认具体进入者。"
    - "中央镜至礼堂门约十秒、全程约二十秒，Pierce 打点低头十四秒。"
    - "Pierce 说21:15楼梯在B、破门却在A，尚须客观影像验证。"
    - "Emma 昏睡并被独立看守；她与 Zack 的信任尚未修复。"
    - "21:38止付发送联使用M-7提前登记死亡，授权人未知。"
    - "Emma 主动申请当天20:30—22:30彩排并约老 Charles 于21:30到舞台。"
    - "老 Charles 先高处坠落重伤，后遭致命刀刺；刀创喷溅早于楼梯B到A回转。"
    - "Vivian 隐瞒楼梯状态异常，不等于她操作楼梯、共谋或杀人。"
    - "A位顶端是用途不明的木合地布景板，尚不能称暗门。"
    - "Zack 没有隐瞒彩排批准联，Emma 见证他遵守查清真相的承诺。"
    - "9米内部总高减去下层Vivian3米及上层Lawson4米，剩约2米未登记夹层。"
    - "实地推开A位顶端暗门；Moore 指证后打开夹层地面通向书房天花板的第二入口。"
    - "Moore 携催收急件追入第一岔口，使用M-7提前止付，仍未证明其实施刀刺。"
    - "凌乱重叠鞋印至少分四组；除Moore与老Charles外另有两名未知经过者，身份和先后不明。"
    - "文件柜背后局部存在用途未明的异常隔音材质。"
    - "Mary 实为Lula，依Mickey留言寻找1912材料；她换药并进入档案区取页，准确时点未定。"
    - "紫片未正式鉴定，Lula自称安眠药；与E-12可能同源仅为嫌疑。"
    - "Emma 在录音室E-12杯旁失去行动能力，致命血迹形成后被拖到尸旁，持刀嫌疑洗清。"
    - "Emma 事先委托Watts安排远端单向刻录，但不知道是否录成或母盘是否存在。"
    - "Moore 已被隔离；Moore与Lula杀人嫌疑仍未排除。"
    - "同一份1928投毒文件看似老Charles签发，尚未鉴定签名真伪。"
  opening_facts:
    - "Emma 获释协查；Moore、Lula 保持隔离。"
    - "Vivian 仅确认彩排通知到 Pierce/Lawson、21:15 前安保回报及小 Charles 经手 E-12；消息转告与投药者未知。"
  new_directions:
    - "暗角的血迹负形、破门曝光、锁芯断齿与机关用途。"
    - "以 Lawson 的职业痕迹回查湿区，不识别四组鞋印身份与先后。"
    - "开门实验后还原照片墙，区分钥石知识与取石机会。"
  post_expose_knowledge:
    - "Emma 已获释协查，Moore与Lula仍被隔离且不因取石指证自动排除刀刺嫌疑。"
    - "完整拼回断齿的鸢尾钥石配合特殊三指握姿可以从暗门两侧退栓。"
    - "钥石在致命喷溅时已在暗角，22:10仍在、22:15被主动提走，机会者为Lawson与小Charles。"
    - "夹层可见湿迹没有Lawson鞋底晶屑对应的蓝色反应；教学照还原指向小Charles的钥石知识。"
    - "小Charles承认取石、内部闩门和暗门离场，仍否认致命刀刺；继承安排尚未揭晓。"
