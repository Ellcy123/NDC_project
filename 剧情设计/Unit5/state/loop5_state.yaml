        - "Lawson 撞开酒局房门逃跑，被 Pierce 一路追到夹层文件柜区域；他来不及询问调查结果，只来得及告诉众人 Pierce 要杀他。无论 A 成败，此时都不要求隐藏录音／试听室已经开启。"
