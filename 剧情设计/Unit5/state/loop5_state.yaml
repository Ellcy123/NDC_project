    -
      id: "L5_finale_mechanical_hide"
      source_anchor: "剧情设计/Unit5/Unit5_小Charles正确路线_终局线性流程.md:157"
      entry_state:
        - "从唯一合法前驱进入，按分支condition核验。"
      consumes:
        - "消费前段人物行动与未解决压力。"
      required_beats:
        - "飞行模拟主厅仍保留小 Charles 使用过的教学飞行台、机械星球仪，以及老 Charles 独自掌握的高位主控台。主控台后方有一间只能容纳一人的校准舱，另一侧则通向防火隔断后的消防逃生门。"
        - "防火隔断是机械馆闭馆后的消防改造，平时收在天花板夹层内。隔断与逃生门之间留有一块消防检修前室；主厅一侧的消防机械墙上设有多根实体拉杆及各自的机械线路。"
        - "消防逃生门已经被冻胀的门框与门外积雪卡死，短时间内无法打开；它从主厅看去仍像一条可信的逃生路线，正适合被 Emma 用作诱饵。"
        - "演出不立刻揭示 Emma 把 Lawson 推向哪一边。实际选择是让 Lawson 藏进主控台后的单人校准舱，并保持传声管畅通；Lawson 可以从内部自行开门。"
        - "Emma 与 Vivian 留在飞行模拟主厅一侧。Emma 面对消防机械墙上的多根实体拉杆，意识到终局现场没有 L2 旧消防维护卡原件，只能靠脑内记忆判断哪根拉杆控制防火隔断。"
      exit_state:
        -
          continuation: "next_talk"
          next_talk: "L5_finale_mechanical_hall"
      hands_off_to:
        - "L5_finale_mechanical_hall"
    -
      id: "L5_finale_mechanical_hall"
      source_anchor: "剧情设计/Unit5/Unit5_小Charles正确路线_终局线性流程.md:165"
      entry_state:
        - "从唯一合法前驱进入，按分支condition核验。"
      consumes:
        - "消费前段人物行动与未解决压力。"
      required_beats:
        - "小 Charles 的脚步声从连廊逼近。他持枪进入飞行机械馆时，谜题 B 立即开始，三格“Lawson 暴露风险”出现；他随后声称，自己已经知道 Pierce 追赶的人其实是 Zack。"
        - "这句话不向玩家证明 Zack 的生死，只用于打击 Emma 与 Vivian，让她们相信门外不会有援手。"
        - "Emma 一边拖延，一边把小 Charles 的注意力维持在自己身上，并缓慢向能够遮住消防逃生门标志、又靠近消防机械墙的位置移动。"
        - "若 A 成功，Emma 可以说出 Lawson 已成为唯一受益继承人、其异常死亡会触发外部追查等明确条款；若 A 失败，她只能抓住小 Charles 切断调查、又立即派人追杀 Lawson 的行动，试探 Lawson 究竟触碰了什么利益。A 失败分支不允许 Emma 引用“零散录音”、遗嘱原句或任何具体继承安排。"
        - "若 A 成功，Emma 逼问小 Charles：既然杀死父亲也拿不回继承权，他接下来还准备杀多少人；若 A 失败，她则逼问：为什么调查刚碰到夹层，他就非要 Lawson 死。"
        - "小 Charles 终于亲口承认老 Charles 是他杀的。A 成功时，他进一步声称只要 Lawson 死去，遗嘱与继承秩序仍能被他重新处理；A 失败时，他只承认 Lawson 活着会毁掉自己，不主动补出具体继承条款。"
        - "Emma、Vivian，以及藏在单人校准舱内的 Lawson，都听见这段承认。"
        - "对话拖延和移动站位构成 B 的前两轮一次性判断；任何错误都由 Emma 在演出中自行察觉并纠正，但会使“Lawson 暴露风险”增加一格，玩家不能回头重选。"
        - "Emma 到达主厅一侧、隔断轨道之外的正确站位后，用身体挡住消防逃生门标志。小 Charles 推开她，看见突然显露的标志后认定 Lawson 已从该处逃走，持枪越过隔断轨道，进入隔断与逃生门之间的消防检修前室。"
      exit_state:
        -
          continuation: "special_mechanic"
          mechanic: "finale_b"
      hands_off_to:
        - "L5_finale_b_blocked"
        - "L5_finale_b_blackout"
