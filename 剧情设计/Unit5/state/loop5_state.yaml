        - "Lawson 穿上 Zack 的衣物随 Emma、Vivian 撤离；Zack 则穿着 Lawson 的衣物从另一侧跑出，故意让 Pierce 只看见背影。停电、相近的衣物轮廓与未见正脸共同支撑误认；Pierce 不得在听清声音或看清面孔后仍认错人。"
        - "Pierce 追向 Zack；Emma、Vivian 护送真正的 Lawson 前往庄园另一端。Foster 让 Zack 把 Pierce 引向旧档案区附近原本就可进入的封闭试听室，自己转身赶往嫌疑人走廊。"
        - "众人分散后，小 Charles 取出另一把警用手枪，从侧廊追向 Emma、Vivian 与 Lawson。"
        - "追杀阶段不再进行谜题 A 选项、找遗嘱或其他搜证操作，只保留逃亡、延迟结算与双线交叉剪辑。"
