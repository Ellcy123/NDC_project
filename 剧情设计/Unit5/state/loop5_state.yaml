    source_text: "药效使她彻底失去行动能力、意识断续；被放到尸旁后，她曾短暂睁眼，看见楼梯控制箱附近有一只手用三指握住鸢尾石并转动。她没有看清操作者的面孔，无法辨认那个人，只能尝试复现手势。"
