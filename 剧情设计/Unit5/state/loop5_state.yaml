narrative_continuity:
  units:
    -
      id: "L5_opening_corridor_release"
      source_anchor: "剧情设计/Unit5/Unit5_大纲.md:796"
      entry_state:
        - "L4已洗清Emma持刀嫌疑；Lula仍未排除杀人。"
      consumes:
        - "Emma隔离状态需要依法在场解除。"
      required_beats:
        - "L4 的小推理已经证明 Emma 被下药，并在致命血迹形成后才从后台拖到舞台正面，她的持刀杀人嫌疑已经洗清。小 Charles 主动支持释放，更加坐实自己此前的“好人”形象。"
        - "Zack、小 Charles 与警员将 Lula 送入东侧客房走廊的另一间独立客房，随后释放 Emma。Emma 恢复共同调查者身份；Moore 与 Lula 仍各自隔离，两人的杀人嫌疑都没有被最终排除。"
      exit_state:
        - "强制段继续。"
      hands_off_to:
        - "L5_opening_cup_recollection"
    -
      id: "L5_opening_cup_recollection"
      source_anchor: "剧情设计/Unit5/Unit5_大纲.md:802"
      entry_state:
        - "前一opening事件已完成。"
      consumes:
        - "继续按杯号复核与公开流动。"
      required_beats:
        - "Emma 获释后，Zack 重新按杯号核对后台酒杯流转。Vivian 看见 E-12 标记后，才把此前没有确认到具体杯号的两段记忆连起来；Pierce 在 21:15 前完成检查，则来自他当时向 Vivian 作出的工作回报。Vivian 随后补充两段有限证词："
        - "这两条只建立两种彼此分开的机会：Pierce 与 Lawson 明确知道 Emma 会单独彩排；小 Charles 实际接触过她的酒杯。结合此前 Pierce 听从小 Charles 安排的暗示，玩家可以自行怀疑消息是否经 Pierce 传递，但 Zack 不说破，也不把转告写成已证实事实。"
      exit_state:
        - "强制段继续。"
      hands_off_to:
        - "L5_opening_study_review"
    -
      id: "L5_opening_study_review"
      source_anchor: "剧情设计/Unit5/Unit5_大纲.md:809"
      entry_state:
        - "前一opening事件已完成。"
      consumes:
        - "继续按杯号复核与公开流动。"
      required_beats:
        - "众人核对书房暗门与 TideWater 文件。"
      exit_state:
        - "强制段继续。"
      hands_off_to:
        - "L5_opening_hall_passage"
    -
      id: "L5_opening_hall_passage"
      source_anchor: "剧情设计/Unit5/Unit5_大纲.md:809"
      entry_state:
        - "前一opening事件已完成。"
      consumes:
        - "继续按杯号复核与公开流动。"
      required_beats:
        - "公开经过门厅；照片墙无调查热点，不提示调换。"
      exit_state:
        - "强制段继续。"
      hands_off_to:
        - "L5_opening_office_review"
    -
      id: "L5_opening_office_review"
      source_anchor: "剧情设计/Unit5/Unit5_大纲.md:809"
      entry_state:
        - "前一opening事件已完成。"
      consumes:
        - "继续按杯号复核与公开流动。"
      required_beats:
        - "Lawson 要求暂时封存公司文件，开放办公室供调查与庄园人员交错核对矿物登记、封存清单。"
      exit_state:
        - "强制段继续。"
      hands_off_to:
        - "L5_opening_stage_return"
    -
      id: "L5_opening_stage_return"
      source_anchor: "剧情设计/Unit5/Unit5_大纲.md:809"
      entry_state:
        - "前一opening事件已完成。"
      consumes:
        - "继续按杯号复核与公开流动。"
      required_beats:
        - "众人回到礼堂，开放本轮自由调查；此前往返没有任何人的排他独处窗口。"
      exit_state:
        - "释放共同调查控制；照片墙仍无热点。"
      hands_off_to:
        - "L5_talk_stage_lighting"
        - "L5_talk_stage_exposures"
        - "L5_event_tooth_closes_door"
    -
      id: "L5_talk_stage_lighting"
      source_anchor: "剧情设计/Unit5/Unit5_大纲.md:818"
      entry_state:
        - "场景解锁且该NPC普通入口可点击。"
      consumes:
        - "两张破门照片的暗角变化与 C-3 遮挡"
      required_beats:
        - "拍摄 22:10 第一张照片前，她让小 Charles 到 C-3 景墙背面帮忙打光；直到 22:15 第二张照片曝光，他都在那一带。她没有持续观察小 Charles 的双手。"
      exit_state:
