player_context:
  goals:
    primary: 验证公开楼层之间是否存在未登记空间，追查谁进入过并隐瞒了什么。
    secondary:
      - 先测量建筑高度，再判断 A 位顶端布景板是否值得实地检查。
      - 核实 Moore 公文夹的缺损、追签目的及 M-7 提前死讯。
  known_facts:
    - Zack 持有水源风险与 Sean 旧报告异常页面，尚不足以定案老 Charles 对 1912 年事件的完整责任。
    - O'Hara 已送往圣心医院，Rosa 已得到同一水源风险警告。
    - Pierce 的镜中观察不能排除第二名正常入口者，未确认具体进入者。
    - 中央镜至礼堂门约十秒、全程约二十秒，Pierce 打点低头十四秒。
    - Pierce 说21:15楼梯在B、破门却在A，尚须客观影像验证。
    - Emma 昏睡并被独立看守；她与 Zack 的信任尚未修复。
    - 21:38止付发送联使用M-7提前登记死亡，授权人未知。
    - Emma 主动申请当天20:30—22:30彩排并约老 Charles 于21:30到舞台。
    - 老 Charles 先高处坠落重伤，后遭致命刀刺；刀创喷溅早于楼梯B到A回转。
    - Vivian 隐瞒楼梯状态异常，不等于她操作楼梯、共谋或杀人。
    - A位顶端是用途不明的木合地布景板，尚不能称暗门。
    - Zack 没有隐瞒彩排批准联，Emma 见证他遵守查清真相的承诺。
  historical_fact_policy: 已知事实为前序原句累计；历史昏睡状态不覆盖 L2 已苏醒状态。
  opening_facts: [本轮将以实测验证公开楼层是否占满建筑，不凭门缝宣布暗道。]
  new_directions:
    - 舞台通高与 Vivian、Lawson 房间净高及对应楼板厚度。
    - M-7 的持有人与公文夹缺损；确认夹层后才调查追签痕迹。
  post_expose_knowledge_ref: post_expose_knowledge
