post_expose_knowledge:
  - 9米内部总高减去下层Vivian3米及上层Lawson4米，剩约2米未登记夹层。
  - 实地推开A位顶端暗门；Moore 指证后打开夹层地面通向书房天花板的第二入口。
  - Moore 携催收急件追入第一岔口，使用M-7提前止付，仍未证明其实施刀刺。
  - 凌乱重叠鞋印至少分四组；除Moore与老Charles外另有两名未知经过者，身份和先后不明。
  - 文件柜背后局部存在用途未明的异常隔音材质。
