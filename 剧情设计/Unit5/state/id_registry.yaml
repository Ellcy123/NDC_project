  - 517年迈Mary不是509冒名护工Lula。年龄变化不新增身份事实。
  - 证言采用NPC三位+Loop一位+序号三位；本章独立5xx角色空间，避免既有章节同NPC同Loop重号。
  - 每轮证言001起，动态谎言901起；原物回查沿用原ID。正式Talk只分配逻辑名。
  - source中的未编号普通剧情纸条/交付页可用本loop的xx20起补充；不得生成新事实。
