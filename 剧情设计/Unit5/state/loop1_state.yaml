  A: PASS——合同根字段与唯一场景齐全
  B: PASS——六件原始证物与六件环境逐项分配
  C: PASS——四个自由NPC含内联原文；R2以上只在Expose
  D: PASS——只查入口观察可靠性
  E: PASS——后续真相隔离；开篇两次曝光不解读暗角
  F: PASS——手帕关系可跳过，无本轮quiz
  G: PASS——三轮证据对应唯一疑点
  H: DESIGN_REVIEW_PASS——独立逐项覆盖审查已通过
  I: PASS——七段根Opening，圆桌后才释放
  J: DESIGN_REVIEW_PASS——跨轮目标与已声明适配设计通过交叉审
