unit: Unit5
episode: EPI05
loop: 1
chapter_id: 501
title: Pierce——镜子里一直关着的门
schema_contract: state_contract.yaml
validation_status: DESIGN_REVIEW_PASS
player_context:
  goals:
    - 查验唯一正常入口的值守能否排除另一名进入者。
    - 分清 Pierce 的实际观察、镜中误判与走廊耗时。
  known_facts:
    - Zack 持有水源风险与 Sean 旧报告异常页面，尚不足以定案老 Charles 对 1912 年事件的完整责任。
    - O'Hara 已送往圣心医院，Rosa 已得到同一水源风险警告。
  opening_facts:
    - Emma 因 Zack 扣下水源风险与 Sean 材料而决裂，独自前往庄园。
    - 晚宴广播把 Emma 对十六年前死亡的公开质问定性为女记者骚乱。
    - 老 Charles 死于舞台；Emma 昏迷在尸旁，握着与伤口吻合的餐刀。
    - 圆桌同意继续调查，调查推理须向众人公开；Emma 暂置独立客房看守。
  new_directions:
    - 走廊镜像、巡警惯用手与 Pierce 值守记录。
    - 衣物血迹的来源与通信台的提前死讯只留待后续调查。
  forbidden_conclusions:
    - 具体进入者、刺刀者、反锁后的离场路线。
    - 夹层、钥石、E-12 投药、远端刻录与继承安排。
opening:
  type: cutscene_sequence
  runtime_root: {table: ChapterConfig, init_scene: 5001, init_talk: L1_opening_hospital_break}
  sequence:
    - event_id: hospital_break
      talk: L1_opening_hospital_break
      scene_id: 5001
      location: 圣心医院走廊
      cast: [501, 502]
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:122
      required_beats:
        - O'Hara 进入急诊，Rosa 已收到水源警告；Emma 因看见投水点书页在急诊室外拦住 Zack。
        - Emma 追问他为何只说强制清退，隐去水源风险与 Sean 页面；回扣谈 Mary 时不再删减真相的承诺。
        - Zack 承认恐惧 Emma 重蹈 Harrison、Morrison、Mickey 的命运并扣下材料；恐惧不能抵消越界。
        - Zack 把持有页面交给 Emma，只承认 Sean 不是可照旧归档的普通事故，不能定案老 Charles 的完整责任。
        - Emma 指出他又替她决定知情时机，离开并明确要求别跟上来；关系断裂不靠一句道歉恢复。
      evidence_transfers:
        - {kind: existing_story_material, from: 501, to: 502, content: Zack 已持有的水源风险与 Sean 旧报告页面, inventory_effect: no_new_item}
      runtime_exit: {action: change_scene, target_scene_id: 5002, continuation: next_talk, next_talk: L1_opening_office_departure}
    - event_id: office_departure
      talk: L1_opening_office_departure
      scene_id: 5002
      location: Watts 办公室
      cast: [501, 514]
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:148
      required_beats:
        - Zack 赶到时 Emma 已整理材料离开，只留下无法再共事、无法相信他的真相、只能独自走的纸条。
        - Watts 以 Harrison 前书记员及法院程序协助者经验核对材料和公开活动，判断 Emma 可能去了慈善纪念晚宴。
        - Zack 独自出发；Watts 留守处理 Emma 托付的程序安排，本场不说明内容，不赋予警员或司法权力。
      story_props:
        - {name: Emma 留给 Zack 的纸条, collectible: false, content: '我们没有办法再一起共事了。现在，我没有办法相信从你嘴里说出的真相。接下来的路，我只能一个人走。'}
      runtime_exit: {action: change_scene, target_scene_id: 5003, continuation: next_talk, next_talk: L1_opening_drive_broadcast}
    - event_id: drive_broadcast
      talk: L1_opening_drive_broadcast
      scene_id: 5003
      location: 赶路车内
      cast: [501, 519]
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:159
      required_beats:
        - 车内无线电播出艾斯弗德晚报现场短讯；把 Emma 当众指控 Charles 与十六年前死亡有关的行为写成骚乱。
        - 播报维护慈善家名望，删掉 O'Hara、水源风险与 Sean 名字，只留下失控记者与受辱慈善家。
        - 抵达、要求进入时，用又一位私家侦探要求入庄园的补讯收尾。
      runtime_exit: {action: change_scene, target_scene_id: 5004, continuation: next_talk, next_talk: L1_opening_prologue_callback}
    - event_id: prologue_callback
      talk: L1_opening_prologue_callback
      scene_id: 5004
      location: 庄园二楼走廊／既有序幕短回扣
      cast: [501, 502, 510]
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:177
      required_beats:
        - 8—12 秒依次回扣明晨新闻稿的确认演讲人、资助关系逼迫 Emma 发声、全城最大讲台、记者闪光灯。
        - 立即回到 22:00 前现在；不重玩教程，不复演短刀展柜、案发闪切、标题或一个月前。
      runtime_exit: {action: next, next_talk: L1_opening_upstairs_interruption}
    - event_id: upstairs_interruption
      talk: L1_opening_upstairs_interruption
      scene_id: 5004
      location: 庄园二楼走廊
      cast: [501, 507, 511]
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:181
      required_beats:
        - Zack 因 Emma 在威逼下同意演讲而低落，独自在二楼走廊抽烟。
        - 小 Charles 在逆光中把背影误认成 Lawson，Zack 转身立刻纠正；只建立衣着、背影、低照明相似。
        - 隔窗谈西丘已关闭的 Miller 飞行机械馆；小 Charles 只说父亲在自己年幼时专门修建。
        - 建立庄园原则上禁宾客携枪、由 Pierce 管理的规则；Zack 本就无枪，不演交枪、搜查或寄存，不承诺全员搜净。
        - 警员打断，报告舞台发现尸体，Emma 倒在旁边且被怀疑杀人；不进入雪地。
      runtime_exit: {action: change_scene, target_scene_id: 5005, continuation: next_talk, next_talk: L1_opening_stage_exposures}
    - event_id: stage_exposures
      talk: L1_opening_stage_exposures
      scene_id: 5005
      location: 舞台正面
      cast: [501, 502, 503, 504, 505, 506, 507, 508, 510, 511, 512]
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:189
      required_beats:
        - 承接警员报告交代 22:00 撞开内部上闩的礼堂门、门槛外发现尸体与 Emma，控制入口再允许必要人员入内。
        - Zack 与小 Charles 赶到，Zack 护住 Emma，小 Charles 协助封锁，Pierce 派警员通知众人。
        - Lawson 联系公司律师、要求暂缓公司文件放行；Vivian 震惊，Moore 刻意落后。
        - 22:10 Foster 让小 Charles 去 C-3 背面打光，Lawson 正面靠近暗角确认呼吸；摄影师拍第一张底片。
        - 相机与装置保持不动、换底片；22:15 拍第二张。演出保持人物站位，不给暗角取石动作或两张暗角差异的特写结论。
        - 第二张完成后 Pierce 将众人带去圆桌，不重复演调查规则。
      staging_constraints:
        - 底片物理内容按大纲195—197固定；L2才读取全景，L5才放大暗角。
        - 此时不发放照片组，不提取 Foster 的 C-3 正式站位证言。
      runtime_exit: {action: change_scene, target_scene_id: 5006, continuation: next_talk, next_talk: L1_opening_roundtable_rules}
    - event_id: roundtable_rules
      talk: L1_opening_roundtable_rules
      scene_id: 5006
      location: 圆桌会议室
      cast: [501, 503, 504, 506, 507]
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:247
      required_beats:
        - Pierce 据 Emma 尸旁持刀、公开冲突准备逮捕；Zack 只要求排除另一进入者，不保证她无罪。
        - Vivian 要求查清，Lawson 承认工作争执、反对调查并以总裁身份要求封存公司文件待律师。
        - 小 Charles 支持查清并接受 Lawson 的每次形成推理须向众人公开的条件，允许平等质询 Pierce。
        - Pierce 坚持逮捕后等待小 Charles 的一眼示意，改为客房看守；不解释两人是否交换案情，不生成证词。
        - Emma 仍昏睡，被安置到东侧独立客房；走廊鬼影与十四秒留给普通询问。
      runtime_exit: {action: release_to_exploration}
  player_control_restored_after: roundtable_rules
