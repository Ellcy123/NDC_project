expose:
  id: 501
  scene_id: 5006
  target_npc: 503
  is_liar: true
  player_inquiry: null
  talk: L1_expose_pierce
  source_anchor: 剧情设计/Unit5/Unit5_大纲.md:338
  progress: {doubts: 3, fragments: 0, denominator: 3, required_percent: 100}
  prerequisites:
    required_doubt_ids: [5101, 5102, 5103]
    required_item_ids: [5101, 5102, 5103, 5104, 5105, 5106]
    required_environment_ids: [5151, 5152, 5154, 5155, 5156]
    required_testimony_ids: [5031001, 5051001, 5111001]
    required_talks: [L1_talk_corridor_watch, L1_talk_stage_medical, L1_talk_security_patrol, L1_talk_roundtable_noise]
    previous_events_completed: [roundtable_rules, c3_encounter, backstage_warning]
    runtime_status: special_adapter_required
  expose_lie_ids: [5031901, 5031902]
  rounds:
    - round: 1
      lie_source: 5031001
      lie: 我看见的是用左手抽烟的 Morrison；那个人随后就消失了。
      evidence_set: [{type: item, id: 5103}]
      result: 镜像把右手变成左手，所见者是当晚巡警而非死去的 Morrison；不识别转镜者。
      retreat: 那不可能。警员当时已经离开走廊了，他怎么会又出现在我面前？
    - round: 2
      lie_source: 5031901
      lie: 警员已经离开走廊，不可能又出现在我面前。
      evidence_set: [{type: environment_observed, id: 5154}]
      result: 偏转镜面纳入衣帽间门与继续离去的巡警；巡警没有折返，是观察方向改变。
      retreat: 即使有人转了镜子，也不可能进入礼堂。入口到礼堂门要二十秒，我只低头十四秒。
    - round: 3
      lie_source: 5031902
      lie: 即使那个人当时就在镜子旁，十四秒也不够他进入礼堂。
      evidence_set: [{type: testimony, id: 5111001}, {type: item, id: 5104}]
      result: 二十秒为全程；镜后约十秒，十四秒足够转镜并走剩余路程。只证明可行性。
  post_expose:
    talk: L1_post_expose_observation
    scene_id: 5006
    source_anchor: 剧情设计/Unit5/Unit5_大纲.md:367
    testimony_ids: []
    required_beats:
      - Pierce 承认没有故意离岗，但镜面可能替换观察方向；不知道转镜者，也不能确认第二人实际采用路线。
      - 补充自己21:15最后看舞台楼梯在B，破门却在A；刚被证明误判，必须寻找客观影像。
      - Emma 仍在独立客房昏睡，苏醒、记忆与承诺留到下一轮。
    runtime_exit: {action: loop_end, next_loop: 2, next_talk: L2_opening_waking_promise}
post_expose_knowledge:
  - Pierce 的镜中观察不能排除第二名正常入口者，未确认具体进入者。
  - 中央镜至礼堂门约十秒、全程约二十秒，Pierce 打点低头十四秒。
  - Pierce 说21:15楼梯在B、破门却在A，尚须客观影像验证。
  - Emma 昏睡并被独立看守；她与 Zack 的信任尚未修复。
  - 21:38止付发送联使用M-7提前登记死亡，授权人未知。
