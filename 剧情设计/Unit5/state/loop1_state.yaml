narrative_continuity:
  units:
    - {id: L1_opening, entry_state: U4水源事件后, consumes: 隐瞒造成的知情冲突, required_beats: [医院决裂, Watts留守, 赶路广播, 序幕回扣, 楼上误认, 两次曝光, 圆桌规则], exit_state: Emma昏睡隔离且调查获准, hands_off_to: L1_stage_talk}
    - {id: L1_stage_talk, entry_state: 尸旁持刀表象, consumes: 死因尚未确认, required_beats: [Foster仅确认刀伤, 衣物记录小线索], exit_state: 死亡顺序仍未完整, hands_off_to: L1_corridor_talk}
    - {id: L1_corridor_talk, entry_state: 唯一入口监视主张, consumes: Pierce确信观察可靠, required_beats: [取得鬼影原话, 现场查看两门与镜子], exit_state: 需要核对巡警身份与耗时, hands_off_to: L1_patrol_talk}
    - {id: L1_patrol_talk, entry_state: 左手鬼影待核实, consumes: 惯用手与耗时缺口, required_beats: [右袋右手取烟, 全程二十秒与中央镜十秒, 十四秒纸带], exit_state: 具备三维检验证据, hands_off_to: L1_c3_event}
