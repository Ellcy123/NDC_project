    - {id: L1_backstage_event, entry_state: 自由探索后台, consumes: Vivian争取调查空间, required_beats: [私下劝阻后改口善后], exit_state: 控制关系仅留暗示, hands_off_to: L1_lawson_talk}
    - {id: L1_lawson_talk, entry_state: 圆桌公开的工作冲突, consumes: Lawson不信任, required_beats: [地板下声音, 展示后收回监印], exit_state: 照片与非正式声音记录, hands_off_to: L1_expose}
