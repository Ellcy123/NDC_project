expose:
  id: 504
  scene_id: 5024
  talk: L4_expose_mary
  target_npc: 509
  is_liar: true
  player_inquiry: null
  source_anchor: 剧情设计/Unit5/Unit5_大纲.md:706
  runtime_binding:
    type: special_adapter
    required_doubt_ids: [5401, 5402, 5403]
    required_item_ids: [5401, 5402, 5403, 5404, 5405, 5406, 5407, 5408, 5409, 5101, 5312]
    required_environment_ids: [5451, 5452, 5453, 5457, 5458]
    required_talks: [L4_talk_foster_e12, L4_talk_butler_medication, L4_talk_mary_delivery]
    required_testimony_ids: [5054001, 5134001, 5094001]
    required_flags: [u5_moore_isolated, u5_emma_remote_plan_disclosed]
    completion_event: L4_expose
  expose_lie_ids: [5094901, 5094902]
  rounds:
    - round: 1
      lie_source: 5094001
      lie: 我送进去的就是 Charles 平时服用的两片蓝色药物。我没有换过药。
      lie_source_relation: 普通送药原句是语义锚；本句为指证现场重申加码，不提前改写普通证词。
      required_testimony_ids: [5134001, 5094001]
      evidence_set: [{type: item, id: 5403}, {type: item, id: 5404}]
      doubt_ids: [5401]
      result: 正常药盒图像是蓝色，吐出的整剂为近乎完整的两片紫色药；结合亲手送达且未转手，证明送入整剂被替换。
      retreat: 好，是我换的。但那不是毒药，只是安眠药。我需要让他睡上一会儿。
      boundary: Zack 不接受也不否定药性自述，只追问失能目的。
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:710
    - round: 2
      lie_source: 5094901
      lie: 那只是护理判断。我没有进入过书房暗门，也没有从夹层拿走任何东西。
      evidence_set: [{type: item, id: 5407}]
      required_environment_ids: [5457]
      doubt_ids: [5402]
      result: 护工房里的原页对应暗门后缺口，先击破与材料无关；物证本身不独立证明亲手撕页或进入时点。
      retreat: 我承认进去过，也拿走了那一页。但我只是替人取回一份材料。这与 Charles 的死无关。
      boundary: 她的主动承认坐实进入与取页；准确时间、是否遇人仍未知。
      next_mechanic: mickey_inference
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:720
    - round: 3
      lie_source: 5094902
      lie: 我当然是 Mary Jones。为什么要问这个？
      required_flags: [u5_mickey_inference_completed]
      evidence_set: [{type: item, id: 5408}, {type: item, id: 5409}]
      doubt_ids: [5403]
      result: 真正 Mary 三天前才入境，一周前却已有人在芝加哥收下并拆开 Mickey 来信；护工冒名，是实际收信人。
      dramatic_reveal: 摘下面罩，承认自己是 Lula Washington。
      source_anchor: 剧情设计/Unit5/Unit5_大纲.md:739
  post_expose:
    event_id: L4_drug_dispute
    talk: L4_post_expose_drug_dispute
    scene_id: 5024
    cast: [501, 503, 505, 509]
    source_anchor: 剧情设计/Unit5/Unit5_大纲.md:751
    runtime_binding: {type: chained_talk, sole_entry: L4_expose_mary, previous_event_completed: L4_expose}
    required_beats:
      - Lula 仅承认受 Mickey 留言引导，找 Frank 相关 1912 材料、进入取页及换成紫片。
      - Lula 坚称紫片是普通片剂安眠药，为继续搜档而让老 Charles 睡着。
      - Pierce 以冒名、换药、暗门提出杀人指控，质疑谁能证明不是毒药。
      - Lula 要求封存紫片，暴风雪结束后正式送检。
      - Foster 说明庄园不能可靠比对成分；L4、L5、最终投票前药性仍未知。
    testimony_ids: []
    knowledge_boundary: 此处药性只是 Lula 自述；不生成正式鉴定结果。
    runtime_exit: {action: change_scene, target_scene_id: 5011, continuation: next_talk, next_talk: L4_event_clear_emma}
post_expose_knowledge:
  - Mary 实为Lula，依Mickey留言寻找1912材料；她换药并进入档案区取页，准确时点未定。
  - 紫片未正式鉴定，Lula自称安眠药；与E-12可能同源仅为嫌疑。
  - Emma 在录音室E-12杯旁失去行动能力，致命血迹形成后被拖到尸旁，持刀嫌疑洗清。
  - Emma 事先委托Watts安排远端单向刻录，但不知道是否录成或母盘是否存在。
  - Moore 已被隔离；Moore与Lula杀人嫌疑仍未排除。
  - 同一份1928投毒文件看似老Charles签发，尚未鉴定签名真伪。
source_constraints:
  - Mary／Lula 始终同一个 NPC 509；揭名不新增身份实体。
  - 进入夹层准确时点、是否与 Moore 碰面为幕后，玩家本轮不能推出。
  - L5 才由 Vivian 提供彩排通知对象及小 Charles 经手 E-12 的有限口头记录。
  - 本轮不揭示钥石三指握姿、使用者、照片换位、继承安排或墙后隐藏房间。
  - E-12 安眠药痕迹已确认；紫片既不能定普通安眠药，也不能定毒药。
  - 1912 材料与 1928 投毒文件为不同原件；1928 文件首读误认签署与终局鉴定必须是同一原件的分层观察。
  - Mary 房间普通护工生活痕迹不增加新证物，乙醚只在护士站。
