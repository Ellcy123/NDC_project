      - 4072001
      - 4072002

  L2_opening_mickey:
    talk: L2_opening_mickey
    is_liar: false
    motive: "真实帮助 Rosa 延迟庭审、获得辩护与正式调查窗口，同时把风险控制在医院执行层"
    mindset: "对 Rosa 温和且有效；面对 Zack 时先界定当前可证明的问题，不显露反派相"
    active_topics:
      - "已为 Rosa 争取到庭审前的短暂调查窗口"
      - "愿意担任 Rosa 的辩护律师"
      - "Harrison 留下的死亡对照与药剂样本可以启动正式复核"
      - "当前首先必须排除家属加量并证明药剂进入正式项目"
    withheld_topics:
      - "Mickey 是 W / Whale"
      - "Donnelly & Associates 与 1919-A 的实际控制关系"
      - "Mickey 主动希望调查止于 Whitfield 的完整原因"
    player_inquiry:
      - "Mickey 争取到多少调查时间"
      - "法院当前允许提交哪些材料"
      - "如果 Rosa 拒签，程序上将面对什么"
