  description: '事务所桌面被 Rosa 带来的生活物件占满：照片、十三格药盒、玻璃注射器与回收药瓶。

    这一场不把 Rosa 当报道素材；Emma 在关键私人时刻放下笔记本，

    Zack 先核对物件，Mickey 只说明法律窗口与签字后果。

    '
  evidence:
  - id: 4211
    name: 医院配发红线注射器与十三日封签药盒
    type: item
    pickup: true
    note: Expose R1；不可移动金属止动环限制单次剂量，十三日指纹确认条与十三格按日开启共同限定逐日操作
    description: 医院标记玻璃注射器的红线处有不可移动的金属止动环，单次抽取不能越过规定剂量；药盒外沿保留十三日指纹确认条，十三格均按日开启并留有 Rosa 的指纹确认
    acquisition:
      kind: dialogue
      talk: L2_scene4011_rosa
  - id: 4212
    name: Isabel使用后的封签药瓶
    type: item
    pickup: true
    note: 分析前原物；在 Foster 实验室更新为 4702
    description: 保留医院封签、批次标记与剩余液量的回收药瓶；Rosa 只有这一瓶
    acquisition:
      kind: dialogue
      talk: L2_scene4011_rosa
  npcs:
    L2_scene4011_rosa:
      name: Rosa Martinez
      talk: L2_scene4011_rosa
      is_liar: false
      motive: 把自己实际如何按护士红线用药说清，并交出仍可核验的药盒、注射器和回收药瓶
      mindset: 自责仍在，但只回答自己亲手做过的步骤；不替医院判断药剂来源
      active_topics:
      - 自己不识剂量单位，只会把药液抽到护士画出的红线
      - 十三格药盒每天按日开启并留下指纹确认
      - 自己从未拿到第二只药瓶
      withheld_topics:
      - 无；Rosa不知道问题批次为何进入医院，也不知道Whitfield或Miller的上层责任
      player_inquiry:
      - 每次如何确定抽取剂量
      - 十三日药盒如何开启
      - 是否存在第二只药瓶或额外注射
      testimony_ids: []
      grants_evidence:
      - 4211
      - 4212
- id: 4012
  name: 圣心医院 / Miller 事故基金病房
  type: free_exploration
  description: '病房整洁、秩序严密，康复名册与感谢信真实存在。项目确实救过人，

    不能被写成从一开始就是骗局。与此同时，贫困家属面对医生、护士和项目文件时

    几乎没有质疑空间；慈善成果与责任转移在同一空间并存。

    '
  evidence:
  - id: 4216
    name: Miller事故基金病房铭牌与康复名册
    type: envir
    pickup: false
    note: 环境材料；证明项目确有真实成果，不参与本轮 Expose
    description: 病房铭牌、历年康复儿童名册与家属感谢卡；其中没有本轮责任判断
- id: 4013
  name: Foster 法医实验室
  type: free_exploration
  design_tags:
  - analysis
  description: 'Foster 接续 Harrison 生前已经启动的封存与调取手续，对回收药瓶的容量、

    同批药瓶封签和问题批次样本进行目标明确的加急对照。她先说测量结果，

    再说结论边界；不使用现代浓度曲线，也不把技术异常直接写成故意投毒。

    '
  analysis_operations:
  - output_id: 4702
    name: 经容量分析的回收药瓶
    inputs:
    - 4212
    - 4211
    boundary: 只能核对实际消耗量是否存在额外注射缺口
  - output_id: 4703
    name: 经化验的问题批次药剂
    inputs:
    - 4118
    - 4213
    boundary: 证明同批样本有效成分浓度波动并含异常降解杂质，且不能用单支家庭保存不当解释；不判断故意投毒或批准者主观知情
  evidence:
  - id: 4213
    name: 同批次药瓶封签组
    type: item
    pickup: true
    note: Expose R2；Foster 接续 Harrison 生前已启动的封存/调取手续
    description: 另外两名死亡儿童的空药瓶封签，与 Rosa 药瓶和 Harrison 样本批次标记一致
    acquisition:
      kind: dialogue
      talk: L2_scene4013_foster
  - id: 4702
    name: 经容量分析的回收药瓶
    type: clue
    pickup: false
    analysis: true
    note: Expose R1；与 4211 共同排除额外注射
    description: 按瓶体标定与剩余量核对，十三日实际消耗不存在规定剂量之外的一次额外注射缺口
  - id: 4703
    name: 经化验的问题批次药剂
    type: clue
    pickup: false
    analysis: true
    note: Expose R3；不越过 1928 年技术能力宣称完整毒理定案
    description: 加急化验显示同批样本有效成分浓度波动异常，并含不应出现在成品中的降解杂质；连续使用可能造成严重低血糖反应与器官损伤，单支家庭保存不当不足以解释多支同批异常
    acquisition:
      kind: dialogue
      talk: L2_scene4013_foster
  npcs:
    L2_scene4013_foster:
      talk: L2_scene4013_foster
      is_liar: false
      motive: 把本次样本真正能够证明的专业判断说完整，不再替错误结论留下方便的模糊退路
      mindset: 专业、精确、克制；先给测量结果，再限定这份材料能证明什么，绝不追加动机判断
      active_topics:
      - 容量核对可以判断是否存在额外用量缺口
      - 另外两名死亡儿童的药瓶封签与本案属于同批
      - 加急效价对照显示同批样本效力明显不一致
      - 化验发现不应出现在成品中的降解杂质，连续使用可能造成严重低血糖反应与器官损伤
      - 单支家庭保存不当不足以解释多支同批异常
      withheld_topics:
      - 1912 年 Sean O'Malley 尸检签字经历
      - Miller 资助与 Foster 职业道路的完整关系
      - 谁批准问题批次进入医院
      - 对 Whitfield 主观知情或 Mickey 身份的推测
      player_inquiry:
      - 回收药瓶的实际消耗量是否支持额外注射
      - 其他死亡儿童药瓶是否属于同一批次
      - 现有加急试验可以排除什么、不能证明什么
      grants_evidence:
      - 4213
      - 4703
      testimony_ids:
      - id: 4082002
        content: 这不是"保存不好"能造成的单支异常，同批封签在进入家庭前就有问题。
        kind: collectible
        speaker: 408
        source_anchor: active outline / Loop2 / 自由探索 / 法医实验室 / ⚪
        acquisition_talk: L2_scene4013_foster
