scenes:
- id: 4011
  name: Zack 侦探事务所
  type: free_exploration
  design_tags:
  - opening
  description: '事务所桌面被 Rosa 带来的生活物件占满：照片、十三格药盒、玻璃注射器与回收药瓶。

    这一场不把 Rosa 当报道素材；Emma 在关键私人时刻放下笔记本，

    Zack 先核对物件，Mickey 只说明法律窗口与签字后果。

    '
  evidence:
  - id: 4211
    name: 医院配发红线注射器与十三日封签药盒
    type: item
    pickup: true
    note: Expose R1剧情辅助；不可移动金属止动环限制单次剂量，十三日指纹确认条与十三格按日开启共同限定逐日操作
    description: 医院标记玻璃注射器的红线处有不可移动的金属止动环，单次抽取不能越过规定剂量；药盒外沿保留十三日指纹确认条，十三格均按日开启并留有 Rosa 的指纹确认
    acquisition:
      kind: dialogue
      talk: L2_scene4011_rosa
  - id: 4212
    name: Isabel使用后的封签药瓶
    type: item
    pickup: true
    note: 分析前原物；在 Foster 实验室更新为 4702
    description: 保留医院封签、批次标记与剩余液量的回收药瓶；Rosa 只有这一瓶
    acquisition:
      kind: dialogue
      talk: L2_scene4011_rosa
  - id: 4217
    name: Isabel的病历本
    type: item
    pickup: true
    note: Expose R1剧情辅助；用于核对十三日医嘱、药剂发放号和4214中的本案正式发放链
    description: Rosa长期保管的Isabel病历本，记录十三日给药要求、药剂发放号与制剂信息；不包含七例死亡对照或Miller上层结论
    acquisition:
      kind: dialogue
      talk: L2_scene4011_rosa
  npcs:
    L2_scene4011_rosa:
      name: Rosa Martinez
      talk: L2_scene4011_rosa
      is_liar: false
      motive: 把自己实际如何按护士红线用药说清，并交出仍可核验的药盒、注射器和回收药瓶
      mindset: 自责仍在，但只回答自己亲手做过的步骤；不替医院判断药剂来源
      active_topics:
      - 自己不识剂量单位，只会把药液抽到护士画出的红线
      - 十三格药盒每天按日开启并留下指纹确认
      - 自己从未拿到第二只药瓶
      - Isabel 病历本中的十三日给药要求、药剂发放号与制剂信息
      withheld_topics:
      - 无；Rosa不知道Isabel本案药剂的采购与批准链，也不知道Whitfield或Miller的上层责任
      player_inquiry:
      - "Rosa亲手执行的十三日用药步骤" # 10
      - "医院配发物与回收药瓶" # 9
      - "Isabel病历本与药剂发放记录" # 10
      testimony_ids: []
      grants_evidence:
      - 4211
      - 4212
      - 4217
- id: 4012
  name: 圣心医院社会服务部 / Miller项目登记区
  type: free_exploration
  access:
    always_open: true
    unlock_condition: []
  progression_rules:
    forced_wait: false
    required_environment_investigation_count: 0
    archive_special_talk_requires_only:
    - 4218
  description: '社会服务部与Miller项目登记区始终开放。基金铭牌、康复儿童名册、历年救助统计与感谢信

    真实记录项目帮助过许多儿童；完整病历由中央病案室保管。调档员的基础对话与环境调查始终可用，

    不设强制等待或调查数量门槛。取得4218后，玩家可自行选择何时提交Harrison的七个编号。

    '
  evidence:
  - id: 4216
    name: Miller事故基金项目铭牌与康复名册
    type: envir
    pickup: false
    note: 场景道具
    description: Miller事故基金铭牌、康复儿童名册、历年救助与康复统计及受助家庭感谢信；只证明项目确有真实成果，不参与本轮Expose
  - id: 4219
    name: 五年七例儿童死亡病例对照表
    type: clue
    pickup: false
    note: 关键——Expose R2；七份正式病例展示完成后由4117更新生成
    description: 玩家依据七份正式病历完成的对照结果：五年内七个编号均对应死亡儿童，全部由Whitfield负责的Miller慈善项目经手，并反复出现相似低血糖反应、器官损伤及家属误用、加量或保存不当等归责记录；不证明七人使用同一完整配方或生产批次
    acquisition:
      kind: dialogue
      talk: L2_scene4012_records_clerk
      carrier: npc_branch
  npcs:
    L2_scene4012_records_clerk:
      name: 中央病案室调档员
      talk: L2_scene4012_records_clerk
      is_liar: false
      motive: 守住病历权限边界，只在正式许可覆盖的范围内核对编号、翻页和摆放档案
      mindset: 行政化、克制；只说明流程和纸面字段，不替调查者归纳七例共同点
      active_topics:
      - 社会服务部负责慈善登记、家庭联络与项目资料管理
      - 完整病历由中央病案室保管，没有正式许可不能查询具体患者记录
      - 取得4218后可以提交Harrison纸条上的七个编号
      withheld_topics:
      - 七个编号对应的患者身份与死亡记录，提交许可前不得查询
      - 调档员不总结七例共同点、不判断Whitfield责任、不解释缺失第十九页
      player_inquiry:
      - "社会服务部与中央病案室的权限边界" # 7
      - "七个编号的正式调档手续" # 10
      testimony_ids: []
  event_triggers:
  - id: records_clerk_submit_seven_numbers
    source_talk: L2_scene4012_records_clerk
    branch_path: clerk_submit_permit
    carrier: npc_branch
    forced: false
    player_initiated: true
    trigger_source: npc_special_dialogue
    npc_key: L2_scene4012_records_clerk
    unlock_condition:
    - type: 1
      param: '4218'
    submitted_item_ids:
    - 4117
    case_display_order:
    - code: SH-24-071
      year: 1924
      deceased: Giuseppe Rosselli
    - code: SH-24-118
      year: 1924
      deceased: Bridget O'Shea
    - code: SH-25-044
      year: 1925
      deceased: Michael Donovan
    - code: SH-26-093
      year: 1926
      deceased: Robert Carter
    - code: SH-27-031
      year: 1927
      deceased: Stanley Nowak
    - code: SH-27-126
      year: 1927
      deceased: Concetta Morelli
    - code: SH-28-052
      year: 1928
      deceased: Isabel Martinez
    prohibited_prerequisites:
    - forced_wait
    - environment_investigation_count
    required_beats:
    - 调档员按照Harrison纸条顺序推来并逐份摆放七份病历，只核对编号与翻页，不总结共同点。
    - 七份病例严格按SH-24-071／Giuseppe Rosselli、SH-24-118／Bridget O'Shea、SH-25-044／Michael Donovan、SH-26-093／Robert Carter、SH-27-031／Stanley Nowak、SH-27-126／Concetta Morelli、SH-28-052／Isabel Martinez的顺序展示。
    - 七份病例反复记录相似低血糖反应、器官损伤及家属误用、擅自加量或保存不当等责任认定。
    - 最后一份是Isabel Martinez；Emma只读出她的名字。
    - 展示完成后4117更新为4219，4219是玩家调查成果，不是Harrison或医院预先给出的答案。
    grants_evidence:
    - 4219
- id: 4013
  name: Foster 法医实验室
  type: free_exploration
  design_tags:
  - analysis
  description: 'Foster 接续 Harrison 生前已经启动的封存与调取手续。Zack 与 Emma 到场前，

    她已经完成两名旧死者样本与 Harrison 官方留样的配方比对，也完成官方留样的风险检验；

    玩家在场景中只操作十三次剂量核对，其余结果通过对话与证物交付。4213能确认配方一致，

    但不能确认同一生产批次，也不能推及七名儿童。

    '
  analysis_operations:
  - output_id: 4702
    name: 经容量分析的回收药瓶
    inputs:
    - 4212
    prerequisite_context:
    - 4211
    input_boundary: 正式分析对象只有4212；4211只提供医院规定剂量与红线止动环背景，不作为第二提交物
    boundary: 只能核对实际消耗量是否存在额外注射缺口
  - output_id: 4703
    name: 经化验的医院冷藏库留样试剂
    inputs:
    - 4118
    input_boundary: 正式更新对象只有4118；4213的配方比对已作为独立结果完成，不进入4703的风险检验，也不作为同批证明
    boundary: 证明从医院冷藏库调取后始终置于带独立碎冰槽和镀锌金属内胆的上锁木质保冷箱、样本格医院纸封／蜡封未破、装箱时间与箱内温度及经手人逐次有据的官方留样，在受控化验中出现异常析出、有效成分浓度波动、异常降解杂质与连续使用风险；补冰未开启样本格，因此可排除调取后或家庭保存造成异常，不判断故意投毒或批准者主观知情
  evidence:
  - id: 4213
    name: 同配方药瓶封签组
    type: item
    pickup: true
    note: Expose R2击破后剧情自动出示；不作为玩家选择项
    description: 两瓶旧药分别保留原患者姓名标签Giuseppe Rosselli、Bridget O'Shea，并在死后追加死亡登记吊签SH-24-071、SH-24-118；两个完整编号均出现在Harrison纸条上。两瓶旧药的残留物、封签和编号与Harrison官方留样相互吻合，配方一致；但仅凭旧样本不能确认它们与Isabel的药属于同一生产批次，也不能证明七名儿童都使用了同一配方
    bottle_labels:
    - patient_name: Giuseppe Rosselli
      death_number: SH-24-071
      death_year: 1924
    - patient_name: Bridget O'Shea
      death_number: SH-24-118
      death_year: 1924
    acquisition:
      kind: dialogue
      talk: L2_scene4013_foster
  - id: 4218
    name: 验尸官办公室有限调档许可
    type: key_item
    pickup: true
    note: 关键——只解锁4012调档员“提交七个编号”的特殊对话；不锁地点、不制造等待
    description: 在院方监督下查看Harrison纸条所列七个编号对应死亡登记和病历的有限许可；不开放采购批准文件，也不预先出现Miller项目名称
    acquisition:
      kind: dialogue
      talk: L2_scene4013_foster
  - id: 4702
    name: 经容量分析的回收药瓶
    type: clue
    pickup: false
    analysis: true
    note: 关键——Expose R1玩家唯一选择；4211与4217仅作剧情辅助
    description: 按瓶体标定与剩余量核对，十三日实际消耗不存在规定剂量之外的一次额外注射缺口
  - id: 4703
    name: 经化验的医院冷藏库留样试剂
    type: clue
    pickup: false
    analysis: true
    note: 关键——Expose R3；不越过1928年技术能力宣称完整毒理定案
    description: 对医院冷藏库官方留样的受控化验中出现异常析出、有效成分浓度波动异常，并检出不应存在于合格成品中的降解杂质；连续使用可能造成严重低血糖反应与器官损伤。附随交接记录显示，样本自医院冷藏库调出后始终保持冰藏，样本格封签完整，每次交接均有记录
