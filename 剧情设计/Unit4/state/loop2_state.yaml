player_context:
  chapter_goal: 追查 Harrison、圣心医院、南区地产与 1919-A 背后的共同控制结构
  goals:
    primary: Rosa 是否在规定剂量之外擅自加量？
    secondary:
    - Harrison 的七个编号是否都对应死亡儿童，彼此有什么共同点？
    - Isabel 的回收药瓶与医院官方留样是否属于同一采购记录、同一生产批次和同一配方？
    - 医院规范冷藏留样是否仍然存在连续使用风险？
    - Mickey 的帮助把调查带到了哪里，又停在了哪里？
  known_facts:
  - Harrison 长期收受 1919-A 资金，并替圣心医院赔偿、南区地产安排提供法院便利
  - Harrison 最近连续十七晚在闭庭后调阅医院、地产与旧判决材料
  - Harrison 重查了自己亲手签过的赔偿裁定，不再只把问题归给别人
  - Harrison 连续三次推动 Mary 案无罪改判，并起草辞职信，准备公开自身责任
  - Harrison 的公开、自首和司法承担尚未完成；保险柜只是未完成的自首证物箱
  - Watts 交出钥匙，是执行 Harrison 的最后要求，而不是替 Harrison 洗清罪责
  - 保险柜材料显示 Rosa 的正式听证迫近，并留下七个用途未明的圣心医院编号和医院冷藏库官方留样
  current_assumptions:
  - 缺失的第十九页使最终采购批准者仍无法核验
  - Mickey 的帮助真实，但他为何坚持把公开责任集中在 Whitfield 仍不明确
  - Harold 留下私下接触口子，不等于已经决定完整坦白
  new_directions:
  - direction: Rosa 的每日用药动作
    trigger: Isabel病历、红线注射器、十三日药盒与回收药瓶剩余量可以核对是否存在第十四次完整剂量
  - direction: 七个医院编号的含义
    trigger: 两名旧死者样本上的死亡编号与Harrison纸条中的两个编号吻合，Foster据此交付有限调档许可
  - direction: 医院规范冷藏留样的风险
    trigger: Harrison调取的官方留样始终置于带独立碎冰槽和镀锌金属内胆的上锁木质保冷箱，样本格医院纸封／蜡封未破，交接单逐次记录装箱时间、箱内温度与经手人，补冰不需开启样本格，可排除受助家庭和废弃样本库的保存环境
  - direction: Isabel本案的正式发放链
    trigger: 法院卷宗可核对Isabel病历发放号、Rosa回收药瓶与医院官方留样的采购记录、生产批次和配方
  - direction: Harold 开始对 Pierce 保留
    trigger: 散庭后 Harold 表示没有把 Harrison 材料告知 Pierce，并留下私下接触口子
  post_expose_knowledge:
  - Rosa 没有在规定剂量之外使用第十四次完整剂量；回收药瓶实际消耗量与十三次规定剂量吻合
  - Harrison 的七个编号对应五年内七名死亡儿童，七人均由 Whitfield 负责的 Miller 慈善项目经手，并出现相似症状与重复的家属归责方式
  - Giuseppe与Bridget的两只旧药瓶，其残留物、封签和编号相互吻合，配方一致；但仅凭旧样本不能确认它们与Isabel的药属于同一生产批次，也不能证明七名儿童都使用了同一配方
  - Isabel病历发放号、Rosa回收药瓶与Harrison医院官方留样属于同一采购记录、同一生产批次和同一配方
  - Harrison医院官方留样从冷藏库调取后始终置于带独立碎冰槽和镀锌金属内胆的上锁木质保冷箱；样本格医院纸封／蜡封未破，交接单逐次记录装箱时间、箱内温度与经手人，补冰不开启样本格，直至Foster签收；化验后仍显示连续使用风险
  - 现有材料不能证明另外六名儿童使用了与Isabel完全相同的配方或生产批次
  - Whitfield 的姓名出现在项目负责人、采购执行、入库签收与慈善发放责任栏；他不能再以家属加量、孤立事故或家庭保存不当推卸本案责任
  - 执行层副本缺失第十九页，更高层特别采购批准暂时没有可核验的签字原件
  - Mickey 为 Rosa 争取窗口、担任辩护并帮助取得暂停追究的结果，这份帮助真实
  - Mickey 同时主动把公开压力集中在 Whitfield，使调查暂时停在可牺牲的执行层
  - Harold 没有把 Harrison 材料告知 Pierce，并警告 Zack 不要太相信法院里的胜利
  - 截至 L2 散庭，Harold 只留下以后私下谈的口子，没有决定或承诺完整坦白
  inherited_evidence:
  - id: 4117
    name: Harrison留下的编号纸条
    from_loop: 1
    use_in_loop: 先在Foster对话中比对SH-24-071与SH-24-118，再提交七个编号调档；完成病例展示后更新为4219
    visible_codes:
    - SH-24-071
    - SH-24-118
    - SH-25-044
    - SH-26-093
    - SH-27-031
    - SH-27-126
    - SH-28-052
  - id: 4118
    name: 医院冷藏库留样试剂
    from_loop: 1
    use_in_loop: 以带独立碎冰槽和镀锌金属内胆的上锁木质保冷箱保持冰藏，样本格封签及装箱时间、箱内温度、经手人记录完整，直至Foster签收；实验室化验后更新为4703
