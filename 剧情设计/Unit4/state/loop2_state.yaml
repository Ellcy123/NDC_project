expose:
  target: whitfield
  target_talk: L2_expose_whitfield
  location: SC4014 法院预审走廊
  total_rounds: 3
  is_liar: true
  player_inquiry: null
  context: 'Whitfield 需要 Rosa 在预留位置签名，把正式项目的死亡写成家属误用。

    Zack 依次排除额外加量、单一事故与非正式来源。Rosa 的拒签发生在证据

    暂时托住她之后，但她仍不知道自己一定会赢。Mickey 的法律帮助与结果都真实。

    '
  round_1:
    lie: Rosa 在每日规定剂量之外又擅自增加药量
    lie_source: 4092001
    usable_evidence:
    - id: 4211
      name: 医院配发红线注射器与十三日封签药盒
      用途: 不可移动金属止动环与十三日指纹确认条限定每日操作
    - id: 4702
      name: 经容量分析的回收药瓶
      用途: 实际消耗量不存在规定剂量之外的一次额外注射缺口
    result: Whitfield 被迫放弃家属加量，退守为 Isabel 可能只是单一事故。
  round_2:
    lie: 即使 Rosa 没有加量，也只是 Isabel 一例药物事故
    lie_source: 4092002
    usable_evidence:
    - id: 4117
      name: 圣心医院儿童死亡对照表
      用途: 显示相似死亡并非只发生在 Isabel 一人
    - id: 4213
      name: 同批次药瓶封签组
      用途: 把另外两名死亡儿童与 Isabel 锁在同一批次
    result: Whitfield 承认不是单例，转而声称药剂没有进入医院正式项目。
  round_3:
    lie: 这批药从未进入医院正式项目，只是护士私领或家庭转手
    lie_source: 4092003
    usable_evidence:
    - id: 4703
      name: 经化验的问题批次药剂
      用途: 证明同批样本存在一致的批次异常方向，不能由单支家庭保存解释
    - id: 4214
      name: 圣心医院采购与发放记录
      用途: 问题批次编号贯穿正式采购、入库与慈善发放
    result: Whitfield 被迫承认正式项目执行责任，但把最终批准责任推向缺失的第十九页。
  post_expose:
    description: Rosa 在 Zack 与 Mickey 的支持下拒绝签署家属误用说明。Whitfield 要求记者停止广播和录音，Emma 明确告知现场记者并不受他控制，事实已无法被走廊口径收回。书记员交付暂停追究 Rosa、重审
      Isabel 死因的回执。Mickey 对 Rosa 的关心和这场胜利都必须是真的。散庭后 Morrison 在走廊拐角告诉 Zack，自己没有把 Harrison 材料告知 Pierce，并留下以后私下接触的口子；这不等于完整坦白。
    new_evidence_gained: null
    player_knowledge_gained:
    - Rosa 没有额外加量
    - 问题不是单例
    - 问题批次进入医院正式项目
    - Whitfield 只承认执行层责任
    - Harold 开始对 Pierce 有所保留
    event_id: rosa_result_and_morrison_hook
    talk: L2_post_expose_court_result
    required_beats:
    - Whitfield要求停止广播和录音，Emma说明已经来不及。
    - Rosa拒签并取得暂停追究、重审死因的回执。
