version: 2
unit: Unit4

canon_source:
  planning_directory: "剧情设计/Unit4"
  active_outline: "剧情设计/Unit4/Unit4_大纲0723_逻辑重构版_v3.md"
  episode: EPI04
  id_space: 4xxx
  expected_loops: 5
  structure: 5_loops_plus_non_loop_finale

scene_types:
  - cutscene
  - free_exploration

design_tags:
  - opening
  - transition
  - analysis
  - crisis
  - aftermath
  - action_result
  - expose_location
  - locked
  - pre_blast
  - post_blast
  - identity_lock
  - story_climax

field_policy:
  meta: design_only
  player_context: design_only
  opening: structural
  outline_coverage: design_only
  narrative_continuity: design_only
  scenes: runtime_source
  expose: runtime_source
  doubts: runtime_source
  doubt_progress: design_only
  cross_loop_evidence: design_only
  evidence_registry: runtime_source
  testimony_ids: runtime_source
  non_progress_investigation_records: design_only
  special_mechanics: special_adapter
  ending_sequence: special_adapter

opening_contract:
  required_per_loop: true
  root_count: 1
  type: cutscene_sequence
  runtime_root_table: ChapterConfig
  sequence_min_events: 1
  event_ids_unique: true
  talk_name_policy: scene_or_event
  player_control_restored_after: last_sequence_event
  runtime_rules:
    init_scene_matches_first_event: true
    init_talk_matches_first_event: true
    cross_scene_continuation: change_scene_plus_next_talk
    skip_target_first_enter_for_continuation: true
    final_event_releases_control: true
  forbidden_duplicate_bindings:
    - scenes[].first_enter_talk
    - scenes[].npcs.*.talk
    - scenes[].npcs.*.loop_talk

outline_coverage_contract:
  required_per_loop: true
  allowed_mappings: [exact, merged, deferred, omitted, added, reordered]
  unique_beat_ids: true
  unique_primary_landings: true
  require_source_anchor: true
  require_deferred_target: true
  require_approval_for: [omitted, added, reordered]
  pass_gate:
    missing_beats: 0
    unsourced_additions: 0
    duplicate_mappings: 0
    unapproved_deviations: 0
  npc_marker_policy:
    source_marker: "👤 NPC："
    free_exploration_requires_scene_npc_talk: true
    opening_or_event_talk_does_not_satisfy: true
    dialogue_evidence_requires_matching_talk: true
  evidence_delivery_policy:
    coverage_flag: evidence_delivery_required
    required_fields:
      - evidence_id
      - acquisition_kind
      - acquisition_talk
    evidence_and_registry_must_match: true
    carrier_must_grant_evidence: true

runtime_event_contract:
  event_talk_locations:
    - scenes[].event_triggers[].talk
    - ending_sequence.scenes[].talk
  forced_event_requires_runtime_binding: true
  scene_enter_adapter: SceneEnterTalkTriggerConfig
  scene_enter_required_field: required_item_ids
  special_adapters:
    - ordered_story_event
    - chained_talk
    - identity_lock
  duplicate_talk_entry_forbidden: true
  cutscene_free_npc_talk_forbidden: true
  allowed_runtime_actions:
    - change_scene
    - release_to_exploration
    - loop_end

loop3_flow_contract:
  pre_blast_scene_ids: [4024, 4025, 4026]
  post_blast_scene_ids: [4023]
  key_item_id: 4317
  key_source_scene_id: 4025
  station_scene_id: 4026
  station_scene_always_open: true
  visible_locker_range: "210-220"
  locked_container_interaction: interaction_station_locker_214
  locked_container_number: 214
  locked_container_output_id: 4320
  post_blast_lie_id: 4063003
  post_blast_lie_scene_id: 4023
  post_blast_lie_talk: L3_scene4023_doris
  first_doubt_id: 4301
  first_doubt_conditions: [4063003, 4153001]
  explosion_event_id: mansion_evacuation_and_explosion
  explosion_adapter: ordered_story_event
  explosion_required_talks: [L3_scene4024_operator]
  explosion_required_item_ids: [4316, 4321, 4322, 4317, 4318, 4319, 4320]

testimony_contract:
  outline_marker: "⚪"
  coverage_flag: testimony_required
  default_mapping: one_marker_to_one_testimony
  merge_requires_explicit_mapping: true
  centralized_registry_forbidden: true
  inline_definition_required: true
  required_inline_fields:
    - id
    - kind
    - content
    - source_anchor
  forbidden_inline_fields:
    - name
  collectible_requires_acquisition_talk: true
  source_text_must_be_verbatim: true
  title_marker_may_expand_from_child_bullets: true

narrative_continuity_contract:
  required_per_loop: true
  global_unique_unit_ids: true
  required_fields:
    - id
    - source_anchor
    - entry_state
    - consumes
    - required_beats
    - exit_state
    - hands_off_to
  require_existing_handoff_target: true
  approved_external_handoffs:
    - enter_ohara_house
  required_coverage:
    - opening.sequence
    - expose
    - expose.post_expose
    - ending_sequence.scenes

expose_evidence_contract:
  lie_source_policy:
    round_1:
      kind: collectible_lie_anchor
      collectible_testimony: true
    later_rounds:
      kind: dynamic_expose_lie
      collectible_testimony: false
  lie_source_requires_doubt_condition: false
  usable_evidence_requires_doubt_or_identity_condition: true

persistent_inputs:
  - id: 4112
    source_loop: 1
    registry: evidence_registry
    required_by:
      - identity_lock.chain_4501
  - id: 4153001
    source_loop: 3
    registry: inline_testimony
    required_by:
      - identity_lock.chain_4503
  - id: 4315
    source_loop: 3
    registry: evidence_registry
    required_by:
      - identity_lock.chain_4503
  - id: 4416
    source_loop: 4
    registry: evidence_registry
    required_by:
      - identity_lock.chain_4501
  - id: 4418
    source_loop: 4
    registry: evidence_registry
    required_by:
      - interaction_letter_safe

identity_lock:
  loop: 5
  status: approved_provisional_ui
  chain_ids: [4501, 4502, 4503]
  lanes: parallel
  slots: fixed_per_chain
  chain_open_order: simultaneous
  submission: player_confirm
  completion_condition: all_chains_completed
  unlocks: expose
  standard_doubt_progress_required: false
  mickey_returns_condition: "special_mechanics.identity_lock.completion_condition 达成"
  mickey_returns_talk: L5_event_mickey_returns
  mickey_returns_testimony: 4035001
  expose_unlock_condition:
    identity_lock_completion: all_chains_completed
    required_entry_event: mickey_returns
    required_testimony_ids: [4035001]
  wrong_submission:
    consumes_evidence: false
    resets_completed_chains: false
    first_feedback: logic_dimension_only
    repeated_feedback: missing_dimension_only
    reveal_correct_id: false

non_progress_records:
  loop: 3
  ids:
    - record_suicide_scene
    - record_forged_note
    - record_gas_timing
    - record_pierce_schedule
  presentation:
    channel: investigation_log
    blocking: false
    auto_unlock: true
    show_completion_toast: false

ending_sequence:
  owner_loop: 5
  counts_as_loop: false
  chapter_end_after: ending_4045
  entry_talk: L5_ending_departure
  final_runtime_action: loop_end
  next_unit_entry: enter_ohara_house
  unit5_first_allowed_action: "进入 O'Hara 家并开始屋内救援"
  unit5_outline_first_action_prefix: "Zack 与 Emma 进入屋内"
