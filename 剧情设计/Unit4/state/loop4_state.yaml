expose:
  target: margaret
  target_talk: L4_expose_margaret
  location: "SC4034 Margaret 家"
  total_rounds: 3
  is_liar: true
  player_inquiry: null
  unlock_condition:
    doubts_completed: [4401, 4402, 4403]

  context: |
    指证从 O'Hara 的现实选择逐步转向 Patrick 往事。
    Margaret 的错误不是害怕危险，而是先替 O'Hara 决定放弃房屋，
    再替 Zack 决定如何理解父亲。被击穿后她仍可反对 Zack 继续查。

  round_1:
    lie: "O'Hara 已经准备接受报价，我只是在帮她安排搬家"
    lie_source: 4104002
    usable_evidence:
      - id: 4412
        name: "Lakeshore最终收购协议"
        用途: "签名页明确写着不出售"
      - id: 4114001
        name: "O'Hara明确拒绝出售的证词"
        用途: "O'Hara 已把拒售决定直接告诉 Margaret"
    trap_evidence:
      - id: 4411
        name: "Lakeshore清退协警通知"
        用途: "只证明外部施压，不能回答 O'Hara 是否接受报价"
    result: "Margaret 承认 O'Hara 没有同意出售，退守为自己只是替她看清危险。"

  round_2:
    lie: "我没有让她瞒着你，是她自己不想麻烦你"
    lie_source: 4104003
    usable_evidence:
      - id: 4413
        name: "Margaret写给O'Hara的短便条"
        用途: "签名便条明确写着“别找 Zack”"
      - id: 4114002
        name: "O'Hara关于Margaret阻止求助的证词"
        用途: "确认这不是 O'Hara 自己的决定"
    trap_evidence:
      - id: 4414
        name: "临时停止执行回执"
        用途: "只证明 Zack 已经介入并取得保护，不证明 Margaret 曾阻止求助"
    result: "Margaret 承认她切断求助，是因为知道 Zack 不会只帮 O'Hara 搬家，而会沿清退线继续查下去。"

  round_3:
    lie: "你父亲当年是为了救 Mickey 才回去的，他才因此去世；他没有选择我们"
    lie_source: 4104004
    usable_evidence:
      - id: 4417
        name: "Patrick外套口袋里的粉笔转运牌"
        用途: "获批单件强证据例外：唯一即时信息只有“还有一人”，没有姓名；Patrick在看见被困者前已折返"
    trap_evidence:
      - id: 4418
        name: "Patrick遗物匣"
        用途: "信条与情感高度相关，但不能证明 Patrick 折返时知道救的是谁"
    result: |
