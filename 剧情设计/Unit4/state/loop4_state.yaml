opening:
  type: cutscene
  scene_name: "L4 开篇 · Brennan事务所 · 隐瞒反咬与清退通知"
  location: "SC4031 Zack 侦探事务所"
  characters: [Zack, Emma, Mickey, Doris]
  description: |
    Emma 全程在事务所整理 Harold 案材料。Mickey 用“你也瞒过 Emma”反击 Zack，
    但 Emma 没有在对话中途无交代进场；她听见这句话，在 Mickey 离开后才直接质问 Zack。
    Doris 随后送来爆炸中幸存的 Lakeshore 清退协警通知，现实危机把争执暂时推向行动。

  L4_opening_mickey:
    talk: L4_opening_mickey
    is_liar: false
    motive: "反击 Zack 对枪位证词的追问，并迫使 Zack 看见自己也曾替 Emma 管理信息"
    mindset: "受伤后的冷静反咬；不提前承认 Harold 访客、Whale 或 Patrick 使命解释的虚构部分"
    active_topics:
      - "Patrick 最后选择了谁"
      - "Zack 曾对 Emma 隐瞒 U3 的越线行动"
      - "警方已按自杀结案"
    withheld_topics:
      - "自己是 Harold 的访客与枪手"
      - "自己是 Whale"
      - "Patrick 折返时并不知道被困者身份"
    player_inquiry:
      - "Mickey 为什么坚持 Patrick 最后选择了自己"
    testimony_ids: null

  L4_opening_emma:
    talk: L4_opening_emma
    is_liar: false
    motive: "要求 Zack 正面承认隐瞒对搭档判断权造成的伤害，同时在清退危机出现后优先行动"
    mindset: "愤怒但不失去工作能力；不因关系裂缝放弃 O'Hara 和 Sarah"
    active_topics:
      - "自己全程听见 Mickey 的反击"
      - "Mickey 离开后才直接质问 Zack"
      - "取得清退通知后立即转向 O'Hara 安全"
    withheld_topics:
      - "Mickey 的真实身份"
      - "L5 Zack 将独自扣下档案页"
    player_inquiry:
      - "Emma 对 Zack 隐瞒的具体不满"
      - "为什么仍愿意一起去保护 O'Hara"
    testimony_ids: null

  L4_opening_doris:
    talk: L4_opening_doris
    is_liar: false
    motive: "把 Harold 预先塞进自己大衣、因而逃过爆炸的清退材料交给 Zack"
    mindset: "疲惫、克制，不借交材料请求原谅，也不补写自己不知道的组织事实"
    active_topics:
      - "Lakeshore 清退协警通知的幸存方式"
