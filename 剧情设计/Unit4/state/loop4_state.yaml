  context: '指证从 O''Hara 的现实选择逐步转向 Patrick 往事。

    Margaret 的错误不是害怕危险，而是先替 O''Hara 决定放弃房屋，

    再替 Zack 决定如何理解父亲。被击穿后她仍可反对 Zack 继续查。

