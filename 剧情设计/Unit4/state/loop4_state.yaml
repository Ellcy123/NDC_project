player_context:
  chapter_goal: 在 Harold 的死亡被程序压下后，保护 O'Hara 并追查 Mickey 管理信息边界的方式
  goals:
    primary: Margaret 为什么阻止 O'Hara 向 Zack 求助？
    secondary:
    - 怎样在不替 O'Hara 决定的前提下挡住现实清退？
    - Patrick 折返时是否已经知道被困者是 Mickey？
    - 1919 年的 Donnelly & Associates 与 Mickey 的使命解释有何关系？
  known_facts:
  - Harrison 长期收受 1919-A 资金，并替圣心医院赔偿、南区地产安排提供法院便利
  - Harrison 最近连续十七晚在闭庭后调阅医院、地产与旧判决材料
  - Harrison 重查了自己亲手签过的赔偿裁定，不再只把问题归给别人
  - Harrison 连续三次推动 Mary 案无罪改判，并起草辞职信，准备公开自身责任
  - Harrison 的公开、自首和司法承担尚未完成；保险柜只是未完成的自首证物箱
  - Watts 交出钥匙，是执行 Harrison 的最后要求，而不是替 Harrison 洗清罪责
  - 保险柜材料显示 Rosa 的正式听证迫近，并留下七个用途未明的圣心医院编号和医院冷藏库官方留样
  - Rosa 没有在规定剂量之外使用第十四次完整剂量；回收药瓶实际消耗量与十三次规定剂量吻合
  - Harrison 的七个编号对应五年内七名死亡儿童，七人均由 Whitfield 负责的 Miller 慈善项目经手，并出现相似症状与重复的家属归责方式
  - Giuseppe与Bridget的两只旧药瓶，其残留物、封签和编号相互吻合，配方一致；但仅凭旧样本不能确认它们与Isabel的药属于同一生产批次，也不能证明七名儿童都使用了同一配方
  - Isabel病历发放号、Rosa回收药瓶与Harrison医院官方留样属于同一采购记录、同一生产批次和同一配方
  - Harrison医院官方留样从冷藏库调取后始终置于带独立碎冰槽和镀锌金属内胆的上锁木质保冷箱；样本格医院纸封／蜡封未破，交接单逐次记录装箱时间、箱内温度与经手人，补冰不开启样本格，直至Foster签收；化验后仍显示连续使用风险
  - 现有材料不能证明另外六名儿童使用了与Isabel完全相同的配方或生产批次
  - Whitfield 的姓名出现在项目负责人、采购执行、入库签收与慈善发放责任栏；他不能再以家属加量、孤立事故或家庭保存不当推卸本案责任
  - 执行层副本缺失第十九页，更高层特别采购批准暂时没有可核验的签字原件
  - Mickey 为 Rosa 争取窗口、担任辩护并帮助取得暂停追究的结果，这份帮助真实
  - Mickey 同时主动把公开压力集中在 Whitfield，使调查暂时停在可牺牲的执行层
  - Harold 没有把 Harrison 材料告知 Pierce，并警告 Zack 不要太相信法院里的胜利
  - 截至 L2 散庭，Harold 只留下以后私下谈的口子，没有决定或承诺完整坦白
  - Harold 原本准备去找 Zack，不是在家等待自杀
  - Harold 死前不久接待过一名近期访客
  - Harold 确实在车站寄存柜留下了准备交给 Zack 的材料
  - Doris 知道 Harold 留有站外材料，但不知道口供全文，也不知道访客和枪手身份
  - Harold 长期惯用左手；Zack 在爆炸前看见手枪被放在尸体右手
  - Mickey 向 Pierce 正式回答自己初见尸体时枪在左手，与 Zack 的私人观察冲突
  - 原始现场被爆炸摧毁后，Pierce 以相反证词为由拒绝启动他杀调查，警方仍按自杀结案
  - 煤气与时钟装置在 Harold 最后求助前已进入宅邸
  - 4318 只提高 Pierce 当时在法院的可能，不能作为绝对不在场证明
  current_assumptions:
  - 右下牙旧伤与现场烟蒂只形成 Mickey 可能到访的比较方向，尚不足以定人
  - Donnelly & Associates、1919-A 与 Whale 的关系仍缺正式授权和接管材料
  - Patrick 往事可能被 Margaret 与 Mickey 赋予了不同于现场事实的意义
  new_directions:
  - direction: O'Hara 现实清退
    trigger: Doris 交出 Lakeshore 清退协警通知，O'Hara 被列为第一批核心拒售户
  - direction: Margaret 主动阻断求助
    trigger: O'Hara 家的拒售协议旁放着 Margaret 签名短便条：先搬来，别找 Zack
  - direction: Patrick 折返的即时信息
    trigger: Patrick 外套口袋中留有只写 WEST SIDE / ONE LEFT 的粉笔转运牌
  - direction: Mickey 的牙伤与1919法律壳
    trigger: 1903旧照片触发右下牙记忆；葬礼册与旧信封把承诺和 Donnelly 的出现放在同一年
  post_expose_knowledge:
  - O'Hara 从未同意出售，Margaret 明知这一点仍替她安排离开
  - Margaret 明确要求 O'Hara 不找 Zack，主动切断了求助路径
  - Patrick 折返前唯一收到的即时转运信息只有“还有一人”，没有姓名
  - Patrick 在看见被困者以前已折返，不知道那个人是 Mickey
  - Patrick 救出 Mickey 后未恢复可交流意识，不存在临终交接或使命继承
  - Margaret 真正害怕的是 Zack 重复 Patrick 把自己放入风险的道路；她仍不赞成 Zack 继续追查
  - Mickey右下牙长期缺损只提供现场烟蒂的比较方向，单独不具备定人能力
  - Donnelly & Associates 在 Patrick 葬礼后不久开始持续出现；L4 材料只建立法律壳方向
  - Patrick遗物匣的信条提供四十二层保险柜密码方向
  - 临时停止执行真实挡住了警务清退并让 Sarah 获得安全转移；O'Hara 仍自主选择留在屋内
