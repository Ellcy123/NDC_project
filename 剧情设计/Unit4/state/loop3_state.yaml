player_context:
  chapter_goal: 追查 Harrison、圣心医院与南区清退背后的同一套控制结构
  goals:
    primary: Harold Morrison 真的是自杀吗？
    secondary:
    - Harold 在最后一通求助电话前后准备做什么？
    - Harold 死前是否接待过其他访客？
    - 是谁提前在宅邸中布置了煤气与时钟接线？
  known_facts:
  - Harrison 长期收受 1919-A 资金，并替圣心医院赔偿、南区地产安排提供法院便利
  - Harrison 最近连续十七晚在闭庭后调阅医院、地产与旧判决材料
  - Harrison 重查了自己亲手签过的赔偿裁定，不再只把问题归给别人
  - Harrison 连续三次推动 Mary 案无罪改判，并起草辞职信，准备公开自身责任
  - Harrison 的公开、自首和司法承担尚未完成；保险柜只是未完成的自首证物箱
  - Watts 交出钥匙，是执行 Harrison 的最后要求，而不是替 Harrison 洗清罪责
  - 保险柜材料显示 Rosa 的正式听证迫近，并留下七个用途未明的圣心医院编号和医院冷藏库官方留样
  - Rosa 没有在规定剂量之外使用第十四次完整剂量；回收药瓶实际消耗量与十三次规定剂量吻合
  - Harrison 的七个编号对应五年内七名死亡儿童，七人均由 Whitfield 负责的 Miller 慈善项目经手，并出现相似症状与重复的家属归责方式
  - Giuseppe与Bridget的两只旧药瓶，其残留物、封签和编号相互吻合，配方一致；但仅凭旧样本不能确认它们与Isabel的药属于同一生产批次，也不能证明七名儿童都使用了同一配方
  - Isabel病历发放号、Rosa回收药瓶与Harrison医院官方留样属于同一采购记录、同一生产批次和同一配方
  - Harrison医院官方留样从冷藏库调取后始终置于带独立碎冰槽和镀锌金属内胆的上锁木质保冷箱；样本格医院纸封／蜡封未破，交接单逐次记录装箱时间、箱内温度与经手人，补冰不开启样本格，直至Foster签收；化验后仍显示连续使用风险
  - 现有材料不能证明另外六名儿童使用了与Isabel完全相同的配方或生产批次
  - Whitfield 的姓名出现在项目负责人、采购执行、入库签收与慈善发放责任栏；他不能再以家属加量、孤立事故或家庭保存不当推卸本案责任
  - 执行层副本缺失第十九页，更高层特别采购批准暂时没有可核验的签字原件
  - Mickey 为 Rosa 争取窗口、担任辩护并帮助取得暂停追究的结果，这份帮助真实
  - Mickey 同时主动把公开压力集中在 Whitfield，使调查暂时停在可牺牲的执行层
  - Harold 没有把 Harrison 材料告知 Pierce，并警告 Zack 不要太相信法院里的胜利
  - 截至 L2 散庭，Harold 只留下以后私下谈的口子，没有决定或承诺完整坦白
  current_assumptions:
  - 现有材料只确认 Harold 死前有近期访客，尚未锁定对方身份
  - 煤气装置的命令源尚未确认，不能把它与开枪者强行合并
  - 4318 只能提高 Pierce 当时在法院的可能，不能排除其离岗
  new_directions:
  - direction: Harold 的外出意图
    trigger: 23:15，Harold 接通 Brennan 事务所，只来得及叫出 Zack 的姓
  - direction: 近期访客
    trigger: 宅邸内有新近使用的第二只酒杯与陌生古巴雪茄烟蒂
  - direction: 预装清场装置
    trigger: 煤气铅封、壁炉时钟铜线、被压住的窗缝与 Doris 的 18:12 来访记忆
  - direction: 站外材料
    trigger: 法院外圈取得只刻有 214 的黄铜钥匙，并与已开放车站寄存区的连续柜号建立对应
  post_expose_knowledge:
  - Harold 原本准备去找 Zack，不是在家等待自杀
  - Harold 死前不久接待过一名近期访客
  - Harold 确实在车站寄存柜留下了准备交给 Zack 的材料
  - Doris 知道 Harold 留有站外材料，但不知道口供全文，也不知道访客和枪手身份
  - Harold 长期惯用左手；Zack 在爆炸前看见手枪被放在尸体右手
  - Mickey 向 Pierce 正式回答自己初见尸体时枪在左手，与 Zack 的私人观察冲突
  - 原始现场被爆炸摧毁后，Pierce 以相反证词为由拒绝启动他杀调查，警方仍按自杀结案
  - 煤气与时钟装置在 Harold 最后求助前已进入宅邸
  - 4318 只提高 Pierce 当时在法院的可能，不能作为绝对不在场证明
opening:
  type: cutscene_sequence
  runtime_root:
    table: ChapterConfig
    init_scene: 4021
    init_talk: L3_opening_broken_call
  sequence:
  - event_id: broken_call
    talk: L3_opening_broken_call
    scene_id: 4021
    source_anchor: active outline / Loop3 / 开篇剧情 / 事务所深夜
    cast:
    - Zack
    - Emma
    - Morrison
    - 人工接线员
    required_beats:
    - 人工接线员转入 Morrison 宅邸坚持接 Brennan 的来电。
    - 电话里先有咳嗽和沉默，Morrison 只说出 Brennan 后断线。
    - Zack 认出声音，和 Emma 立即前往宅邸；不提前断言线路被人为切断。
    runtime_exit:
      action: change_scene
      target_scene_id: 4029
      continuation: next_talk
      next_talk: L3_opening_mansion_arrival
  - event_id: mansion_arrival
    talk: L3_opening_mansion_arrival
    scene_id: 4029
    source_anchor: active outline / Loop3 / 开篇剧情 / 宅邸门口
    cast:
    - Zack
    - Emma
    - Mickey
    required_beats:
    - 23:30，Zack 与 Emma 在宅邸门口撞见 Mickey。
    - Mickey 强制声称自己也刚到，是 Morrison 把他叫来的。
    - 该说法此时不能立刻证伪，但属于 Mickey 的掩护谎言。
    - 镜头清楚建立门廊卷收式厚质防风帘的卷轴、配重下沿、控制绳与外侧门柱绳扣；这里只作视觉铺垫，不提供调查交互。
    claims:
    - id: mickey_just_arrived
      speaker: Mickey
      truth_status: 'false'
      player_can_disprove_now: false
      withheld_fact: Mickey在22:58已经进入宅邸，并于23:16枪杀Harold、伪造现场。
    runtime_exit:
      action: change_scene
      target_scene_id: 4022
      continuation: release_to_exploration
  player_control_restored_after: mansion_arrival
