expose:
  target: doris
  target_talk: L3_expose_doris
  location: SC4023 宅邸门外 / 爆炸后回收区
  total_rounds: 3
  is_liar: true
  player_inquiry: null
  unlock_condition:
    doubts_completed:
    - 4301
    - 4302
    - 4303
  context: 'Doris 的防守不是组织忠诚，而是想让 Harold 的死亡尽快停在家庭门内。

    Zack 依次击破“准备留家”“没有访客”“没有留下材料”三项事实说法。

    指证不能逼出访客身份、枪手、Whale 或上层命令源。

    '
  round_1:
    lie: Harold 当晚没有打算离开，准备一直在家里休息
    lie_source: 4063003
    usable_evidence:
    - id: 4153001
      name: Morrison最后通话记录
      用途: 22:36 明确表示会亲自去 Brennan 事务所，直接击破留家计划
    result: Doris 被迫承认 Harold 原本准备离家找 Zack，但仍拒绝承认有人到访。
  round_2:
    lie: 家里没有来过除了我以外的第二个人
    lie_source: 4063004
    usable_evidence:
    - id: 4314
      name: 两只酒杯
      用途: 第二杯在到场前不久仍被使用
    - id: 4315
      name: 古巴雪茄烟蒂
      用途: 烟蒂与第二杯湿水痕属于同一次近期会面
    result: Doris 承认返家时已经看见第二杯，但她没有看见访客离开，也不知道对方是谁。
  round_3:
    lie: Harold 没有留下任何准备交给你的材料
    lie_source: 4063005
    usable_evidence:
    - id: 4320
      name: Morrison写给Zack的未寄出口供
      用途: 直接证明 Harold 在站外留下了准备交给 Zack 的材料
    result: 'Doris 承认她知道 Harold 在站外留了材料，却不知道口供全文。

      她只想阻止死者继续被公开拆解，不是替组织守密。

      '
  post_expose:
    description: 'Doris 下意识确认 Harold 一直惯用左手，形成 4063002。Zack要求把右手枪位写入记录并拒绝无记录交出材料；

      Pierce抢夺失败后拔枪。玩家以Zack视角完成门廊防风帘QTE，Emma拉紧布面，Zack控腕、夺枪并卸弹。

      两人停止冲突后，Pierce转而询问Mickey；Mickey正式回答自己初见尸体时枪在左手。原始现场已毁，

      Pierce以两份相反证词无法裁定为由拒绝启动他杀调查，并按自杀结案。玩家赢下身体冲突，却在程序渠道中再次失败。

      '
    player_knowledge_gained:
    - 右手枪位与 Harold 长期左手生活习惯冲突
    - Pierce愿意直接向Zack开枪；Zack与Emma阻止了射击
    - Mickey 主动提供了与 Zack 私人观察相反的正式说法
    - 警方仍将 Harold 的死亡判定为自杀
    event_id: official_suicide_close
    talk: L3_post_expose_official_suicide
    required_beats:
    - Doris Expose结束后不恢复自由探索，直接接入SC4023宅邸门口的指证后AVG。
    - Doris确认Harold惯用左手。
    - Pierce试图无记录接管Zack材料，抢夺失败后拔枪并实际击发。
    - 玩家代入Zack释放门廊防风帘；配重下沿撞偏枪线，Emma拉紧布面，Zack完成控腕、夺枪与卸弹。
    - Zack与Emma主动后退并亮出空手，让玩家短暂相信事实讨论已经恢复。
    - Mickey正式陈述初见尸体时枪在左手，与Zack的右手记录冲突。
    - Pierce以原始现场已毁、证词冲突为由拒绝启动他杀调查并按自杀结案。
    player_control_restored_after: official_suicide_close
    testimony_ids:
    - id: 4063002
      content: Doris 与 Morrison 都惯用左手，因此家中的家具与常用物件长期按左侧动线摆放。
      kind: post_expose
      speaker: 406
      source_anchor: active outline / Loop3 / 指证后剧情 / ⚪
      acquisition_talk: L3_post_expose_official_suicide
