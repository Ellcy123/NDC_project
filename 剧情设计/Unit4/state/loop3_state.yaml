expose:
  target: doris
  target_talk: L3_expose_doris
  location: SC4023 宅邸门外 / 爆炸后回收区
  total_rounds: 3
  is_liar: true
  player_inquiry: null
  unlock_condition:
    doubts_completed:
    - 4301
    - 4302
    - 4303
  context: 'Doris 的防守不是组织忠诚，而是想让 Harold 的死亡尽快停在家庭门内。

    Zack 依次击破“准备留家”“没有访客”“没有留下材料”三项事实说法。

    指证不能逼出访客身份、枪手、Whale 或上层命令源。

    '
  round_1:
    lie: Harold 当晚没有打算离开，准备一直在家里休息
    lie_source: 4063003
    usable_evidence:
    - id: 4153001
      name: Morrison最后通话记录
      用途: 22:36 明确表示会亲自去 Brennan 事务所，直接击破留家计划
    result: Doris 被迫承认 Harold 原本准备离家找 Zack，但仍拒绝承认有人到访。
  round_2:
    lie: 家里没有来过除了我以外的第二个人
    lie_source: 4063004
    usable_evidence:
    - id: 4314
      name: 两只酒杯
      用途: 第二杯在到场前不久仍被使用
    - id: 4315
      name: 古巴雪茄烟蒂
      用途: 烟蒂与第二杯湿水痕属于同一次近期会面
    result: Doris 承认返家时已经看见第二杯，但她没有看见访客离开，也不知道对方是谁。
  round_3:
    lie: Harold 没有留下任何准备交给你的材料
    lie_source: 4063005
    usable_evidence:
    - id: 4320
      name: Morrison写给Zack的未寄出口供
      用途: 直接证明 Harold 在站外留下了准备交给 Zack 的材料
    result: 'Doris 承认她知道 Harold 在站外留了材料，却不知道口供全文。

      她只想阻止死者继续被公开拆解，不是替组织守密。

      '
  post_expose:
    description: 'Doris 下意识确认 Harold 一直惯用左手，形成 4063002。

      Zack 指出爆炸前手枪明明被放在右手。Pierce 转而询问 Mickey；

      Mickey 正式回答自己初见尸体时枪在左手。原始现场已毁，

      Pierce 以两份相反证词无法裁定为由拒绝启动他杀调查，并按自杀结案。

      这一高点表现的是事实失去程序资格，不是 Zack 被说服相信自杀。

      '
    player_knowledge_gained:
    - 右手枪位与 Harold 长期左手生活习惯冲突
    - Mickey 主动提供了与 Zack 私人观察相反的正式说法
    - 警方仍将 Harold 的死亡判定为自杀
    event_id: official_suicide_close
    talk: L3_post_expose_official_suicide
    required_beats:
    - Doris确认Harold惯用左手。
    - Mickey正式陈述初见尸体时枪在左手，与Zack的右手记录冲突。
    - Pierce以原始现场已毁、证词冲突为由拒绝启动他杀调查并按自杀结案。
    player_control_restored_after: official_suicide_close
    testimony_ids:
    - id: 4063002
      content: Doris 与 Morrison 都惯用左手，因此家中的家具与常用物件长期按左侧动线摆放。
      kind: post_expose
      speaker: 406
      source_anchor: active outline / Loop3 / 指证后剧情 / ⚪
      acquisition_talk: L3_post_expose_official_suicide
  lie_source_semantics:
    round_1:
      kind: collectible_lie_anchor
      collectible_testimony: true
      boundary: R1 lie_source必须先在普通Talk中说出并取得，Expose只回放同一原话。
    later_rounds:
      kind: dynamic_expose_lie
      collectible_testimony: false
      boundary: R2及以后是NPC在Expose中被击穿后主动退守的新谎言，不得在普通Talk预收集。
    requires_doubt_condition: false
    usable_evidence_boundary: lie_source不作为击穿材料；每轮usable_evidence仍必须进入疑点或身份链。
