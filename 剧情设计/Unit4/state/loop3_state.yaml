player_context:
  chapter_goal: "追查 Harrison、圣心医院与南区清退背后的同一套控制结构"
  goals:
    primary: "Harold Morrison 真的是自杀吗？"
    secondary:
      - "Harold 在最后一通求助电话前后准备做什么？"
      - "Harold 死前是否接待过其他访客？"
      - "是谁提前在宅邸中布置了煤气与时钟接线？"

  known_facts:
    # Loop1 post_expose_knowledge 完整继承
    - "Harrison 长期收受 1919-A 资金，并替圣心医院赔偿、南区地产安排提供法院便利"
    - "Harrison 最近连续十七晚在闭庭后调阅医院、地产与旧判决材料"
    - "Harrison 重查了自己亲手签过的赔偿裁定，不再只把问题归给别人"
    - "Harrison 连续三次推动 Mary 案无罪改判，并起草辞职信，准备公开自身责任"
    - "Harrison 的公开、自首和司法承担尚未完成；保险柜只是未完成的自首证物箱"
    - "Watts 交出钥匙，是执行 Harrison 的最后要求，而不是替 Harrison 洗清罪责"
    - "保险柜材料显示 Rosa 的庭审迫近，并留下圣心医院儿童死亡对照与问题批次药剂"
    # Loop2 post_expose_knowledge 完整继承
    - "Rosa 没有在规定剂量之外额外注射；止动结构、日期撕签和实际消耗量不存在额外用量缺口"
    - "Isabel 的死亡不是单例；另外两名死亡儿童的药瓶与 Isabel 属于同一批次"
    - "问题批次正式进入圣心医院采购、入库与慈善发放链"
    - "加急效价对照只能证明同批样本效力明显不一致，且不能用单支家庭保存不当解释"
    - "Whitfield 是正式项目执行层，不能以家属误用、单例或非正式来源推卸责任"
    - "执行层副本缺失第十九页，更高层特别采购批准暂时没有可核验的签字原件"
    - "Mickey 为 Rosa 争取窗口、担任辩护并帮助取得暂停追究的结果，这份帮助真实"
    - "Mickey 同时主动把公开压力集中在 Whitfield，使调查暂时停在可牺牲的执行层"
    - "Harold 没有把 Harrison 材料告知 Pierce，并警告 Zack 不要太相信法院里的胜利"
    - "截至 L2 散庭，Harold 只留下以后私下谈的口子，没有决定或承诺完整坦白"

  current_assumptions:
    - "现有材料只确认 Harold 死前有近期访客，尚未锁定对方身份"
    - "煤气装置的命令源尚未确认，不能把它与开枪者强行合并"
    - "4318 只能提高 Pierce 当时在法院的可能，不能排除其离岗"

  new_directions:
    - direction: "Harold 的外出意图"
      trigger: "23:15，Harold 接通 Brennan 事务所，只来得及叫出 Zack 的姓"
    - direction: "近期访客"
      trigger: "宅邸内有新近使用的第二只酒杯与陌生古巴雪茄烟蒂"
    - direction: "预装清场装置"
      trigger: "煤气铅封、壁炉时钟铜线、被压住的窗缝与 Doris 的 18:12 来访记忆"
    - direction: "站外材料"
      trigger: "爆炸后取得 214 号寄存柜钥匙"

  post_expose_knowledge:
    - "Harold 原本准备去找 Zack，不是在家等待自杀"
    - "Harold 死前不久接待过一名近期访客"
    - "Harold 确实在车站寄存柜留下了准备交给 Zack 的材料"
    - "Doris 知道 Harold 留有站外材料，但不知道口供全文，也不知道访客和枪手身份"
    - "Harold 长期惯用左手；Zack 在爆炸前看见手枪被放在尸体右手"
    - "Mickey 向 Pierce 正式回答自己初见尸体时枪在左手，与 Zack 的私人观察冲突"
    - "原始现场被爆炸摧毁后，Pierce 以相反证词为由拒绝启动他杀调查，警方仍按自杀结案"
    - "煤气与时钟装置在 Harold 最后求助前已进入宅邸"
    - "4318 只提高 Pierce 当时在法院的可能，不能作为绝对不在场证明"

opening:
  type: cutscene
  scene_name: "L3 开篇 · Brennan事务所 · 被切断的求助"
  location: "SC4021 Zack 侦探事务所"
  characters: [Zack, Emma]
  description: |
    深夜 23:15，事务所电话突然响起。Zack 接起后只听见 Harold 急促地叫出
    “Brennan”，线路随即被人为切断。Emma 从声音和断线方式判断这不是普通掉线，
    两人立刻赶往 Harold 宅邸。开篇只建立现实危险和行动理由，不解释电话另一端发生了什么。

  L3_opening_emma:
    talk: L3_opening_emma
    is_liar: false
    motive: "确认求助来源并立刻组织行动，不让 Zack 把突然断线解释成偶然"
    mindset: "警觉而简短；先记下时间、线路状态和听见的原话，再催 Zack 出门"
    active_topics:
      - "来电时间是 23:15"
      - "Harold 只来得及叫出 Zack 的姓"
      - "断线突兀，应该立即前往宅邸"
    withheld_topics:
      - "来电者身边是谁"
      - "Mickey 是否在 Harold 宅邸"
      - "煤气装置的存在与命令源"
    player_inquiry:
      - "Emma 对断线方式的判断"
    testimony_ids: null

scenes:
  - id: 4022
    name: "Harold Morrison 宅邸"
    type: free_exploration
    design_tags: [crisis]
    description: |
      Zack 与 Emma 于 23:30 左右抵达。Doris 已返家，Mickey 从前门方向出现，
      表现得像刚刚赶到。Harold 倒在书房，磨号手枪被放在右手；客厅留有两只酒杯
      和一支陌生古巴雪茄烟蒂。厨房煤气表与壁炉时钟附近有新近改动。
      玩家必须先检查铅封、接线、煤气阀和窗缝，Emma 才会在最后几秒组织撤离。

    evidence:
      - id: 4311
        name: "磨号手枪与枪内未击发余弹"
        type: clue
        pickup: true
        note: "非进度型自杀现场记录；不能单独证明开枪者"
        description: "不是 Harold 的登记配枪，枪号被磨去；手枪被放在尸体右手，手指没有形成稳定握持"
      - id: 4312
        name: "伪造遗书"
        type: item
        pickup: true
        note: "非进度型辅助判断；用词近似但刻意粗暴，且完全不能解释尚未发生的爆炸"
        description: "把 Harold 的死亡写成旧案暴露后的畏罪自杀，将系统犯罪压缩成个人崩溃"
      - id: 4313
        name: "Pierce档案移交通知（档案袋装）"
        type: item
        pickup: true
        note: "Expose R1 陷阱；证明提前接管压力，不证明 Harold 的外出意图"
        description: "要求 Harold 次日上午交出旧案文件与配枪登记；签发早于 Whitfield 被带走补充笔录"
      - id: 4314
        name: "两只酒杯"
        type: clue
        pickup: true
        note: "Expose R2 主力；第二杯的碎冰和湿水痕只证明近期使用，不用唇印作个体鉴定"
        description: "一只放在 Harold 日常使用位置；第二只仍有残酒、碎冰未尽融、杯垫水痕仍湿"
      - id: 4315
        name: "古巴雪茄烟蒂"
        type: clue
        pickup: true
        note: "Expose R2 主力；L5 访客链复用。本轮只证明近期访客，不作指纹式齿痕定人"
        description: "烟蒂按灭在第二只酒杯旁的湿杯垫边缘，烟灰粘在水痕上；右侧留有复合含咬特征"
      - id: 4316
        name: "伪造市政煤气铅封与异常时钟接线"
        type: clue
        pickup: true
        note: "非进度记录；爆炸前拍照并记下铅封序号，爆炸后把残留接点核验并入同一条记录"
        description: "煤气表使用伪造市政铅封，壁炉时钟后有新铜线和接点；装置只能确认被提前布置"

    npcs:
      L3_scene4022_doris:
        talk: L3_scene4022_doris
        is_liar: true
        motive: "尽快让死亡按自杀结案，保住丈夫最后一点家庭体面，并阻止警察、记者和法院继续公开拆解他"
        mindset: "惊魂未定却紧紧守住措辞；她遮掩材料和访客痕迹，但不替任何组织守密"
        active_topics:
          - "自己 23:18 左右返家后发现 Harold 死亡"
          - "自己没有看见访客离开"
          - "18:12 有两名穿市政工作服的人入宅检查壁炉管线"
          - "Harold 当晚准备留在家中休息"
          - "家里没有来过第二个人"
          - "Harold 没有留下准备交给 Zack 的材料"
        withheld_topics:
          - "她返家后看见右手枪位与第二只酒杯"
          - "她知道 Harold 在站外留有材料，但不知道口供全文"
          - "Harold 长期惯用左手"
          - "她不知道近期访客、枪手、Whale或煤气命令源"
        player_inquiry: null
        testimony_ids:
          - 4063001
          - 4063003
          - 4063004
          - 4063005

      L3_scene4022_mickey:
        talk: L3_scene4022_mickey
        is_liar: false
        motive: "维持自己刚到现场的表象，同时判断 Harold 留下了多少材料；他真实不知道煤气装置形式和启动时间"
        mindset: "表面克制、实际高度警觉；煤气异常出现后第一次真切怀疑上层也可能把自己纳入清理"
        active_topics:
          - "自己也是接到消息后刚到"
          - "先帮助 Emma 与 Zack 把 Doris 撤出"
          - "爆炸并不在他的预期中"
        withheld_topics:
          - "22:58 已进入宅邸并与 Harold 会面"
          - "23:16 开枪、伪装右手枪位并留下遗书"
          - "自己是 Whale"
        player_inquiry:
          - "Mickey 为什么会赶到 Harold 家"
          - "Mickey 对煤气装置的反应"
        testimony_ids: null

  - id: 4023
    name: "宅邸门外 / 爆炸后回收区"
    type: free_exploration
    design_tags: [aftermath, expose_location]
    description: |
      玩家完成必需检查后，Emma 依据煤气味、铅封、接线、阀门和窗缝组织撤离。
      23:50 左右装置启动，宅邸爆炸。原始右手枪位未形成可供官方复核的现场照片。
      回收区成为 Doris Expose 与后续程序争夺的场地。

    evidence:
      - id: 4317
        name: "214号黄铜寄存柜钥匙"
        type: key_item
        pickup: true
        note: "解锁 SC4026；Expose R3 陷阱，只证明寄存柜存在"
        description: "爆炸从 Harold 的衣物中震出，带车站标记和 214 柜号"

    npcs:
      L3_scene4023_pierce:
        talk: L3_scene4023_pierce
        is_liar: false
        motive: "控制证人、记录和案件程序，让无法复核的右手枪位降格为私人说法"
        mindset: "不直接争论事实，只追问记录资格、现场完整性和证词冲突"
        active_topics:
          - "原始现场已被爆炸摧毁"
          - "要求 Zack 停止搜查与质问 Doris"
          - "向 Mickey 询问他第一次看见尸体时枪在哪只手"
        withheld_topics:
          - "Harrison 的清理由 Miller 上层决定、由自己执行"
          - "自己不是 Harold 枪手，也不是煤气安装者"
          - "是否掌握煤气装置细节尚未锁定，不得主动说明"
        player_inquiry:
          - "Pierce 为什么拒绝启动他杀调查"
        testimony_ids: null

  - id: 4024
    name: "夜班电话交换台"
    type: free_exploration
    description: "人工接线台保留当夜线路时间、去向与接线员记下的口信；只证明电话事实，不确认接听人。"
    npcs:
      L3_scene4024_operator:
        talk: L3_scene4024_operator
        is_liar: false
        motive: "按接线簿和自己听见的原话提供程序事实，不替侦探猜测电话另一端的人"
        mindset: "准确、疲惫、怕惹麻烦；反复限定自己只能确认线路去向"
        active_topics:
          - "22:36 Harold 打给 Brennan 事务所，无人接听，表示准备自己过去"
          - "22:43 Harold 打给 Donnelly & Associates，留下体面收尾的口信"
          - "23:15 Harold 再次接通 Brennan 事务所，只说出 Zack 的姓"
        withheld_topics:
          - "谁最终听见 22:43 的口信"
          - "谁在 23:15 切断电话"
          - "Donnelly 与 Whale 的关系"
        player_inquiry:
          - "三次电话的准确时间、去向与原话"
          - "接线员能否确认接听人"
        testimony_ids:
          - 4153001

  - id: 4025
    name: "法院外圈 / 调度台"
    type: free_exploration
    description: "法院东门与市政档案库交接材料散放在调度台；这里只提供排班与城市人手方向，不制造绝对不在场。"
    evidence:
      - id: 4318
        name: "Harrison案证物转运调度材料"
        type: item
        pickup: true
        note: "21:30-23:20 Pierce 被安排负责法院交接；只提高其在法院的可能，不能单件排除离岗"
        description: "调度单、交接栏与人员安排的合订材料，缺少足以证明全程在场的独立连续记录"
      - id: 4319
        name: "晚间报纸号外"
        type: item
        pickup: true
        note: "跨 Loop 城市伏笔；银月会常用打手在西区冲击工会互助站"
        description: "电讯号外报道西区工会互助站遭冲击，只提示城市另一处正在牵制人手"

  - id: 4026
    name: "车站 214 号寄存区"
    type: free_exploration
    design_tags: [locked]
    unlock_item: 4317
    description: "使用黄铜钥匙打开 214 号柜；柜中只有 Harold 准备交给 Zack 的未寄出口供。"
    evidence:
      - id: 4320
        name: "Morrison写给Zack的未寄出口供"
        type: item
        pickup: true
        note: "Expose R3 主力；只证明材料存在，不由物件反推 Doris 读过全文"
        description: "Harold 承认自己替 Pierce 与 Whale 压过旧案；收到档案接管通知后决定留下站外材料，不愿最后选择被写成自杀或疯狂"

expose:
  target: doris
  target_talk: L3_expose_doris
  location: "SC4023 宅邸门外 / 爆炸后回收区"
  total_rounds: 3
  is_liar: true
  player_inquiry: null
  unlock_condition:
    doubts_completed: [4301, 4302, 4303]

  context: |
    Doris 的防守不是组织忠诚，而是想让 Harold 的死亡尽快停在家庭门内。
    Zack 依次击破“准备留家”“没有访客”“没有留下材料”三项事实说法。
    指证不能逼出访客身份、枪手、Whale 或上层命令源。

  round_1:
    lie: "Harold 当晚没有打算离开，准备一直在家里休息"
    lie_source: 4063003
    usable_evidence:
      - id: 4153001
        name: "Morrison最后通话记录"
        用途: "22:36 明确表示会亲自去 Brennan 事务所，直接击破留家计划"
    trap_evidence:
      - id: 4313
        name: "Pierce档案移交通知（档案袋装）"
        用途: "只证明接管压力，不证明 Harold 当晚准备外出"
    result: "Doris 被迫承认 Harold 原本准备离家找 Zack，但仍拒绝承认有人到访。"

  round_2:
    lie: "家里没有来过除了我以外的第二个人"
    lie_source: 4063004
    usable_evidence:
      - id: 4314
        name: "两只酒杯"
        用途: "第二杯在到场前不久仍被使用"
      - id: 4315
        name: "古巴雪茄烟蒂"
        用途: "烟蒂与第二杯湿水痕属于同一次近期会面"
    trap_evidence:
      - id: 4153001
        name: "Morrison最后通话记录"
        用途: "电话只证明邀请去向，不能证明访客实际到场"
    result: "Doris 承认返家时已经看见第二杯，但她没有看见访客离开，也不知道对方是谁。"

  round_3:
    lie: "Harold 没有留下任何准备交给你的材料"
    lie_source: 4063005
    usable_evidence:
      - id: 4320
        name: "Morrison写给Zack的未寄出口供"
        用途: "直接证明 Harold 在站外留下了准备交给 Zack 的材料"
    trap_evidence:
      - id: 4317
        name: "214号黄铜寄存柜钥匙"
        用途: "钥匙只证明寄存柜存在，不能证明柜内材料内容"
    result: |
      Doris 承认她知道 Harold 在站外留了材料，却不知道口供全文。
      她只想阻止死者继续被公开拆解，不是替组织守密。

  post_expose:
    description: |
      Doris 下意识确认 Harold 一直惯用左手，形成 4063002。
      Zack 指出爆炸前手枪明明被放在右手。Pierce 转而询问 Mickey；
      Mickey 正式回答自己初见尸体时枪在左手。原始现场已毁，
      Pierce 以两份相反证词无法裁定为由拒绝启动他杀调查，并按自杀结案。
