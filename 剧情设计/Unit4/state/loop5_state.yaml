player_context:
  chapter_goal: 查清 Whale 的身份与 Miller 系统如何借法律、金融和警务接口运作
  goals:
    primary: 在 Mickey 主动承认前，用三条完整证明链坐实 Mickey = Whale
    secondary:
    - 确认 Donnelly & Associates、1919-A 与 W / Whale 接口的连续关系
    - 确认 Harold Morrison 死前的近期访客及其对现场收尾的参与
    - 区分 Mickey 的责任、Pierce 的责任与 Miller 上层另线清场
    - 身份坐实后，拒绝用真实成果替被牺牲者补签同意
  known_facts:
  - Harrison 长期收受 1919-A 资金，并替圣心医院赔偿、南区地产安排提供法院便利
  - Harrison 最近连续十七晚在闭庭后调阅医院、地产与旧判决材料
  - Harrison 重查了自己亲手签过的赔偿裁定，不再只把问题归给别人
  - Harrison 连续三次推动 Mary 案无罪改判，并起草辞职信，准备公开自身责任
  - Harrison 的公开、自首和司法承担尚未完成；保险柜只是未完成的自首证物箱
  - Watts 交出钥匙，是执行 Harrison 的最后要求，而不是替 Harrison 洗清罪责
  - 保险柜材料显示 Rosa 的正式听证迫近，并留下七个用途未明的圣心医院编号、医院冷藏库官方留样；交接说明另提到一份将在L2正式交付的Isabel病历材料
  - Rosa 没有在规定剂量之外使用第十四次完整剂量；回收药瓶实际消耗量与十三次规定剂量吻合
  - Harrison 的七个编号对应五年内七名死亡儿童，七人均由 Whitfield 负责的 Miller 慈善项目经手，并出现相似症状与重复的家属归责方式
  - Giuseppe与Bridget的两瓶旧药样本与Harrison官方留样配方一致，但不能确认同一生产批次，也不能推及七名儿童
  - Isabel病历发放号、Rosa回收药瓶与Harrison医院官方留样属于同一采购记录、同一生产批次和同一配方
  - Harrison医院官方留样从冷藏库调取后始终置于带独立碎冰槽和镀锌金属内胆的上锁木质保冷箱；样本格医院纸封／蜡封未破，交接单逐次记录装箱时间、箱内温度与经手人，补冰不开启样本格，直至Foster签收；化验后仍显示连续使用风险
  - 现有材料不能证明另外六名儿童使用了与Isabel完全相同的配方或生产批次
  - Whitfield 是正式项目执行层，不能再以家属加量、孤立事故或家庭保存不当推卸本案责任
  - 执行层副本缺失第十九页，更高层特别采购批准暂时没有可核验的签字原件
  - Mickey 为 Rosa 争取窗口、担任辩护并帮助取得暂停追究的结果，这份帮助真实
  - Mickey 同时主动把公开压力集中在 Whitfield，使调查暂时停在可牺牲的执行层
  - Harold 没有把 Harrison 材料告知 Pierce，并警告 Zack 不要太相信法院里的胜利
  - 截至 L2 散庭，Harold 只留下以后私下谈的口子，没有决定或承诺完整坦白
  - Harold 原本准备去找 Zack，不是在家等待自杀
  - Harold 死前不久接待过一名近期访客
  - Harold 确实在车站寄存柜留下了准备交给 Zack 的材料
  - Doris 知道 Harold 留有站外材料，但不知道口供全文，也不知道访客和枪手身份
  - Harold 长期惯用左手；Zack 在爆炸前看见手枪被放在尸体右手
  - Mickey 向 Pierce 正式回答自己初见尸体时枪在左手，与 Zack 的私人观察冲突
  - 原始现场被爆炸摧毁后，Pierce 以相反证词为由拒绝启动他杀调查，警方仍按自杀结案
  - 煤气与时钟装置在 Harold 最后求助前已进入宅邸
  - 4318 只提高 Pierce 当时在法院的可能，不能作为绝对不在场证明
  - O'Hara 从未同意出售，Margaret 明知这一点仍替她安排离开
  - Margaret 明确要求 O'Hara 不找 Zack，主动切断了求助路径
  - Patrick 折返前唯一收到的即时转运信息只有“还有一人”，没有姓名
  - Patrick 在看见被困者以前已折返，不知道那个人是 Mickey
  - Patrick 救出 Mickey 后未恢复可交流意识，不存在临终交接或使命继承
  - Margaret 真正害怕的是 Zack 重复 Patrick 把自己放入风险的道路；她仍不赞成 Zack 继续追查
  - Mickey右下牙长期缺损只提供现场烟蒂的比较方向，单独不具备定人能力
  - Donnelly & Associates 在 Patrick 葬礼后不久开始持续出现；L4 材料只建立法律壳方向
  - Patrick遗物匣的信条提供四十二层保险柜密码方向
  - 临时停止执行真实挡住了警务清退并让 Sarah 获得安全转移；O'Hara 仍自主选择留在屋内
  current_assumptions:
  - Donnelly & Associates 很可能与 1919-A 属于同一资金网络，但尚未取得授权关系
  - Mickey 很可能是 Harold 死前的近期访客，但仅有电话去向与现场烟蒂还不能锁定他
  - Whale 与 Mickey 的活动边界高度重合，但身份尚未由玩家完成证明
  - Miller 系统可能位于 Whale 之上，但上层与接口的责任必须由内部材料分开
  new_directions:
  - direction: 前往四十二层 Donnelly & Associates
    trigger: Patrick 葬礼册与 1919 旧信封提供了办公室地址；Zack 不等待 Mickey 安排对质
  - direction: 用 Patrick 遗物匣刻句打开 Mickey 的字母锁保险柜
    trigger: 遗物匣上的七词刻句可转化为首字母 FTMWPTF
  - direction: 完成三条独立身份锁证明链
    trigger: 保险柜内材料与既有跨 Loop 证据形成法律壳、作者视角、近期访客三种不同维度
  post_expose_knowledge:
  - Mickey 就是 Whale；这个身份是在其承认前由玩家完成证明
  - Mickey 是 1919-A 的唯一授权签字人并实际控制资金操作，但材料不证明其拥有账户法律所有权
  - Mickey 先经营 Donnelly 法律资金接口，1925 年正式接管 W / Whale 职责
  - Mickey 是 Harold Morrison 死前访客，并对枪杀、伪造遗书和右手枪位现场收尾负责
  - Miller 上层另线安排煤气清场；Mickey 不知道装置形式与启动时间
  - Harrison 的死亡由 Miller 上层决定，Pierce 执行并接管现场与档案；Mickey 未下令、未参与
  - Mickey 为 Rosa、Mary 与部分工人争取过的结果真实存在，但不能替 Harrison、Harold 或其他人决定代价
  - Miller 给过 Mickey 交档案上车的现实生路；Mickey 拒绝交档案，最后主动松开 Zack 的手
  - Emma 自主赶到四十二层并救回 Zack；两人带走尚未拆封的 Miller 保险档案
opening:
  type: cutscene_sequence
  runtime_root:
    table: ChapterConfig
    init_scene: 4041
    init_talk: L5_opening_42nd_floor_arrival
  sequence:
  - event_id: forty_second_floor_arrival
    talk: L5_opening_42nd_floor_arrival
    scene_id: 4041
    source_anchor: active outline / Loop5 / 开篇剧情 / 四十二层
    cast:
    - Zack
    required_beats:
    - Zack 根据 Donnelly & Associates 旧信封地址独自来到四十二层。
    - Mickey 没有邀请 Zack，办公室暂时无人。
    - 4041只承担地址抵达、外厅与楼梯动线的建立镜头，不提供玩家操作。
