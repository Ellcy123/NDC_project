expose:
  target: mickey
  target_npc_id: 403
  target_talk: L5_expose_mickey
  location: 4042 Mickey 私人办公室
  total_rounds: 3
  is_liar: true
  player_inquiry: null
  unlock_condition:
    identity_lock_completion: all_chains_completed
    required_entry_event: mickey_returns
    required_testimony_ids:
    - 4035001
  context: 'Mickey 返回后看见保险柜已打开，以及 Zack 手中的接管记录、授权附页与功业簿。

    他不承认这是自己安排的会面，也不承认 Zack 有权进入办公室。

    他主动把材料拆回客户账务、共同进场后的所见和匿名客户三种防线。

    Expose 只处理可由证据反驳的事实；价值判断留到身份承认后的固定对白。

    '
  rounds:
  - id: round_1
    lie: Donnelly 只是代客户处理账务；1919-A 不是我的账户，我不能决定资金用途
    lie_source: 4035001
    dimension: 唯一授权签字与实际控制
    usable_evidence:
    - id: 4514
      name: 1919 年的银行授权附页-Donnelly & Associates（手写签名）
      purpose: '授权附页确认 Michael F. Donnelly 是 1919-A 唯一授权签字人，

        实际控制资金操作；不把账户法律所有权写成 Mickey 私有。

        '
    result: 'Mickey 被迫承认自己能决定 1919-A 的资金操作，但退守到：

      他知道的只有自己与 Zack、Emma 共同进场后看到的；

      在两人赶到以前他没进过 Harold 家，第一次进去时 Harold 已经死了。

      '
  - id: round_2
    lie: 我知道的，只有我们一起进去以后看到的；你们赶到以前我没进过 Harold 家，第一次进去时他已经死了
    lie_source: 4035002
    dimension: 到访时间窗口 × 私人物件来源 × 复合物理特征
    prerequisite_context:
    - id: 4153001
      name: Morrison最后通话记录
      purpose: 限定 22:43 Donnelly 来电之后的近期到访窗口，不确认接听者
    usable_evidence:
    - id: 4315
      name: 古巴雪茄烟蒂
      purpose: 近期访客在 Harold 现场留下的对照物
    - id: 4512
      name: Mickey的半支古巴雪茄
      purpose: '来自刻有 M.F.D. 的私人烟灰缸，并有 Zack 既往目击作为所有权来源；

        两支雪茄需同时匹配品牌、直径、含咬位置、前段内陷、后段缺一枚

        完整压痕及约三十度斜向受力。

        '
    invalid_shortcuts:
    - 只出示 4704 右下牙长期缺损
    - 只比较单项牙印
    - 把齿痕说成法医学唯一鉴定
    result: 'Mickey 被迫承认自己早些时候去过、Harold 当时还活着，却继续把身份拆开：

      他替 Whale 管过账户、保存过记录，但 Whale 是匿名客户，

      自己只负责把客户决定变成合法文件。

      '
  - id: round_3
    lie: Whale 是我的匿名客户；我只是替他保存记录、把他的决定变成合法文件
    lie_source: 4035003
    dimension: 正式接管身份 × 长期参与者行动视角
    usable_evidence:
    - id: 4513
      name: 1925年内部接口接管记录
      purpose: 记录明确标注 W / Whale 的正式接管与职责
    - id: 4515
      name: Mickey功业簿（手写）
      purpose: '长期记录包含普通律师无法从公开材料取得的会面、现场收尾与

        上层另线清场边界，并已由 4502 证明为 Mickey 长期书写。

        '
    result: '匿名客户防线失效。玩家已经证明 1925 接管者、功业簿书写者、

      1919-A 实际控制者和 Harold 死前访客是同一人。

      '
  post_expose:
    offscreen_state_changes:
    - Emma因Zack长时间未回电话自主决定前往四十二层；抵达楼下后发现Tidewater车辆与人员增加，先向Watts留下地址、车辆异常与楼梯撤离方向，再独自改走楼梯。她不参与身份锁与三轮Expose，只在坠落时抵达并抓住Zack。
    - Mickey拒绝Miller“交档案并独自上车”的条件后，4516留在办公室，坠落后由Zack与Emma带走。
    identity_acknowledgment:
      first_explicit_mapping: Mickey：是。我是 Whale。
      boundary: '这是玩家完成证明后的情感落锤，不是 Mickey 替玩家揭晓反转。

        从这一刻起，文本才允许明确写 Mickey / Whale 对照。

        '
      responsibility_statement:
      - Moore 让人欠债，Lakeshore 给债务和估价披投资外衣
      - Lawson 团队接走房子
      - 文件能解决的交给律师，文件解决不了的交给 Pierce 和银月会
      - Mickey 负责让两种方法之间没有缝
    linear_value_dialogue:
      interaction_type: fixed_dialogue
      evidence_selection: false
      response_branches: false
      relationship_values: false
      achievements: false
      new_case_facts_allowed: false
      topics:
      - order: 1
        name: 身份不是全部
        mickey_position: 证明我是 Whale，只证明我做过这些事，不证明这些事没有救人
        zack_position: '不否认 Rosa、Mary、医院项目终止与工人援助的真实成果；

          只追问 Harrison 与 Harold 是否有机会自己决定愿不愿意付代价。

          '
        prohibited_line: 你的帮助都是假的
      - order: 2
        name: 你和我一样
        mickey_position: 你也签过不该签的文件，知道真相后没有告诉 Emma
        zack_position: '承认自己做过、也差点把救到人当成继续隐瞒的许可证；

          拒绝用“我的动机更好”免责。

          '
      - order: 3
        name: Patrick也算过
        mickey_position: Patrick 最后选的是我；他知道谁能接下没做完的事
        zack_position: 'Patrick 在知道被困者姓名前已经折返，也没有留下使命交接。

          他救的是一个尚未确认身份的工友，不是事先选中的继承人。

          不得借此羞辱 Mickey 不值得被救。

          '
        supporting_known_fact:
          testimony_id: 4104001
          name: Margaret关于Patrick折返的正式摘要
        closing_question: Mickey，你会觉得 Harrison 和 Harold 的生命，比你自己的更重要吗？
      - order: 4
        name: 系统还需要我
        mickey_position: 我停下以后，谁从内部带档案出来、替下一个 Rosa 留路
        zack_position: '不否定内部位置曾经救人；击穿的是 Mickey 对救援渠道和判断权的垄断。

          把档案留下，让不止一个人知道，下一次就不必等 Whale 决定谁值得被救。

          '
    miller_final_condition:
      trigger: 市政厅专线响起
      offer:
      - 取回 4516 Miller保险外卷与内封套
      - 把档案交给楼下司机
      - Mickey 独自上车
      - Miller 暂时保留其律师身份
      - Zack 可以离开，但不能带走档案
      truth_status: 现实可执行的生路，不是空头诱骗
      mickey_choice:
        line: 档案不归你们了。
        action: 拔掉电话线，不再索回档案
      moral_boundary: '这次选择只说明 Mickey 第一次允许真相脱离自己控制；

        不能抵消此前死亡，也不改变司法责任。

        '
    fall_sequence:
      fixed_outcome: true
      beats:
      - 楼下黑色轿车鸣笛，Mickey 走向窗口
      - Mickey 询问 Liam 与 Patrick 是否会觉得自己至少做对过一点
      - Zack 回答：我不知道；你也不知道
      - Zack 察觉不对，抓住 Mickey 袖口；布料在窗框边缘撕裂
      - Mickey 坠出窗外，Zack 抓住他的手
      - Mickey 主动松开 Zack 的手，不写意外滑落
      - Zack 被带向窗外；Emma 从后方抓住 Zack 并把他拉回室内
      - Emma确认Zack还能行动后，两人收起4516与其余文件，从消防楼梯安全离开办公室层
      retained_images:
      - Mickey 向下坠落的身影
      - Zack 抓空的手
      - Zack 掌心一小片被撕下的袖料
      emma_line: 该走了。走楼梯，他们的人已经来了。
      archive_state: 4516 仍在室内，内封未拆；由 Zack 与 Emma 带走
      loop_end_condition: Emma 留出一段呼吸后，进入非 Loop ending_sequence
    player_knowledge_gained:
    - Mickey = Whale
    - Mickey 对 Harold 枪杀与自杀现场伪装负责；煤气由 Miller 上层另线安排
    - Miller 位于 Whale 接口之上
    - Mickey 的真实帮助与其替别人决定代价同时成立
    - Mickey 拒绝交档案并主动松手坠落
    event_id: identity_value_dialogue_and_fall
    talk: L5_post_expose_identity_and_fall
    runtime_exit:
      action: change_scene
      target_scene_id: 4043
      continuation: next_talk
      next_talk: L5_ending_departure
  lie_source_semantics:
    round_1:
      kind: collectible_lie_anchor
      collectible_testimony: true
      boundary: R1 lie_source必须先在普通Talk中说出并取得，Expose只回放同一原话。
    later_rounds:
