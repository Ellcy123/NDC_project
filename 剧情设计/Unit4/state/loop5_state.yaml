# ─────────────────────────────
# 一、玩家视角（本循环）
# ─────────────────────────────

player_context:
  chapter_goal: "查清 Whale 的身份与 Miller 系统如何借法律、金融和警务接口运作"
  goals:
    primary: "在 Mickey 主动承认前，用三条完整证明链坐实 Mickey = Whale"
    secondary:
      - "确认 Donnelly & Associates、1919-A 与 W / Whale 接口的连续关系"
      - "确认 Harold Morrison 死前的近期访客及其对现场收尾的参与"
      - "区分 Mickey 的责任、Pierce 的责任与 Miller 上层另线清场"
      - "身份坐实后，拒绝用真实成果替被牺牲者补签同意"

  known_facts:
    # L1 post_expose_knowledge 完整继承（7 条稳定事实；临时未知项留在 L1 current_assumptions）
    - "Harrison 长期收受 1919-A 资金，并替圣心医院赔偿、南区地产安排提供法院便利"
    - "Harrison 最近连续十七晚在闭庭后调阅医院、地产与旧判决材料"
    - "Harrison 重查了自己亲手签过的赔偿裁定，不再只把问题归给别人"
    - "Harrison 连续三次推动 Mary 案无罪改判，并起草辞职信，准备公开自身责任"
    - "Harrison 的公开、自首和司法承担尚未完成；保险柜只是未完成的自首证物箱"
    - "Watts 交出钥匙，是执行 Harrison 的最后要求，而不是替 Harrison 洗清罪责"
    - "保险柜材料显示 Rosa 的庭审迫近，并留下圣心医院儿童死亡对照与问题批次药剂"

    # L2 post_expose_knowledge 完整继承（10 条）
    - "Rosa 没有在规定剂量之外额外注射；止动结构、日期撕签和实际消耗量不存在额外用量缺口"
    - "Isabel 的死亡不是单例；另外两名死亡儿童的药瓶与 Isabel 属于同一批次"
    - "问题批次正式进入圣心医院采购、入库与慈善发放链"
    - "加急效价对照只能证明同批样本效力明显不一致，且不能用单支家庭保存不当解释"
    - "Whitfield 是正式项目执行层，不能以家属误用、单例或非正式来源推卸责任"
    - "执行层副本缺失第十九页，更高层特别采购批准暂时没有可核验的签字原件"
    - "Mickey 为 Rosa 争取窗口、担任辩护并帮助取得暂停追究的结果，这份帮助真实"
    - "Mickey 同时主动把公开压力集中在 Whitfield，使调查暂时停在可牺牲的执行层"
    - "Harold 没有把 Harrison 材料告知 Pierce，并警告 Zack 不要太相信法院里的胜利"
    - "截至 L2 散庭，Harold 只留下以后私下谈的口子，没有决定或承诺完整坦白"

    # L3 post_expose_knowledge 完整继承（9 条）
    - "Harold 原本准备去找 Zack，不是在家等待自杀"
    - "Harold 死前不久接待过一名近期访客"
    - "Harold 确实在车站寄存柜留下了准备交给 Zack 的材料"
    - "Doris 知道 Harold 留有站外材料，但不知道口供全文，也不知道访客和枪手身份"
    - "Harold 长期惯用左手；Zack 在爆炸前看见手枪被放在尸体右手"
    - "Mickey 向 Pierce 正式回答自己初见尸体时枪在左手，与 Zack 的私人观察冲突"
    - "原始现场被爆炸摧毁后，Pierce 以相反证词为由拒绝启动他杀调查，警方仍按自杀结案"
    - "煤气与时钟装置在 Harold 最后求助前已进入宅邸"
    - "4318 只提高 Pierce 当时在法院的可能，不能作为绝对不在场证明"

    # L4 post_expose_knowledge 完整继承（10 条）
    - "O'Hara 从未同意出售，Margaret 明知这一点仍替她安排离开"
    - "Margaret 明确要求 O'Hara 不找 Zack，主动切断了求助路径"
    - "Patrick 折返前唯一收到的即时转运信息只有“还有一人”，没有姓名"
    - "Patrick 在看见被困者以前已折返，不知道那个人是 Mickey"
    - "Patrick 救出 Mickey 后未恢复可交流意识，不存在临终交接或使命继承"
    - "Margaret 真正害怕的是 Zack 重复 Patrick 把自己放入风险的道路；她仍不赞成 Zack 继续追查"
    - "Mickey右下牙长期缺损只提供现场烟蒂的比较方向，单独不具备定人能力"
    - "Donnelly & Associates 在 Patrick 葬礼后不久开始持续出现；L4 材料只建立法律壳方向"
    - "Patrick遗物匣的信条提供四十二层保险柜密码方向"
    - "临时停止执行真实挡住了警务清退并让 Sarah 获得安全转移；O'Hara 仍自主选择留在屋内"

  current_assumptions:
    - "Donnelly & Associates 很可能与 1919-A 属于同一资金网络，但尚未取得授权关系"
    - "Mickey 很可能是 Harold 死前的近期访客，但仅有电话去向与现场烟蒂还不能锁定他"
    - "Whale 与 Mickey 的活动边界高度重合，但身份尚未由玩家完成证明"
    - "Miller 系统可能位于 Whale 之上，但上层与接口的责任必须由内部材料分开"

  new_directions:
    - direction: "前往四十二层 Donnelly & Associates"
      trigger: "Patrick 葬礼册与 1919 旧信封提供了办公室地址；Zack 不等待 Mickey 安排对质"
    - direction: "用 Patrick 遗物匣刻句打开 Mickey 的字母锁保险柜"
      trigger: "遗物匣上的七词刻句可转化为首字母 FTMWPTF"
    - direction: "完成三条独立身份锁证明链"
      trigger: "保险柜内材料与既有跨 Loop 证据形成法律壳、作者视角、近期访客三种不同维度"

  post_expose_knowledge:
    - "Mickey 就是 Whale；这个身份是在其承认前由玩家完成证明"
    - "Mickey 是 1919-A 的唯一授权签字人并实际控制资金操作，但材料不证明其拥有账户法律所有权"
    - "Mickey 先经营 Donnelly 法律资金接口，1925 年正式接管 W / Whale 职责"
    - "Mickey 是 Harold Morrison 死前访客，并对枪杀、伪造遗书和右手枪位现场收尾负责"
    - "Miller 上层另线安排煤气清场；Mickey 不知道装置形式与启动时间"
    - "Harrison 的死亡由 Miller 上层决定，Pierce 执行并接管现场与档案；Mickey 未下令、未参与"
    - "Mickey 为 Rosa、Mary 与部分工人争取过的结果真实存在，但不能替 Harrison、Harold 或其他人决定代价"
    - "Miller 给过 Mickey 交档案上车的现实生路；Mickey 拒绝交档案，最后主动松开 Zack 的手"
    - "Emma 自主赶到四十二层并救回 Zack；两人带走尚未拆封的 Miller 保险档案"

# ─────────────────────────────
# 二、开篇（🎬 一拍交代现实入口）
# ─────────────────────────────

opening:
  type: cutscene
  scene_id: 4041
  scene_name: "L5 开篇 · 四十二层前厅 / 夜班入口"
  location: "Donnelly & Associates 四十二层公共前厅"
  time: "午夜前"
  characters: [Zack, 夜班门房]
  description: |
    Zack 根据 Patrick 葬礼册与 1919 旧信封上的地址独自来到四十二层。
    Donnelly & Associates 仍在处理夜间客户事务，公共前厅没有关闭。
    Mickey 临时下楼处理一通来电，私人办公室门没有落锁。
    熟识 Zack 的夜班门房依照夜间客户惯例，明确示意他去未锁的私人办公室内等候。
    Zack 按门房指引进入；这不是 Mickey 的邀请，也不是趁门房离开偷偷潜入。
    本段只交代现实入口，不设置破门、潜入、撬锁、门禁或说服谜题。

  npcs:
    L5_opening_night_doorman:
      npc_id: null
      name: "夜班门房"
      talk: L5_opening_night_doorman
      is_liar: false
      motive: "维持律师事务所夜间客户秩序；按熟客惯例明确指引 Zack 去未锁办公室等候"
      mindset: "忙碌、职业化，不参与案件判断，也不知道保险柜与 W / Whale 文件"
      known_information:
        - "Donnelly & Associates 今夜仍有客户事务"
        - "Mickey 临时下楼处理来电"
        - "按夜间熟客惯例，Zack 可以去未锁的私人办公室内等候"
        - "Mickey 的私人办公室门暂时没有落锁"
      withheld_information:
        - "无；他不知道 Mickey 的真实身份、保险柜内容和楼下车辆用途"
      player_inquiry:
        - "Mickey 是否在办公室"
        - "为什么前厅午夜前仍开放"
      testimony_ids: []

  transition:
    next_scene: 4042
    condition: "入口交代完成"
    player_control: "进入 4042 后恢复"

# ─────────────────────────────
# 三、场景（🔓 自由探索 / 身份锁 / Expose）
# ─────────────────────────────

scenes:
  - id: 4041
    name: "四十二层前厅 / 夜班入口"
    type: transition
    description: |
      公共前厅仍亮着灯，登记簿、电话线和夜间客户座椅维持正常营业感。
      夜班门房明确指引熟客 Zack 去未锁办公室等候。该场景只提供 Zack 合理
      进入 4042 的现实条件，不承载证据或额外玩法，也不构成 Mickey 的邀请。
    evidence: []
    npcs:
      L5_scene4041_night_doorman:
        npc_id: null
        name: "夜班门房"
        talk: L5_scene4041_night_doorman
        is_liar: false
        motive: "完成夜间登记并照看公共前厅"
        mindset: "把 Zack 当作熟识的来访侦探，不主动介入私人办公室事务"
        known_information:
          - "Mickey 下楼处理来电"
          - "私人办公室门暂未落锁"
        withheld_information:
          - "无；不掌握案件核心事实"
        player_inquiry:
          - "Mickey 何时回来"
        testimony_ids: []

  - id: 4042
    name: "Mickey 私人办公室"
    type: free_exploration_identity_lock_expose_story
    description: |
      四十二层唯一缺少社区感的高处空间。书桌、刻有 M.F.D. 的私人烟灰缸、
      市政厅专线和字母锁保险柜都井然有序。Mickey 返回前，Zack 可以检查书桌，
      取得钢笔与半支雪茄，并用 Patrick 遗物匣刻句打开保险柜。
      玩家必须完成三条身份锁证明链，Mickey 才返回并进入正式 Expose。

    access:
      from_scene: 4041
      door_state: "临时未锁"
      prohibited_interactions:
        - "破门"
        - "撬锁"
        - "潜入判定"
        - "门禁谜题"

    interactions:
      - id: interaction_mickey_desk
        name: "检查 Mickey 的书桌"
        outputs: [4511, 4512]
      - id: interaction_letter_safe
        name: "输入字母锁密码"
        input_source: 4418
        input_logic: "FOR THE MANY WE PAY THE FEW 的七词首字母"
        accepted_input: "FTMWPTF"
        outputs: [4513, 4514, 4515, 4516]
        design_boundary: |
          这不是 Mickey 留给 Zack 的邀请或普通谜语，而是 Mickey 长期使用的私人信条。
          玩家亲手输入这句话，才能看见它实际保护的文件。

    evidence:
      - id: 4511
        name: "Mickey定制钢笔"
        type: item
        pickup: true
        analysis: true
        source: "Mickey 私人书桌"
        description: |
          笔帽刻有 M.F.D.；笔尖右侧有长期缺口，在特定转折处留下稳定断墨。
          只能辅助确认同一书写工具与作者，不能单独证明文字内容真实。
        uses:
          - "identity_lock.chain_4502"

      - id: 4512
        name: "Mickey的半支古巴雪茄"
        type: item
        pickup: true
        analysis: true
        source: "刻有 M.F.D. 的私人烟灰缸"
        ownership_basis:
          - "烟蒂位于 Mickey 私人办公室、刻有 M.F.D. 的私人烟灰缸内"
          - "Zack 曾亲眼见 Mickey 使用同品牌雪茄，并在同一侧含咬"
        description: |
          半支古巴雪茄。与 L3 现场烟蒂比较时，必须同时核对品牌、直径、
          含咬位置，以及“前段向内塌陷、后段缺少一枚完整压痕、整体约三十度
          斜向受力”的复合齿痕。任一单项相似都不足以锁定所有者。
        forensic_boundary: |
          这是电话到访窗口、可靠物件所有权与多项复合特征的交叉证明，
          不是把齿痕当作指纹式唯一鉴定；也不能单独证明开枪或 Whale 身份。
        uses:
          - "identity_lock.chain_4503"
          - "expose.round_2"

      - id: 4513
        name: "1925年内部接口接管记录"
        type: item
        pickup: true
        source: "字母锁保险柜"
        pre_acknowledgment_display: |
          Donnelly & Associates 自 1919 年起承担 Tidewater 的合同、产权、
          银行重组与诉讼拖延。1925 年接管页只写内部代号 W，
          代号说明栏写 W / Whale；不出现实名对照。
        description: |
          职责栏为“警务协调 / 银月会联络 / 非合同障碍处理”。
          它证明法律壳经营在前、W / Whale 接管在后，不能把 Mickey 写成
          从 1903 年起就是 Whale。
        uses:
          - "identity_lock.chain_4501"
          - "expose.round_3"

      - id: 4514
        name: "1919年的银行授权附页-Donnelly & Associates"
        type: item
        pickup: true
        analysis: true
        source: "字母锁保险柜"
        description: |
          1919-A 被记为 Donnelly & Associates 受托结算子账户；
          唯一授权签字人为 Michael F. Donnelly，账户用途栏引用 Harrison
          存根上的圣心医院赔偿案号。
        proof_boundary: |
          证明 Mickey 是唯一授权签字人并实际控制资金操作；
          不等于账户法律所有人，不得写成“1919-A 是 Mickey 的私人账户”。
        uses:
          - "identity_lock.chain_4501"
          - "identity_lock.chain_4502"
          - "expose.round_1"

      - id: 4515
        name: "Mickey功业簿"
        type: item
        pickup: true
        analysis: true
        source: "字母锁保险柜"
        pre_acknowledgment_display: |
          同一名书写者长期记录的内部行动簿。作者身份尚未由系统确认；
          页面使用 W / Whale 接口语言，不提前显示实名对照。
        entries:
          - "O'Brien：退出；罢工网络保留"
          - "Webb：双重材料失控；接口收束；银月会关系维持"
          - "Moore：银行执行层可让步；Frank 线可暴露；Lakeshore 不进入法庭记录"
          - "Harrison：Miller 上层独立清理；Pierce 接管现场与档案；圣心医院执行层可让出；不得继续向上追查"
          - "Morrison：会面失控；现场按自杀口径收尾；惯用手留有偏差；清场由上层另线完成"
          - "Rosa：免于定罪；医院项目终止"
          - "Mary：脱离死刑风险；Brennan 完成越线测试"
        proof_boundary: |
          Morrison 页提供会面、枪杀与现场处理参与者视角，并把枪杀与
          上层另线清场分开。它不把 Mickey 写成 Miller 最终命令源，
          也不把煤气安装责任归给 Mickey。
        uses:
          - "identity_lock.chain_4502"
          - "expose.round_3"

      - id: 4516
        name: "Miller保险外卷与内封套"
        type: container
        pickup: true
        source: "字母锁保险柜"
        loop5_state: "外卷可查看；内封套保持未拆"
        pre_acknowledgment_display: |
          外卷只显示 W / Whale 负责法律障碍、Pierce 警察网络与银月会协调。
          身份承认前禁止出现实名对照。
        outer_volume_visible_information:
          - "O'Hara 是南区第一批核心拒售户，标注优先处理"
          - "湖滨信托银行 / Moore 制造债务与违约"
          - "Lakeshore 负责资金、估价和项目审批"
          - "Tidewater / Lawson 团队接收房产并推进工程"
          - "W / Whale 负责法律障碍及 Pierce 警察网络、银月会协调"
          - "项目收益摘要只含预期地价、开发资格与 Miller 项目委员会最终审批权"
        inner_envelope_visible_information:
