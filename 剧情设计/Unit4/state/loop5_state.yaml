special_mechanics:
  identity_lock:
    status: provisional
    replaces_standard_doubts: true
    design_contract: "方案 B；输入、输出、证明边界与剧情结论锁定，交互表现仍可讨论"
    open_questions:
      - ui_layout
      - submission_method
      - failure_feedback
      - chain_open_order

    entry_condition:
      - "已取得 4513、4514、4515"
      - "仍持有所有跨 Loop 输入材料"

    chains:
      - id: 4501
        name: "法律壳与身份演变"
        inputs:
          - type: item
            id: 4112
            name: "1919-A入账存根"
            source_loop: 1
          - type: item
            id: 4514
            name: "1919年的银行授权附页-Donnelly & Associates"
            source_loop: 5
          - type: item
            id: 4416
            name: "Patrick葬礼册与1919旧信封"
            source_loop: 4
          - type: item
            id: 4513
            name: "1925年内部接口接管记录"
            source_loop: 5
        output:
          type: derived_conclusion
          id: 4705
          name: "1919-A与Donnelly法律资金接口及1925接管连续性"
        proof_boundary: |
          坐实 Mickey 先实际控制 Donnelly 法律资金接口，后在 1925 年接管
          W / Whale 职责。不能仅靠年份相同完成推理；账户关系由授权附页承担。
          证明实际控制，不证明账户法律所有权。

      - id: 4502
        name: "功业簿作者与行动视角"
        inputs:
          - type: item
            id: 4515
            name: "Mickey功业簿"
            source_loop: 5
          - type: item
            id: 4514
            name: "1919年的银行授权附页-Donnelly & Associates"
            source_loop: 5
          - type: item
            id: 4511
            name: "Mickey定制钢笔"
            source_loop: 5
        outputs:
          - type: derived_conclusion
            id: 4706
            name: "Morrison页结论"
            derivation: |
              功业簿书写者知道“会面失控、现场按自杀口径收尾、惯用手偏差、
              清场由上层另线完成”，属于枪杀与现场伪装参与者视角。
          - type: derived_conclusion
            id: 4707
            name: "书写者一致性"
            derivation: |
              功业簿与 4514 上正式归属于 Mickey 的签名笔迹一致；
              关键转折处还出现 4511 缺口笔尖造成的稳定断墨。
        proof_boundary: |
          证明功业簿由 Mickey 长期书写，并掌握 Morrison 会面、死亡与
          自杀现场收尾的参与者内部事实。不得把煤气线归给 Mickey，
          不得把他写成 Miller 最终命令源。

      - id: 4503
        name: "Morrison近期访客"
        inputs:
          - type: testimony
            id: 4153001
            name: "Morrison最后通话记录"
            source_loop: 3
            role: "把近期访客窗口锁在 22:43 Donnelly 来电之后"
          - type: item
            id: 4315
            name: "古巴雪茄烟蒂"
            source_loop: 3
            role: "现场访客遗留物"
          - type: item
            id: 4512
            name: "Mickey的半支古巴雪茄"
            source_loop: 5
            role: "有可靠私人物件来源的对照样本"
        output:
          type: derived_conclusion
          id: 4708
          name: "Mickey是Donnelly来电后的近期访客"
        cross_proof:
          telephone_window: |
            4153001 只证明 22:43 电话打入 Donnelly & Associates 并留下
            立刻到场口信，不证明谁接听；它负责限定到访时间窗口。
          ownership_source: |
            4512 来自 Mickey 私人办公室、刻有 M.F.D. 的私人烟灰缸，
            且 Zack 曾亲眼见 Mickey 使用同品牌、在同一侧含咬。
          physical_comparison:
            required_matches:
              - "品牌一致"
              - "直径一致"
              - "含咬位置一致"
              - "前段向内塌陷"
              - "后段缺少一枚完整压痕"
              - "整体约三十度斜向受力"
            disallowed_shortcut: "不得只凭右下牙旧伤或单项齿痕相似锁定身份"
        proof_boundary: |
          电话窗口、所有权来源和多项复合特征共同证明 Mickey 是 Harold
          死前近期访客。该链不把齿痕当作指纹式唯一鉴定；不单独证明开枪，
          也不单独证明 Whale 身份。

    completion_condition: "all_chains_completed"
    completion_outputs: [4705, 4706, 4707, 4708]
    unlocks: "expose"
    expose_material_coverage:
