# ============================================================
# loop5_state.yaml — Unit4 Loop 5：四十二层（指证 Mickey · 3 轮）
# ============================================================
#
# Canon:
#   planningDirectory: 剧情设计/Unit4
#   active_outline: 剧情设计/Unit4/Unit4_大纲0723_逻辑重构版_v3.md
#   design_contract: 剧情设计/Unit4/讨论结论.md
#   episode: EPI04
#   id_space: 4xxx
#   structure: 5_loops_plus_non_loop_finale
#
# 叙事功能：
#   玩家先用三条独立证明链坐实 Mickey = Whale，再进入只处理事实防线的
#   三轮 Expose。身份承认后的价值对话固定线性，不再增加事实谜题。
#   Mickey 坠落后，非 Loop 终幕写入 ending_sequence，并硬截在 O'Hara
#   家门外。
#
# 核心揭示：
#   1. Mickey 先控制 Donnelly 法律资金接口，1925 年后接管 W / Whale。
#   2. Mickey 是 Harold Morrison 死前访客，并对枪杀与自杀现场伪装负责。
#   3. Miller 上层另线清场；Harrison 也由 Miller 上层决定、Pierce 执行。
#   4. Mickey 做过的真实好事不能替被牺牲者签署同意。
#
# 自检（A-G）：
#   A. 结构完整性  PASS — player_context / opening / scenes / expose /
#                           special_mechanics / evidence_registry /
#                           ending_sequence 齐全；本轮获批不写普通 doubts
#   B. 证据覆盖    PASS — L5 4511-4519、4705-4708 均有取得、流转与用途；
#                           跨 Loop 输入 4112、4153001、4315、4416、4418 已登记
#   C. NPC 完整性  PASS — 夜班门房、Mickey、Emma、Watts、街区居民均含
#                           known_information / player_inquiry / testimony_ids
#   D. 目标对齐    PASS — 玩家在 Mickey 承认前亲手证明 Mickey = Whale
#   E. 信息节奏    PASS — 身份承认前只出现 W / Whale；不揭 Sean 完整执行链、
#                           小 Charles 越权、U5 嫁祸或 O'Hara 屋内结果
#   F. 特殊结构    PASS — identity_lock.status=provisional；三链全完成才解锁
#                           Expose；ending_sequence 不计为新 Loop
#   G. Expose 逻辑 PASS — R1 实际控制、R2 到访、R3 身份三种不同维度；
#                           全部材料均可反查 identity_lock 链
#
# validation_status: PASS
# ============================================================

