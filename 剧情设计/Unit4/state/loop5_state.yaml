scenes:
- id: 4041
  name: 四十二层外厅 / 抵达
  type: cutscene
  design_tags:
  - opening
  - transition
  description: 只承载Donnelly & Associates地址、空置外厅与楼梯动线的建立镜头；结束后自动进入4042，过程中不恢复玩家控制。
  evidence: []
  npcs: {}
- id: 4042
  name: Mickey 私人办公室
  type: free_exploration
  design_tags:
  - identity_lock
  - expose_location
  - story_climax
  description: '四十二层唯一缺少社区感的高处空间。书桌、刻有 M.F.D. 的私人烟灰缸、

    市政厅专线和字母锁保险柜都井然有序。Mickey 返回前，Zack 可以检查书桌，

    取得钢笔与半支雪茄，并用 Patrick 遗物匣刻句打开保险柜。

    玩家必须完成三条身份锁证明链，Mickey 才返回并进入正式 Expose。

    '
  access:
    from_scene: 4041
    door_state: 临时未锁
    prohibited_interactions:
    - 破门
    - 撬锁
    - 潜入判定
    - 门禁谜题
  interactions:
  - id: interaction_mickey_desk
    name: 检查 Mickey 的书桌
    outputs:
    - 4511
    - 4512
  - id: interaction_letter_safe
    name: 输入字母锁密码
    input_source: 4418
    input_logic: FOR THE MANY WE PAY THE FEW 的七词首字母
    accepted_input: FTMWPTF
    outputs:
    - 4513
    - 4514
    - 4515
    - 4516
    atomic_outputs: true
    runtime_requirement: 密码正确后一次性交付4513—4516；不得让身份锁在4516尚未进入持有状态时完成
    design_boundary: '这不是 Mickey 留给 Zack 的邀请或普通谜语，而是 Mickey 长期使用的私人信条。

      玩家亲手输入这句话，才能看见它实际保护的文件。

      '
  evidence:
  - id: 4511
    name: Mickey定制钢笔
    type: item
    pickup: true
    source: Mickey 私人书桌
    description: '笔帽刻有 M.F.D.；笔尖右侧有长期缺口，在特定转折处留下稳定断墨。

      只能辅助确认同一书写工具与作者，不能单独证明文字内容真实。

      '
    uses:
    - identity_lock.chain_4502
  - id: 4512
    name: Mickey的半支古巴雪茄
    type: item
    pickup: true
    source: 刻有 M.F.D. 的私人烟灰缸
    ownership_basis:
    - 烟蒂位于 Mickey 私人办公室、刻有 M.F.D. 的私人烟灰缸内
    - Zack 曾亲眼见 Mickey 使用同品牌雪茄，并在同一侧含咬
    description: '半支古巴雪茄。与 L3 现场烟蒂比较时，必须同时核对品牌、直径、

      含咬位置，以及“前段向内塌陷、后段缺少一枚完整压痕、整体约三十度

      斜向受力”的复合齿痕。任一单项相似都不足以锁定所有者。

      '
    forensic_boundary: '这是电话到访窗口、可靠物件所有权与多项复合特征的交叉证明，

      不是把齿痕当作指纹式唯一鉴定；也不能单独证明开枪或 Whale 身份。

      '
    uses:
    - identity_lock.chain_4503
    - expose.round_2
  - id: 4513
    name: 1925年内部接口接管记录
    type: item
    pickup: true
    source: 字母锁保险柜
    pre_acknowledgment_display: 'Donnelly & Associates 自 1919 年起承担 Tidewater 的合同、产权、

      银行重组与诉讼拖延。1925 年接管页只写内部代号 W，

      代号说明栏写 W / Whale；不出现实名对照。

      '
    description: '职责栏为“警务协调 / 银月会联络 / 非合同障碍处理”。

      它证明法律壳经营在前、W / Whale 接管在后，不能把 Mickey 写成

      从 1903 年起就是 Whale。

      '
    uses:
    - identity_lock.chain_4501
    - expose.round_3
  - id: 4514
    name: 1919 年的银行授权附页-Donnelly & Associates（手写签名）
    type: item
    pickup: true
    source: 字母锁保险柜
    description: '1919-A 被记为 Donnelly & Associates 受托结算子账户；

      唯一授权签字人为 Michael F. Donnelly，账户用途栏引用 Harrison

      存根上的圣心医院赔偿案号。

      '
    proof_boundary: '证明 Mickey 是唯一授权签字人并实际控制资金操作；

      不等于账户法律所有人，不得写成“1919-A 是 Mickey 的私人账户”。

      '
    uses:
    - identity_lock.chain_4501
    - identity_lock.chain_4502
    - expose.round_1
  - id: 4515
    name: 手写功业簿
    type: item
    pickup: true
    source: 字母锁保险柜
    pre_acknowledgment_display: '同一名书写者长期记录的内部行动簿。作者身份尚未由系统确认；

      页面使用 W / Whale 接口语言，不提前显示实名对照。

      '
    entries:
    - O'Brien：退出；罢工网络保留
    - Webb：双重材料失控；接口收束；银月会关系维持
    - Moore：银行执行层可让步；Frank 线可暴露；Lakeshore 不进入法庭记录
    - Harrison：Miller 上层独立清理；Pierce 接管现场与档案；圣心医院执行层可让出；不得继续向上追查
    - Morrison：会面失控；现场按自杀口径收尾；惯用手留有偏差；清场由上层另线完成
    - Rosa：免于定罪；医院项目终止
    - Mary：脱离死刑风险；Brennan 完成越线测试
    proof_boundary: 'Morrison 页提供会面、枪杀与现场处理参与者视角，并把枪杀与

      上层另线清场分开。它不把 Mickey 写成 Miller 最终命令源，

      也不把煤气安装责任归给 Mickey。

      '
    uses:
    - identity_lock.chain_4502
    - expose.round_3
  - id: 4516
    name: Miller保险外卷与内封套
    type: container
    pickup: true
    source: 字母锁保险柜
    loop5_state: 外卷可查看；内封套保持未拆
    pre_acknowledgment_display: '外卷只显示 W / Whale 负责法律障碍、Pierce 警察网络与银月会协调。

      身份承认前禁止出现实名对照。

      '
    outer_volume_visible_information:
    - O'Hara 是南区第一批核心拒售户，标注优先处理
    - 湖滨信托银行 / Moore 制造债务与违约
    - Lakeshore 负责资金、估价和项目审批
    - Tidewater / Lawson 团队接收房产并推进工程
    - W / Whale 负责法律障碍及 Pierce 警察网络、银月会协调
    - 项目收益摘要只含预期地价、开发资格与 Miller 项目委员会最终审批权
    inner_envelope_visible_information:
    - 防拆线与 Miller 事故基金压印
    - 目录：1912 / 特殊处置与事故材料
    - 目录：1928 / 后插入执行附件
    prohibited_in_loop5:
    - 拆开内封套
    - 读取 Sean 页
    - 读取水源维护页
    - 把内封内容用于身份锁或 Expose
    next_flow: ending_sequence.ending_4044
  character_states:
    mickey_after_forced_return:
      npc_id: 403
      name: Mickey Donnelly
      is_liar: true
      motive: '先把授权、到访与行动簿重新拆回互不相干的客户账务、代管记录和

        共同进场后的所见；身份坐实后，仍试图用真实救援成果证明自己有权继续

        独占判断与代价分配。

        '
      mindset: '返回时先恢复律师式控制；事实防线逐轮收缩。身份承认后不彻底忏悔，

        也不否定自己的真实帮助。Miller 给出生路时，他第一次允许档案脱离

        自己控制，但这个选择不能抵消此前死亡。

        '
      known_information:
      - 自己是 1919-A 唯一授权签字人并实际控制资金操作
      - 自己于 1925 年接管 W / Whale 接口
      - 自己长期书写功业簿
      - 自己在 22:58 到达 Harold 宅邸，23:16 开枪并伪装自杀现场
      - 煤气清场由 Miller 上层另线安排，自己不知道装置形式与启动时间
      - Harrison 由 Miller 上层决定清理，Pierce 执行并接管现场与档案
      - Rosa 获救、医院项目终止等真实成果
      - Miller 会要求交回档案并提供车辆撤离
      withheld_information:
      - R1 前否认自己能决定 1919-A 的资金用途
      - R2 前否认在 Zack 与 Emma 抵达前、Harold 仍活着时到过宅邸
      - R3 前把 Whale 说成匿名客户
      - 身份承认前不主动说“我是 Whale”
      - 不主动拆解 Sean 完整执行链、小 Charles 越权或 U5 嫁祸
      player_inquiry: null
      testimony_ids:
      - id: 4035001
        content: Donnelly只替客户处理账务；1919-A不是Mickey的账户，他也不能决定资金用途。
        kind: collectible_lie_anchor
        speaker: 403
        source_anchor: active outline / Loop5 / 指证 Mickey / R1
        acquisition_talk: L5_event_mickey_returns
      expose_lie_ids:
      - 4035002
      - 4035003
  event_triggers:
  - id: mickey_returns
    condition: special_mechanics.identity_lock.completion_condition 达成
    talk: L5_event_mickey_returns
    forced: true
    locks_player_control: true
    runtime_binding:
      adapter: identity_lock
      callback: on_all_chains_completed
    required_beats:
    - Mickey返回办公室，先看见被打开的保险柜，再看见Zack手中的接管记录、银行授权附页和功业簿。
    - Mickey不承认这是自己安排的会面，也不承认Zack有权进入办公室。
    - Mickey主动声称Donnelly只替客户处理账务、1919-A不是自己的账户且自己不能决定资金用途，取得4035001。
    grants_testimony:
    - 4035001
    runtime_exit:
      continuation: next_talk
      next_talk: L5_expose_mickey
special_mechanics:
  identity_lock:
    status: approved_provisional_ui
    replaces_standard_doubts: true
    design_contract: 暂采用方案 B；玩法规则与门控已锁定，视觉布局和动效仍有讨论空间
    interaction_contract:
      lanes: parallel
      slots: fixed_per_chain
      chain_open_order: simultaneous
      submission: player_confirm
      wrong_submission:
        consumes_evidence: false
        resets_completed_chains: false
        first_feedback: logic_dimension_only
        repeated_feedback: missing_dimension_only
        reveal_correct_id: false
    gate_contract:
      standard_doubt_progress_required: false
      completion_condition: all_chains_completed
      unlocks: expose
    entry_condition:
    - 已通过字母锁保险柜的一次原子交互取得 4513、4514、4515、4516
    - 仍持有所有跨 Loop 输入材料
    chains:
