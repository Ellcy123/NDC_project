          - "读取水源维护页"
          - "把内封内容用于身份锁或 Expose"
        next_flow: "ending_sequence.ending_4044"

    npcs:
      L5_scene4042_mickey:
        npc_id: 403
        name: "Mickey Donnelly"
        talk: L5_scene4042_mickey
        is_liar: true
        motive: |
          先把授权、到访与行动簿重新拆回互不相干的客户账务、代管记录和
          现场传闻；身份坐实后，仍试图用真实救援成果证明自己有权继续
          独占判断与代价分配。
        mindset: |
          返回时先恢复律师式控制；事实防线逐轮收缩。身份承认后不彻底忏悔，
          也不否定自己的真实帮助。Miller 给出生路时，他第一次允许档案脱离
          自己控制，但这个选择不能抵消此前死亡。
        known_information:
          - "自己是 1919-A 唯一授权签字人并实际控制资金操作"
          - "自己于 1925 年接管 W / Whale 接口"
          - "自己长期书写功业簿"
          - "自己在 22:58 到达 Harold 宅邸，23:16 开枪并伪装自杀现场"
          - "煤气清场由 Miller 上层另线安排，自己不知道装置形式与启动时间"
          - "Harrison 由 Miller 上层决定清理，Pierce 执行并接管现场与档案"
          - "Rosa 获救、医院项目终止等真实成果"
          - "Miller 会要求交回档案并提供车辆撤离"
        withheld_information:
          - "R1 前否认自己能决定 1919-A 的资金用途"
          - "R2 前否认爆炸前进入过 Harold 家"
          - "R3 前把 Whale 说成匿名客户"
          - "身份承认前不主动说“我是 Whale”"
          - "不主动拆解 Sean 完整执行链、小 Charles 越权或 U5 嫁祸"
        player_inquiry: null
        testimony_ids:
          - 4035001
          - 4035002
          - 4035003

    event_triggers:
      - id: mickey_returns
        condition: "special_mechanics.identity_lock.completion_condition 达成"
        effect: "Mickey 返回办公室；封闭自由探索并进入 Expose"
      - id: emma_changes_course
        condition: "Zack 长时间未回电话，且四十二层楼下突然增加 Miller 车辆与人员"
        effect: |
          Emma 自主改变“你自己去”的决定，完成现实路程后赶往四十二层。
          她不参与身份锁与三轮 Expose，只在坠落时抵达并抓住 Zack。
      - id: archive_stays
        condition: "Mickey 拒绝 Miller 的交档案上车条件"
        effect: "4516 留在办公室，坠落后由 Zack 与 Emma 带走"

