- key: english_book
  id: 1504
  name: 美国工人英语练习书
  content: 厨房远离火源置物架；正式收集物；J/T对照在击破后，不提前定伪造者。
  status: existing_id_design_revision
  source_anchor: 剧情设计/Unit1/Unit1_逐Loop场景人物证物与指证核对定稿.md
  acquisition_loop: 5
  origin:
    table: D:\NDC\Assets\table\ItemStaticData.json
    name:
    - 美国工人英语练习书
    - English Practice Book
    content:
    - '一本《美国工人英语练习系列》。

      扉页写着 James O''Sullivan，1927 年 10 月。

      右页是第一课：英文字母。

      下面的练习句写着：我叫 James O''Sullivan。我来自爱尔兰。我住在纽约。

      我在工厂工作。我想学英语。美国是个好国家。


      那些反复练习的字母不像偶然笔误，更像一个人努力融入这座城市时留下的痕迹。'
    - 'A copy of The American Worker’s English Series.

      The flyleaf says “James O''Sullivan, Oct. 1927.”

      The right-hand page is Lesson One: the alphabet.

      The practice sentences read: My name is James O''Sullivan. I am from Ireland. I live in New York.

      I work in a factory. I want to learn English. America is a good country.


      The repeated letters feel less like a random mistake than the marks of someone trying to fit into this city.'
