    name:
    - Arthur Webb 委托协议书
    - Webb's Executor Agreement
    content:
    - '黑色信封里放着 Arthur Webb 签署的遗嘱执行协议。

      纸上写明：Zack Brennan 被指定为遗嘱执行人，

      负责确保 Vivian Gray 完整继承 Arthur Webb 的遗产。

      日期是 1928 年 10 月 31 日，右下角有 Arthur Webb 的签名。


      这不是普通委托，而是 Arthur Webb 提前系在 Zack Brennan 手上的责任。'
    - 'A signed estate executor agreement from Arthur Webb.

      It names Zack Brennan as executor and directs him to ensure Vivian Gray receives Webb''s full estate.

      Dated October 31, 1928, it bears Webb''s signature.


      This is more than a routine contract. Webb left Zack a responsibility.'
