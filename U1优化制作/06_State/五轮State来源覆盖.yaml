- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 1. 证物与证词：先分别取得，不提前讲成完整答案
    line: 290
  text: '以下工作名用于讨论，不分配正式 ID。Vivian 指证所需收据、申请与枪械材料详见本节第 4 小节；下表为 Rita 寻物与电话推理材料。用户已确定纸条、Emma 带回的 Rita 调查信息和私搜处境；保管证词由
    Vivian 概括说明一般存放位置；静态驻场与指证开场正反打结构已确认，具体对白尚待生成，只写在本方案，未写入台本或配置。


    | 材料 | 取得节点与具体内容 | 单独能说明什么／不能说明什么 |

    |---|---|---|

    | 保险柜密码纸条 | L4自由探索，在Webb办公室抽屉里取得；剧情上Rita翻过该抽屉，玩家本轮可直接点击办公室抽屉，查看并取得纸条。交互与配置设计均归在办公室抽屉下，不另设“翻出的文件”入口；不等待争执、Rita离场或Emma交谈。纸条原文为“保险柜的密码是我们相遇的那一天。——W”，取得后不向
    Vivian 询问纸条，不设置相关取证问答 | 玩家掌握打开保险柜的线索；纸条不直接写里面是什么，也不证明 Rita 的身份。玩家在与 Whale 通话时自行联系纸条、保管习惯与 Rita 私搜行为，推理其筹码用途；实际密码只有
    Vivian 知道，L5 结尾由她开柜；不要求玩家查出日期或输入密码 |

    | Emma 带回的 Rita 相关调查信息（本轮确认） | L4由Emma在外向在场者搜集，在L4的Webb办公室与固定驻场的Emma可选低声交谈取得；Rita仍在清点，不当着她公开全部怀疑，不收录证词。沿用正式台本的具体观察：她点酒却不喝，盯着通向会客室的走廊，Webb
    见完主顾后又去找那些人打听；这些见闻引出她可能替 Whale 盯梢的怀疑 | 是有见闻基础的怀疑，不代表 Emma 亲眼见过雇佣交易或能担保她的全部身份 |

    | Webb 与 Whale 的勒索关系 | 回用此前勒索调查所得；“Whale—Danger”日记保留在 L3 会客室原位置，降为可查看的环境证物，不收入证据栏、不用于指证或电话出示，只补充 Webb 对此人的警惕
    | 提供 Whale 有动机收回把柄的背景；日记原文没有写保险柜位置或完整录音内容，不扩写成万能目录 |

    | Webb 的材料保管习惯（证词） | L3 自由探索，与 Vivian 交谈并收录证词：Webb 通常把重要私人材料放在自己办公室的保险柜里 | 提供一般保管位置，供电话中与 Rita 的私搜行为交叉判断；不直接确认某份特定材料当前仍在柜内。小酒保不承担这一信息
    |

    | Rita 私搜办公室的现场见闻 | L4自由探索中进入办公室可见固定私搜处境，点击后介入争执；可在调查记录中回看玩家实际看到的行为，不补录未发生的交谈 | 补出她在正式交接之外寻找私人物件的行动；尚不能单独证明雇主是谁或柜内一定存在某件物品
    |


    Emma 带回的 Rita 调查信息与 Vivian 提供的保管习惯，分别说明人物关系和一般藏处；由玩家在电话中把它们与私搜行为联系起来。


    纸条在 L4 自由探索取得，明确写明保险柜密码的提示。无需向 Vivian 询问纸条，由玩家在 Whale 电话节点自行推理其用途；不提前宣称已经知道实际数字密码。'
