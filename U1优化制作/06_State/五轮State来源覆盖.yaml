user_overrides:
- id: UO_L2_CONTINUOUS_CABINET_20260918
  instruction: 首次Emma套话直接续接搬柜及相机、发现照片演出；不再点击柜子触发；结束恢复探索，由玩家点击取得照片。现有对白文档不修改，旧触发备注在接入时按本合同覆盖。
- id: UO_17_DOUBTS
  instruction: 采用本轮批准的17疑点方案；指定疑点两项显示、第三项谎言隐藏，三项全AND；具体condition以lead批准表为准，本包不重设计
- id: UO_L4_STATIC
  instruction: L4静态探索，办公室/歌舞厅任意访问；Rita/Emma驻办公室；劝售移指证开场
- id: UO_OPTIONAL_ENGLISH
  instruction: 英语练习书可选；未取得则省掉凭书认定James胁迫的J/T段，不补发、不加门槛，原结尾继续
  overrides_source: 案件方案及情节线中未区分持书状态的固定J/T描述
- id: UO_HOSPITAL_TOMMY
  instruction: L5医院由Tommy到病房邀请回店；不恢复Vivian来电
- id: UO_COMPLETE_STATES
  instruction: 完整五份state；覆盖开篇、普通问话、搜证、指证、分支和结尾
opening_control_flows:
- loop: 1
  locked_sequence:
  - 酒吧大门口：受阻，Emma进场
  - 大厅：合作争执，小酒保在场
  - Webb会客室：发现命案，Rosa指认，Morrison进入
  release: 命案段结束后会客室探索
- loop: 2
  locked_sequence:
  - 街角：Emma不满借身份，双方分头
  release: 开放本轮调查；大厅首入遣散借款事件只局部锁定
- loop: 3
  locked_sequence:
  - 一楼走廊：Morrison告知放人，邀到大厅
  release: 自由探索；大厅首入求职事件不替代勘验问话
- loop: 4
  locked_sequence:
  - 大厅：Zack分享，Emma解释保密并分工
  release: 大厅探索底图接一次调酒及认罪消息事件；随后静态自由探索，无先见Vivian条件
- loop: 5
  locked_sequence:
  - 歌舞厅：小酒保通知
  - Webb办公室：Whale电话四步判断
  - 同一办公室：正式结伴与称呼变化
  release: 自由调查Tommy办公室、厨房、小包厢；Webb办公室仍无自由搜证入口
narrative_handoffs:
- loop: 1
  requirements:
  - 只推翻持枪等于射击，保留23:30疑问
  - 委托交涉争取调查；身份借用造成Emma不满
- loop: 2
  requirements:
  - James欠条由Zack取得，Emma未亲历
  - Tommy三轮揭勒索；不揭杀人准备或家庭交易
  - James行踪与酒保职责依批准疑点保证本轮收录
- loop: 3
  requirements:
  - 医疗单→医院夫妻问路→病房吊坠→回清洁间开箱→Emma同行
  - Rosa两轮后保密、交弹壳；保密不是取证条件
  - 仅确认死亡枪击早于23:20；James身份未知
- loop: 4
  requirements:
  - 静态自由探索，搜证不等待争执或Rita离场
  - 纸条、23:18目击、故障枪本轮必取；Emma见闻可选
  - 点击指证后先Rita劝售正反打，再三轮；指证后才交隔门喊话
  - 交代→大厅Morrison转折→歌舞厅强押连续锁定；漏谈Emma仍汇合
- loop: 5
  requirements:
  - 选人前材料齐备；三线任意顺序
  - Tommy错误分支一次击破→坦白→黑屏→恢复选人前状态
  - James三轮→还原→争辩；有英语书才凭书作J/T指认，无书省该指认仍继续逃跑
  - 厨房追赶→后巷Anna受控与James自杀→医院走廊→病房连续锁定
  - 欠条还Anna不收回；Tommy来病房告知Vivian获释并邀返店后离场
  - 大厅Morrison送枪/赌债→可选泼水状态回收→Vivian下楼留员工
  - 办公室先有限照护与Tommy余波，再开柜照片/唱片；Whale真实身份不揭
