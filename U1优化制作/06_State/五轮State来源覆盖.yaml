    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: L4 节目修改申请：票面内容与阅读推理（已确认）
    line: 342
  text: '| 栏目 | 申请单上的内容 |

    |---|---|

    | 原曲目 | 《Moonlight Bay》 |

    | 申请替换曲目 | 《艾斯弗德狂想曲》 |

    | 演奏要求 | 使用完整版，保留全部鼓段 |

    | 鼓点音量 | 5 |

    | 申请人 | Vivian Gray 的签名 |

    | 处理记录 | 已转交乐队，按申请调整 |

    | 经手签名 | Tommy Connelly |

    | 提交日期 | 案发前的日期，不写演出起止时间 |


    申请单在 Tommy 办公室普通演出文件夹中搜得并收集。解读分两层：玩家对照歌舞厅“演出曲目与音量参考表”，理解完整鼓段与音量 5 的作用；“已转交乐队，按申请调整”及 Tommy 的完整签名，直接反驳 Vivian
    所说的“曲子是我自己找乐队换的，没有经过 Tommy”。这只能证明 Tommy 经手演出，不能证明他知道杀人计划，保留她退守“他只是安排演出”的空间。


    申请单及其物品说明不写“掩盖枪声”或解释杀人用途，不重复音量释义；不使用曲目暗码、签名缩写或另加笔迹辨认谜题。查参考表属于玩家阅读推理，不新增分析、合成或派生证物。L4 不交付当晚实际演出时段，23:00—23:10
    由 L5 完整节目单核实。


    取得场景、物件字段与收录方式统一见核对稿。小手枪与致命弹壳沿前轮回用；新收据、申请在L4出示前取得；实际节目单到L5才提供时段。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 疑点与指证材料对应
    line: 361
  text: '| 疑点工作题 | 触发材料 | 指证用途 |

    |---|---|---|

    | Vivian 手中的枪是谁买的？ | 小手枪、Webb办公室的磨损的购枪收据 | 两项均为第一轮指证用；小手枪沿用已有疑点／碎片归属，新收据须在 L4 指证前归属 |

    | 当晚的换曲安排是否经过 Tommy？ | 节目修改申请；回用L2小酒保演出职责证词作交叉材料。Vivian的否认在指证内说出，不作入场前条件 | 修改申请为第二轮指证用；小酒保证词只用于引出疑问与疑点交叉，不是出示材料，不能单独证明这次经手
    |

    | Vivian 所说的射击发生过吗？ | 小手枪检查结果、致命一枪的 .45 弹壳口径材料 | 两项为第三轮指证用，已归属材料直接回用；不得将当前需要的口径材料只挂在原 L6 的后续疑点下 |


    以上明确取证与指证职责，正式 ID 与配置在制作时落实。保险柜密码纸条继续在 L4 自由探索取得，只服务后续电话的开柜筹码，不属于这三轮的指证材料。


    Rita身份的揭示顺序：L4自由探索中由Zack积累办公室私搜见闻；Emma固定驻场，可选低声交付调查见闻，不收录证词。L5开篇小酒保进入歌舞厅来喊接神秘电话；Webb办公室的Whale电话中，玩家综合已取得材料推断并核实联系。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 4. 电话谈判：四步选择，把怀疑变成可用的筹码
    line: 373
  text: 'Emma的Rita调查信息仅通过剧情对话呈现，供玩家阅读后在Whale电话中自行联系推理。Emma不是这些事件的证人，不生成证词、不收录Caseboard、不制作证词卡，也不作为疑点触发或指证出示材料；保留调查所得的观察事实与来源区分，不直接确认Rita的身份。


    电话材料取得要求已确认：保险柜密码纸条是Zack声称知道如何取得勒索材料的实际筹码，必须在L4自由探索取得后再结束本轮、进入L5电话；不允许漏取后仅靠穷举完成该筹码谈判，也不自动补发。Emma的Rita调查信息仍可漏听，不收录证词；其他可选信息漏问、漏看不锁掉电话正确选项，不替玩家总结未读内容。纸条不作为Vivian三轮指证的出示材料；Emma参与结尾交涉不以听完其调查信息为条件。


    L5 Webb办公室：自由探索期间沿用原配置锁定入口，不开放房间或安排补取密码纸条；纸条已在L4必取。结尾由Vivian带领开柜时再开放对应剧情，柜内内容仍到此时揭晓。


    L4以Morrison在歌舞厅带走Vivian收束。L5开篇由小酒保进入歌舞厅通知神秘来电，两人到Webb办公室接听；通话使用专用电话UI，挂断后在办公室同场正式结伴，开篇结束才开放自由调查。办公室不因此成为本轮自由搜证地点。Whale原本要求Zack、Emma停止调查、离开；Zack接听后才结合Emma带回的调查见闻，以及自己L1—L4的调查见闻，由玩家在谈话中组织判断与筹码，尝试说服Whale允许最后一次凶手调查。沿既有谈判目标争取查明真凶及证据后释放Vivian；Whale不在开头主动布置查凶任务。两人不主动拨号，也不在拦下Emma时预先声称已经安排好这通电话。


    Morrison 押走 Vivian 后，与 Whale 的电话成为推理收束节点。玩家已经取得纸条、相关证词，并见过办公室私搜处境。以下四步交互题面与交换条件已逐项确认，尚非正式对白；选项围绕 Zack 此刻如何回应对方展开，选择后才由他组织对应的判断，不先用旁白公布答案。


    | 推理节点 | 提供给玩家的选项 | 支持正确方向的材料与推进 |

    |---|---|---|

    | 一：Rita 收购酒吧之外，还想拿到什么？（已确认） | ① 酒吧的营业账目；② Webb 留下的勒索材料；③ Vivian 的私人财物 | ②。依据已查明的勒索业务，以及 Rita 略过营业账册、翻找私人文件并检查保险柜的行为，提出她想取得勒索材料的判断；本步尚非确证，后续结合
    Emma 带回的见闻推断委托者，再由 Whale 回应核实 |

    | 二：她在替谁寻找这些材料？（已确认） | ① 替自己接手 Webb 的勒索生意；② 替警方搜集案件证据；③ 替 Whale 找回被 Webb 掌握的把柄 | ③。依据 Emma 带回的长期盯梢见闻及由此产生的怀疑，以及已查明的
    Webb 勒索 Whale 的事实。玩家选对后，Zack 才提出判断；Whale 的回应确认他委托 Rita 办理收购，核实双方联系，不主动讲完寻物任务 |

    | 三：Webb 会把这些勒索材料藏在哪里？（已确认） | ① Tommy 的营业文件柜；② Webb 办公室的保险柜；③ 酒吧的营业账本中 | ②。依据 Vivian 的一般保管习惯与 Rita 私搜时检查保险柜的行为，判断保险柜为最可能藏处；尚未开柜，不宣称材料必然仍在内，也不提前透露唱片碎片
    |

    | 四：Zack 手里有什么，能让 Whale 愿意谈？（已确认） | ① Webb 留下的酒吧产权；② 已经听过的完整秘密；③ 打开保险柜的密码线索 | ③。关联出示纸条“保险柜的密码是我们相遇的那一天。——W”，表明掌握开启线索，不直接报出密码，也不宣称已取得材料。随后提出继续查出真凶、给警方交代以换取
    Vivian 自由，并以取得、交付 Whale 所需材料作为交换 |


    Whale 承认收购委托，是在回应 Zack 已提出的身份判断；它确认双方关系，不应在选项出现前替玩家先点名 Rita。先形成有根据的推断，再通过对话回应收窄其他解释，符合电话谈判的性质，不包装成每一步都有唯一物证定案的正式指证。


    选错时仍留在当前通话：只提示这项解释尚缺什么。例如，第一步提醒留意她没有按交接清单检查哪些东西；第二步提醒区分她自己的经营利益与谁急于取回把柄；第三步提示区分营业材料经手处和私人原件保管处；第四步提醒区分已经掌握的能力与尚未取得的内容。不直接点亮正确答案，不临时增加新证物，不因一次错选突然使
    Vivian 永久失救。


    选择完成后，Zack 的筹码是：知道 Rita 的寻物目的，有依据地定位材料，并掌握打开保险柜的线索。不是宣称已经拿到原件或听完录音。Whale 同意给他找到真凶即可释放 Vivian 的机会；纸条仍由玩家持有，材料也不在这通电话中交付。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 5. 证明范围与后轮边界
    line: 398
  text: '幕后真实位置按用户确认，为 Webb 办公室保险柜；所存重要物件仍是后续取得的唱片碎片。电话时柜未开，玩家是根据一般保管习惯和现场行动作出有依据的定位；保管证词不等于全程监控。后续取出原物再验证这一判断，不把尚未打开的柜子写成已经搜查完成。


    本轮电话只要求判断“Webb 勒索 Whale 的材料”与藏处，不要求玩家已经识别其为唱片碎片，更不要求先知道完整录音内容、Zack 母亲的名字或 U5 的解密结果。具体载体与录音内容在 L5 探望 Anna 后返回酒吧试听时揭晓。


    - L2 小酒保先说 Tommy 有安排演出；L4 取得申请，第二轮揭出 Tommy 经手，全部指证结束后才坦白只把计划告诉过 Tommy 及他的仇怨。L5 再用完整节目单的实际执行记录核实 23:00—23:10
    掩声时段；申请不重复领取，23:05 声音留后轮回认。

    - Rita 的任务与知识范围限于收购交接和寻找 Webb 的勒索材料。

    - L5 尾声先由 Zack、Emma 去医院探望 Anna，随后回酒吧查看 Webb 办公室的保险柜，取得现存碎片并试听、保留。U2 交给 Whale，U4 找回同一批，U5 寻另一半解密。

    - L5开篇电话承接救人谈判；L5 医院承接人物余波，酒吧试听揭晓录音内容。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 六、L5三线自由调查与选人判断
    line: 409
  text: '玩家分别调查隐瞒、身份与时间，综合材料后在 Tommy、James 之间选择实际射手。Tommy、James与演出三线均可自由调查；L5自由探索开始即可到歌舞厅小包间点击检查取得节目单，不设拿枪或人物问话前置。


    | 调查线 | 为什么查、在哪里查 | 材料与玩家的推理体验 |

    |---|---|---|

    | Tommy线 | Vivian 指出他知道计划、与 Webb 有旧怨。回用L4办公室搜得的枪及目击证词追问 | L4搜得的实枪及其物品详情，与他“Webb当面试枪后交枪”的说法相互对照。他承认经手、回避真实处置；家庭辩护呈现依赖，对
    Vivian 提到的旧怨则避而不答。玩家因此犹豫：他在隐瞒什么，是否就是杀人？ |

    | James线 | 核查工作人员行踪，在厨房听到与门内相同的喊话 | 两份“Do not be bothering me!”与工作时间线交叉，使普通送餐变成可疑行动机会。James 不主动递出时段谎言；玩家自行回认声音、核查身份
    |

    | 演出线 | L4已查到换曲申请，L5两人同队核查实际记录 | 玩家与Emma同队，在歌舞厅小包间检查找到完整节目单。玩家结合音量层级与 L3“致命枪击早于23:20”，推理23:00—23:10掩声窗口，再审视两人的行踪
    |'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 选人推理：从两种嫌疑到实际作案窗口
    line: 419
  text: '| 判断步骤 | 玩家已经取得的依据 | 能形成的判断 |

    |---|---|---|

    | Tommy为什么值得追问？ | 他知道Vivian的计划、与Webb有旧怨，23:18被目击离室，取走故障枪，却声称Webb当面试枪后交给他 | 玩家怀疑他编造存活互动、隐瞒现场。不要求这些材料构成完整杀人假说；选他属于把隐瞒误判为射手身份
    |

    | James为什么同样值得追查？ | L2已交代的23:00—23:10下楼送夜宵、23:10—24:00在厨房的行踪信息；厨房喊话与 Vivian 23:05隔门见闻对应 | 他有接近现场的行动机会，也与门内说话者有联系。此时不单凭工作表或一句表达定罪
    |

    | 节目单改变了什么？ | 当晚实际节目单、曲目音量层级、L3已查明的枪击早于23:20等时序及掩声条件 | 玩家自行确定23:00—23:10才是能掩盖致命枪声的窗口，按三分钟自述推算的约23:15—23:18已在窗口外；这只能检验他的自述，不能据离室目击排除更早开枪
    |

    | 为什么转而选择James？ | 将掩声窗口与 James 的实际工作行踪、23:05门内声音交叉 | James 的行动与现场身份形成正面联系，支持对他的杀人指控；不只是发现 Tommy 撒谎，或按谁的疑点更多选人
    |


    推理重点是玩家自己发现需要寻找掩声时间，再将它与人物行动联系；材料联通后，方向应当清楚，不为维持两人同样可疑而继续模糊答案。节目单单独只排除23:18隐蔽射击的解释，不能证明 Tommy 更早从未入室；最终选择 James
    仍依靠他的时间、声音与行动证据。行踪依据回用L2已确认的23:10—24:00厨房自述证词，不再追加行踪旁证。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 故障枪详情的两次用途与选人判断
    line: 429
  text: '故障枪详情口径（2026-09-17 用户澄清）：没有Tommy所述Webb当面试枪留下的痕迹，因此可以确认Tommy编造了当面试枪的互动；Webb当时可能已经死亡，但该物品信息本身不能把这一怀疑变成已证实事实，也不能确认Tommy就是射手。不能仅以“试枪失败后没有击发痕迹”作为矛盾，更不能把没有试枪痕迹简写成没有击发痕迹。取得后物品详情直接说明故障、未见试枪痕迹与故障后未击发，不再细化部位、机理或检查特写，不设置分析／检查操作、派生物品或详情已读前置。同一物品详情保留故障后未击发的结论，供James争枪走火说法回用；入室见尸仍由Tommy在错误分支中主动坦白。


    维修单及维修资料已取消，不在L3垃圾袋或L2—L5办公室取得，也不作为故障枪取得前置。L4直接从抽屉取得手枪，物品详情直接说明状态；L5回用同一物品。


    L4 Tommy不出场；Emma搜集Rita相关调查信息后带给Zack。L4小酒保在Tommy办公室内提供23:18看见Tommy离开会客室的证词。Zack拿这份证词询问Tommy时，他才声称当时Webb还活着，自己去取Webb要求维修的故障枪，自述在里面待了三分钟；继续追问时，编造Webb当面试枪后亲手交枪的解释。故障本身是实话；虚构的是与活着的Webb试枪、交枪的互动。这整段是掩盖见尸取枪的编造经过，不作为作者真相。L4取得实枪后，物品详情直接显示故障、未见试枪痕迹、故障后未击发，不设置主动分析／检查步骤。L5回用同一物品，听到Tommy试枪说法后才形成证言与物证的冲突。详情只讲物品事实，不解释Tommy的动机，也不提示将来用来反驳James；不另收录检查证词。


    取得故障枪与收集节目单相互独立，不捆绑成一次洗清嫌疑的发放。节目单在L5自由探索开始即可到小包厢点击检查取得；与拿枪、Tommy问话没有先后限制。玩家可发现试枪／交枪／存活解释有多处问题，但选择的是实际凶手，不逐句选择要击破的谎言。故障本身不能证明他说谎；本轮依据故障枪物品详情中未见试枪痕迹的说明，确认当面试枪说法不成立，完整方向与动机仍在错误分支坦白。


    最后James声称争枪走火时，只出示物品详情已说明状态的故障手枪，不再依赖维修资料；故障手枪须纳入指证前的疑点／碎片材料，不设额外检查完成条件。同一物品详情分别说明未见所述试枪痕迹、故障后没有击发过的迹象：前者反驳Tommy所述Webb当面试枪，后者反驳James所述争枪走火。

    **节目单独立取证：** 复用歌舞厅小包间，Emma随队而非驻场；L5自由探索开始即可点击检查取得节目单，无需先拿枪、检查枪械或完成Tommy问话。她只确认当晚实际曲目与时间，不解释掩声结论；节目单不放 Tommy
    抽屉、不由小酒保交付。


    **探索顺序：** 可以先查厨房、Tommy办公室，也可以先去小包厢检查取得节目单；三线不锁先后，厨房内部仍先喊话、后交谈。节目单仍是选人前必需材料，不是厨房调查的前置。


    小酒保只作信息位。暂不加送餐延迟或扣薪线索。James的行踪依据已在L2送餐普通对白与23:10—24:00厨房自述证词中提供，无须新增旁证；相同表达不单独定罪。L4已搜得手枪，取消为搜枪支开Tommy的配合事项。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 三线的共同目标与信息边界
    line: 446
  text: Tommy线核查隐瞒的责任，James线核查行动机会与门内身份，演出线提供实际时间条件。所有正确指控必需材料在自由探索取得，不能靠错误分支补证；节目单可先、中途或最后取得，不绑定人物问话或枪检。场景开放、驻场及必取前置见核对稿。
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 七、厨房调查、选人分支与正式对抗
    line: 450
  text: 本节保留James三轮指证，并以选人入口区分Tommy错误分支与James分支。James基本工作调查不受节目单限制，自由探索不主动提供“只有十分钟无人作证、其间无法隐蔽开枪”的谎言。搜齐材料后先在Tommy、James之间选择实际射手，再用证据支持指控；James的正式对抗仍在厨房，保留三轮，由Zack先提出作案窗口并询问，出示组合按已确认的James三轮表执行。
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
