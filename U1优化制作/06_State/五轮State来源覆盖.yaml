    heading: 九、跨章线索：唱片碎片与 Lawson 收件人伏笔
    line: 546
  text: 本节记录唱片碎片与 Lawson 收件人两条跨章线索，不修改其他章节大纲。玩家各章可见信息与作者层身份分开标明。
