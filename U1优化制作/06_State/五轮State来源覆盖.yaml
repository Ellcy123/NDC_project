    heading: 十、制作细化与边界
    line: 596
  text: '| 优先级 | 待定项 | 需要解决的问题 |

    |---|---|---|

    | 2 | L4 证物与自毁心理的落细 | 三轮已改为枪源、准备、虚假射击；落实收据磨损、付款人及与实枪一致的枪号、申请签名及经手记录的美术、弹壳材料的展示。旧物与 Rita 交接唤起自责，通过自毁动机衔接认罪 |

    | 8 | 电话推理候选落细 | 第五节已列五项材料与四组选项；实际密码由 Vivian 掌握，结尾由她开柜；保管习惯证词已确认在L3取得、L4检查保险柜时回想；后续核对事件站位及电话反馈。真实身份须经回应核实，一般保管习惯不当成柜内现物已确认；跨章仍保留概念
    |

    | 10 | 前段及美术衔接 | Rita 首次出场的欠薪及交接要求、James 拒绝的具体理由、借款与欠条的演出细节见增强情节线；Emma 留在小包厢；小酒保 L2 大厅首次接触、L5 厨房接触及案发夜的目击站位与记时依据、Anna
    身份口径；新时间和取枪支线对真相视频的影响 |

    | 11 | 小酒保分支与 Morrison 收尾 | 小酒保角色资产；厨房窗口、会客室与入口巷子的画面对应；三选一的跨场景与存读档保留、一次性结算、未选择时正常立绘；Morrison正常／淋湿两种状态及对应对白，共同赌债交代与开柜段落汇合
    |

    | 12 | L2 两账、花瓶与寄件签 | 同期同范围四千／八千收款口径；9 月 10—12 日工作日期与全章时序、缴款期限的统一；花瓶独特旧伤与照片可读性；烘烤显影及有效照片状态；Éléonore Vanderbilt
    的 U5 身份回收材料；油画七千对应十月，按已确认的两月账目制作 |


    23:00—23:10 的掩声时段、Tommy 取枪与最终争枪谎言，仍需逐镜核对现有真相视频的兼容情况。'
