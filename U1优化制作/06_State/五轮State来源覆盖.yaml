    heading: 选择James后才进入正式对抗
    line: 467
  text: L5沿用指证面板的开放时机，入口选择谁是凶手。选择Tommy进入仅一次击破的Tommy指证及错误结局；选择James进入厨房三轮指证，由Zack先提出作案窗口并询问James，再逐轮出现谎言、出示证物、推进退守。选人不替代第一轮，也不减少James的指证轮数。
