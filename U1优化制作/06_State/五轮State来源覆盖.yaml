    heading: 演出线与探索顺序
    line: 497
  text: L4申请说明准备，L5完整节目单核实实际曲目与起止时间。玩家在开放的小包厢自行取得，Emma随队只确认记录性质；玩家自行结合音量参考、L3时序及人员证词建立窗口。
