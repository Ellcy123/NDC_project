- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: L4枪源调查与事件衔接（广告卡触发，已确认）
    line: 310
  text: '| 入口／材料 | 玩家行为与信息推进 | 职责与边界 |

    |---|---|---|

    | 初见Vivian | 了解认罪及持枪到场等基本说法，她不愿多谈 | 不要求先问完全部问题才继续探索 |

    | 化妆间枪盒广告卡 | 查看与L1小手枪型号对应的广告卡，解锁向Vivian询问取得时间、途径的选项 | Zack为核查杀人准备而问，区分早已持有的防身枪与为本案准备的枪；不因此推定Webb赠枪 |

    | 枪源问话 | 玩家主动询问，Vivian强调枪是自己买的、与Webb无关，形成第一轮待核查说法 | 广告卡只引出问题，不提供反证；问话可早于Rita劝售，不因玩家已拿收据而省略她主动否认 |

    | Webb办公室争执 | Emma与Rita固定驻场，进入可见私搜与质疑处境；点击后介入，Emma追问私人抽屉，Rita以清点财产解释，谈完继续清点 | 不要求先见Vivian，不作自动进场事件；纸条与购枪收据可独立搜得，不等待争执完成
    |

    | Webb办公室磨损的购枪收据 | 玩家在被Rita翻出的旧文件中自行查看、收集，纸面有磨损，仅枪号与付款人Webb可辨，不显示枪型、日期或其他交易字段 | 玩家通过枪号与L1小手枪刻号对应，作为第一轮反证；不另拆分收据或增加修复解谜、不解锁枪源问话，不自动总结她在撒谎
    |

    | Rita／Vivian交涉（指证开场） | 点击指证后、第一轮出示前，Rita劝售并提Webb恋人身份，Vivian沉默；Vivian阻止遣散员工，Rita结束交谈后切Zack与Vivian | 与指证后普通交代同类的无背景正反打，不新增AVG整图、走位或离场动画，不新增自由探索前置，不发放赠枪答案
    |

    | 面板指证 | 完成本轮既定疑点／材料准备后，玩家点击面板进入指证，先接劝售正反打开场，再开始既定三轮 | 不要求回NPC处发起，也不把进入歌舞厅设成指证必经路径；第一轮出示小手枪与收据，后两轮沿既定流程 |


    广告卡原位、原文及环境证物属性保留，不收集、不作指证出示材料；新增的是查看后记录状态、开放普通问话。收据保持完整反证功能。先问再搜时，玩家发现反证；先搜再问时，玩家听出她隐瞒。两种顺序都成立，系统不因收据取得自动推送枪源选项或公布对应答案。


    玩家可先见Vivian，也可先搜办公室；两处驻场人物与搜证处境保持固定。广告卡／枪源问话／收据沿各自条件独立推进。准备好后点击面板进入指证，即播放劝售正反打开场，不要求先完成办公室争执或再次进入歌舞厅。


    行为的反常在于：她并未只按正常收购流程核对经营账目，还在未经正式交接时私自搜索私人保管处。但买家本来也可能检查资产，因此单凭翻抽屉、查看保险柜不足以断定任务。它必须与Emma带回的调查见闻、Whale的处境和电话反应交叉。'
