- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: L2 指证：核心体验与揭晓范围
    line: 38
  text: '所有必需物证在 L2 自由探索取得。指证不靠突然增加证据、藏卡或禁止合理答案控制顺序，而靠 Tommy 被击破后主动提供的新解释，改变玩家理解旧材料的角度。


    | 阶段 | 玩家原本看到什么 | 指证提供的新前提 | 玩家亲手发现什么 |

    |---|---|---|---|

    | 第一轮 | 两本同月收款记录 | 普通 Talk 已有“没有账外进项”的谎言 | Webb 收到的钱没有全部进入 Tommy 营业账 |

    | 第二轮 | 亲密照片背景里的花瓶、当前花瓶特征 | Tommy 认定当前这只是仿品，且只在交付真品后才摆上 | 所谓后来添的仿品，交付前已经出现 |

    | 第三轮 | 一张写着“花瓶”的作废寄件签，客户与收件人同姓、名字不同 | Tommy 承认签对应照片、付款决定销毁或寄出，Lawson 事先知道寄件安排；但谎称收件人是 Lawson 本人 | 私密照片原本要交给另一位同姓的人；付款阻止的是对第三人的披露
    |


    本轮确认 Webb 的照片勒索业务及 Tommy 的经手执行，不展开 Tommy 的移民受骗、对 Vivian 杀人计划的配合、藏枪或 James 的交易。


    收件人的亲属身份不是本轮解题前提。玩家能看出被威胁的照片不是退给本人，即可击破本轮解释；不需要知道对方究竟是妻子、母亲或其他人。Zack 与 Tommy 在 U1 将收件人误认为 Lawson 的妻子；这是人物误判，不是证物证实的事实，也不是提交条件。


    L2 Tommy 行踪询问：不收录“22:00 到 00:00 一直在办公室核账，没有离开过”的原证词。Zack 询问时，Tommy 含糊回避，不作整晚未离开的明确保证。L5 的 23:18 离室目击用于核查现场行动，不以反驳这条已删除证词为前提。


    Webb 办公室环境物：桌面旧血迹与艾斯弗德好市民奖保留为可查看环境证物；城市势力飞镖地图保留已有美术，改为不可点击背景装饰。


    L2 歌舞厅通道：通往大厅、通往小包厢的两扇门均保留原位置及通行功能，不新增解锁条件。


    L2 二楼走廊：通往 Tommy 办公室、Webb 办公室和一楼走廊的三处通道全部原样保留，不新增解锁条件；无驻场 NPC、证词或可搜证物。锁闭限制只针对 Tommy 办公室的抽屉，不限制房门。


    L2 一楼走廊：保留战利品墙安排，以及通往二楼走廊、大堂、Webb 会客室、地下走廊的四处入口；已核实：会客室入口 1203|1541、地下走廊入口 1230|1541 均为锁定入口，点击显示“暂未开启”，L2 不可通过；保留原限制即可。地下区域不承载本轮必需取证。


    L2 大厅通道：歌舞厅、一楼走廊入口原样保留；厨房走廊入口本轮锁定，点击显示“暂未开启”（拟参数 1218|1541）。L3 再开放厨房走廊；生日吊坠改在医院病房取得，厨房内部的开放另按该轮安排。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: L2 自由探索材料规格
    line: 64
  text: 'Tommy 枪声证词已确认：原“23:30 听到一声枪响，方向在厨房和会客室一带”改为“23:30，我听到了一声枪响。”L2 办公室询问取得并收录，只印证听到枪声的时间，不提供声音方向，不证明死亡时间。


    以下同步自《L2 Tommy 三轮指证方案：账目、花瓶与收件人伏笔》，为已确认方向的材料规格，不代表正式道具正文已经具备这些内容。9 月 10—12 日为当前工作日期，正式落表前须与全章时序复核。


    | 材料 | 本方案所需可见内容 | 取得与初次用途 |

    |---|---|---|

    | Tommy 营业账本 | 保留原九月收款 4,000 美元、十月收款 4,500 美元及营业明细 | Tommy 办公室，普通经营调查 |

    | Webb 收入记录 | 沿用原 Excel：九月基本收入 4,000＋花瓶 4,000＝8,000 美元；十月基本收入 4,500＋油画 7,000＝11,500 美元；原描述保留 | Webb 办公室，用于与营业账对照。交付栏是待核的记载，不当成真品实际交付的客观事实
    |

    | Lawson 亲密照片 | 正面为 Lawson 与 Vivian，背景有花瓶；背面不写人物姓名，保留拍摄日期 9 月 10 日，显影得到“花瓶／4,000 美元” | 延用小包厢的照片发现及显影方向；初次引导关注人物、金额，不替玩家解释背景的反驳用途
    |

    | 旧照片日期依据 | 原照另有 9 月 11 日冲印日期标记，确保照片在 12 日前已经存在 | 日期标记及来源须在材料呈现中可核对。冲印日只提供拍摄状态的最晚界限，不强称它就是拍摄日 |

    | 当前花瓶观察记录 | 瓶身有一处明显划痕；旧照片中同位置、同形状的划痕必须清晰可辨 | 小房间（小包厢）调查中取得，与旧照片的拍摄地点相同。搜证描述只记录外观，不提前宣布“真品交付后的替代品” |

    | 贵宾合影 | 完整姓名题注 Lawson Vanderbilt 与站位对应，供玩家与私密照片连接、确认人物身份 | 延用识别人名的功能；不增加妻子、父母合影或亲属关系题注 |

    | 作废寄件签 | 客户：Lawson Vanderbilt；物件名目：花瓶；收件人：Éléonore Vanderbilt 女士；处理标记：9 月 12 日，作废 | L2 Tommy 办公室可搜的旧业务档案中取得，不放入
    L4 才能打开的上锁抽屉；收件人写完整姓名并加“女士”以强调性别，不加夫人、太太、母亲等暗示婚姻或亲属关系的称谓；无照片字样、金额、收讫、威胁条件或职衔 |


    收件人姓名与误认已确认：Éléonore Vanderbilt（埃莉奥诺尔·范德比尔特）。寄件签印完整姓名及“女士”称谓，明确收件人为女性。U1 中 Zack、Tommy 将这位同姓女性误认为 Lawson 的妻子；这是人物的错误判断，不是证物确认的夫妻关系。U5
    揭晓她实际是 Lawson 的母亲、旅居美国的欧洲贵族。U1 不提前展示母亲身份或贵族背景，第三轮解题仍只需证明收件人不是 Lawson 本人。


    L2 身份疑点已确认：题面为“私密照片中的男人是谁？”。玩家在指证前的疑点收集环节连接小包厢私密照片与 Webb 办公室贵宾合影，确认两图中的同一男子是 Lawson Vanderbilt。贵宾合影为可收集的正式线索，完整姓名题注须与人物站位明确对应；私密照片背面不直接写
    Lawson 姓名，保留日期、冲印标记及隐写金额。该疑点纳入本轮指证前收集条件，只确认身份，不揭晓勒索性质或收件人亲属身份。贵宾合影是疑点触发材料，不是指证出示材料：第二轮仍出示私密照片＋当前花瓶观察记录，第三轮仍只出示作废寄件签。不额外增加一套指证前流程。


    寄件签是店内留存的原签，尚未执行的寄送安排后来被取消；不是 Lawson 寄回的照片、回信或通知，也不需要照片缺角、咖啡污迹等识别故事。仅凭“作废”不能自行推出付款原因。


    第一轮账目口径已确认：Webb 收入记录沿用原 Excel 内容，不删油画收入、不改原描述。九月 Tommy 营业账 $4,000 对 Webb $8,000，差额对应花瓶 $4,000；十月 Tommy 营业账 $4,500
    对 Webb $11,500，差额对应油画 $7,000。第一轮出示两本账核对两个月；后续第二、三轮集中深入花瓶交易，不另开油画指证轮。两账必须是同一时期、同一收款范围的记录，不把毛收入与净利润比较，也不混入私人借款或内部转账凑差额。


    假油画保留歌舞厅原位置，战利品墙另设为走廊的独立环境证物，不独立增加指证轮；油画七千美元保留在第一轮十月账目对照中，不混入 Lawson 的私密照片。Lawson 照片只对应花瓶四千。'
