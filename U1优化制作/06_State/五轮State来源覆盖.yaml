- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: L5 James三轮指证：发言与出示（已确认）
    line: 471
  text: 'Zack先提出作案窗口并询问James；第一轮由小酒保替James辩护，后两轮由James自己否认、退守。指证对象始终是James，小酒保的错误判断不作为其犯罪嫌疑。


    | 轮次／发言人 | 说法大意 | 玩家出示 | 玩家选择依据 |

    |---|---|---|---|

    | 第一轮／小酒保 | 那时候要是开枪，我们怎么可能听不见？ | 完整节目单 | 实际演出时段对应作案窗口；结合已查看的曲目音量参考，想到音乐能盖住枪声 |

    | 第二轮／James | 我没进过会客室，里面说话的不是我。 | Vivian隔门喊话证词＋James厨房喊话证词 | 两份“Do not be bothering me!”相互对应 |

    | 第三轮／James | Webb拿枪威胁我，争抢时走火了。 | 物品详情已说明状态的故障手枪 | Webb故障枪的物品详情已说明，故障后没有击发过的迹象，反驳争枪走火说法 |


    三轮选证物体验已确认：时间窗口 → 门内说话者 → 射击经过。音量参考表承担阅读依据，不增加出示物件；故障枪直接回用物品详情信息。


    自由探索阶段 James 提供工作事实、保持普通交谈；被指控后才进入否认与退守。选人后由Zack先提出作案窗口并询问James，随后保留三轮谎言、出示与退守。


    最后若James声称Webb用自己的防身枪威胁他、争抢中走火，玩家只出示物品详情已说明状态的故障手枪。L4取得后详情直接展示、L5回用同一物品，不依赖维修资料或另增检查证词；物品详情不解释Tommy为何归还或取走。枪在故障后没有击发过的迹象，反驳James所述争枪走火。


    厨房对抗中 James 仍控制信息。小酒保替他辩护、Emma 提及胁迫孩子后接逃跑；James 的交易动机与真心留后巷，不前移为调查时主动诉苦。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 作者真相与玩家已知必须分开
    line: 489
  text: 'Webb把故障枪交给Tommy送修。Tommy知道Vivian的计划后故意取回未修好的枪、归还给Webb，防止她被反杀；担心自己归还的故障枪会暴露干预，进会客室取枪，入室后才看见尸体，23:18离开后把枪藏在办公室。他误以为Vivian杀人，才伪造23:18仍活着的说法。对外的活人交枪解释掩盖从尸体上取枪的真实经过，存活说法掩盖见尸事实。


    正常探索只承认经手，回避中间处置，因为解释为什么把明知故障的枪还给Webb，会暴露参与杀人准备。Tommy主动承认枪有故障，避免额外否认可核查事实。玩家在物品详情看到未见试枪痕迹的说明，以此确认其描述的当面试枪经过不成立。故障由物品详情直接说明，不以机械障碍不能击发击破Tommy，也不提前解释见尸取枪与保护动机。


    选择Tommy后，玩家只出示一次详情说明未见所述试枪痕迹的故障手枪，击破“Webb当面试枪后交给我维修”的解释；随后他主动撤回存活说法，承认入室已见尸体、误认Vivian杀人，完整交代故意归还故障枪是保护她、见尸取枪是自保、伪造存活证言仍是保护她。此时再坦白遭
    Webb 勒索、身份承诺无望，形成对正常探索中家庭辩护的回看；照片中的另一人仍不在这里揭晓。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
