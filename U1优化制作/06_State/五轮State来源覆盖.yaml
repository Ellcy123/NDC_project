    line: 114
  text: '两账逐月对照：九月四千与八千相差花瓶款四千；十月四千五百与一万一千五百相差油画款七千。两笔均反驳“所有收入都入营业账”。


    仅有营业账不知道 Webb 实收多少；仅有 Webb 记录不知道营业账是否漏记。因此两份记录各有必要作用。'
