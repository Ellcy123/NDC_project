- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 击穿逻辑
    line: 174
  text: '原签客户为 Lawson Vanderbilt，收件栏却是另一个完整姓名：名字不同，姓氏同为 Vanderbilt。这直接推翻 Tommy 对原签收件栏的陈述。玩家无须识别收件人的具体身份，亦不能仅凭同姓自动确认夫妻或母子关系。


    击破后的退让须明确：Tommy 撤回“退还本人”，承认原签写的是另一名接收对象，并与 Zack 一样误以为她是 Lawson 的妻子；不揭晓实际母子关系。这样不把名字不同本身当成排除别名、证明完整身份的万能依据，也不要求另开一轮调查收件人。


    结合 Tommy 刚才承认的条件与告知经过：Lawson 事先知道，不交四千，这套私密照片就会被交到原签写明的另一人手中。所谓“退还本人”的无害解释被击破，付钱阻止对第三人的披露构成这次要挟。


    原签自身不独立证明全部勒索；闭环来自它与 Tommy 新承认的事实交叉。签上同日“作废”和第一轮实收记录起补强作用，不能仅凭同日巧合反推付款与取消的因果。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 成功后可确认与不可提前揭示
    line: 184
  text: '- 确认 Webb 以私照经营勒索，Tommy 曾向客人说明条件并经手执行；本轮不把他升级为整个网络的策划者。

    - 玩家只获得“寄件签上的同姓收件人是谁，为什么 Lawson 不愿让此人收到照片”的未解问题。

    - Zack、Tommy 将 Éléonore Vanderbilt 误认为 Lawson 的妻子，U5 才揭晓是母亲。U1 道具写完整姓名及“女士”称谓，不印亲属称谓；Emma 不因此被追加确认同一判断的对白。

    - 不安排玩家先查明收件人身份才能提交。信息面板、关系网、证物摘要、照片题注与收件地址均不能旁路揭露母子、父子或继承关系。

    - 本轮不额外写出 Charles、Miller 或总裁身份，不把收件人等同于 Whale，也不宣称其指使 Webb 被杀。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: L2 跨轮试打与制作边界
    line: 192
  text: '| 待反驳断言 | 标准最小答案 | 其他材料／组合试打 | 减件与风险 |

    |---|---|---|---|

    | R1：所有收入均已进入营业账 | 两本同范围收款账 | 私照、花瓶观察、作废寄件签即使组合，也不证明实际收到款或营业账漏记；若包含两本账则效力来自账目 | 单本不足。Webb 原记录内容保留；其他明确实收记录须按真实效力接受
    |

    | R2：现仿品在交付后才摆上 | 旧照＋当前花瓶观察 | 两账与寄件签不能确定现瓶何时出现；照片＋签也缺当前物件身份。R1 时尚无现瓶是假、交付后才摆的新断言 | 必须有可靠的早于交付日期及清晰同一性特征。不同照片状态如保留同等有效信息，不应仅因版本不同判错
    |

    | R3：原签收件栏是 Lawson 本人 | 原寄件签 | 两账＋花瓶＋私照只证明款项、时间和内容，没有收件栏；贵宾合影只认 Lawson，不能替代签。R1／R2 尚无照片与原签对应、告知条件等新承认，不能拿后来的供述倒填
    | 单件签已足够，未知亲属身份不构成缺件。签的对应关系必须由完整退守锁定，不能混用另一笔业务的签；收件人具体名字定稿后须复核其与客户姓名确实不同 |'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 后续制作清单
    line: 200
  text: '1. 谎言锚放普通 Talk；第二、三轮退守只在 Expose 当场产生。疑点不能提前要求这些新谎言，否则会卡住指证前搜集门槛。

    2. 两账、照片、当前花瓶观察、寄件签及分析后实际使用状态，均须挂入 L2 或更早疑点／碎片条件。可按“账目差额”“照片与陈设”“作废寄送”组织，不在疑点题面直接解释替换时间或收件人身份。

    3. 当前花瓶可采用直接观察记录。若仍使用现场照，必须解决相机已在发现照片事件中摔坏后的拍摄来源，不凭空继续使用同一台相机。

    4. 独特旧伤、照片日期标记及两账统计口径需要同步到实际图像／描述；未完成前不称正式配置已通过。

    5. 正式对白生产按 `ndc-dialogue` 流程进行，保持本稿知识边界；本稿只保存谜题断言及推进语义，不替换 Unit1 完整台本。

    6. 寄件签收件人采用 Éléonore Vanderbilt 女士，以“女士”强调性别，不加亲属称谓。Zack、Tommy 的妻子判断按误认呈现，不能在客观证物摘要中写成事实；U5 回收母亲身份。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 3. L3：枪击时序与受胁迫的指认
    line: 209
  text: 'Morrison的勘验把致命射击与会客室破窗相连；垃圾袋下的玻璃结合Rosa的23:20倒垃圾证词，将枪击推到23:20之前。本轮不精确锁定为23:00—23:10。


    寻找Rosa的调查链为：清洁间箱外医疗单提供医院信息 → 医院走廊向James、Anna问路 → Isabel病房取得生日吊坠（内盖“我的天使 · 0915”）→ 回清洁间开箱取得威胁纸条 → Emma跟踪现身 →
    搜齐材料后到病房指证Rosa。其他探索自由穿插；物件、NPC和入口详见核对稿。


    | 轮次 | 说法 | 击破材料与玩家判断 |

    |---|---|---|

    | 第一轮 | 23:30枪响时杀了人 | 垃圾下玻璃与23:20倒垃圾证词，结合勘验关联，证明致命射击更早 |

    | 第二轮 | 没人逼我，我自愿作证 | 威胁纸条直接反驳自愿指认；医疗资料只解释处境 |


    纸条写在蓝月酒吧餐巾纸背面：“23:30 去 Webb 的会客室，说你看见 Vivian 杀了 Webb。否则，你女儿就没命了。”它证明伪证事先安排，写信人此时未知。Rosa在击破后交出现场捡走的.45弹壳，供L4检查、拓印及回用。她要求保密属于人物情节，不限制既定证据使用。


    J/T字形只在L2欠条、L3威胁纸条图像中呈现，前期描述与角色不点明异常。L5厨房收集《美国工人英语练习书》后，三者的字形在正式对抗及真相还原后的争辩中回扣，由Emma指出James胁迫Rosa；不新增第四轮指证。


    窗外撕毁的Whale委托书保留环境拼合查看，只露出Whale、报酬与事成后尾款，受托人和任务缺失。玩家可误联想Rita的收购，角色不确认；实际对应James，后巷交易坦白回收。它不作指证、电话出示或笔迹识人材料。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 4. 两轮结束后，L4 接到什么
    line: 226
  text: '玩家已经知道 Webb 经营照片勒索，Tommy 经手执行；Lawson 的照片曾计划寄给另一位同姓者，其关系仍未明；Zack曾借钱给James，并在医院认识Anna；Rosa 的指认受到针对女儿的威胁；致命枪击早于
    23:20；手里多了一枚 Rosa 从现场捡到的弹壳。Vivian 是被利用过、有怨恨且仍未说明完整经历的人，不能只因 Rosa 撒谎就宣布她无辜。


    尚不知道：Vivian 的具体杀人计划、Tommy 知情配合及故障枪安排、实际演出时间、23:05 门内是假声、James 的杀人与交易，以及 Morrison 受 Whale 影响的完整原因。这些构成 L4—L5
    的推进空间。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 遗嘱、收购与寻物的因果
    line: 232
  text: '1912年事故后，Webb从TideWater购入土地建立酒吧，Rita当时即持有少量股权，现代表公司推动全面收购；少量持股不等于已经有权接管整间酒吧。Webb勒索了惹不起的人，担心报复及死后财产、秘密被夺，故提前委托Zack保障Vivian继承。他并不预知具体死法，也不另增案前威胁信。


    L1只交代遗嘱委托；L2Zack据委托要求等继承手续完成后再与Vivian商谈；L3查明勒索后才回看委托动机；L4Rita私搜使收购之外的寻物目的可疑；L5电话把寻找把柄、Whale与保险柜联系起来，用密码线索换取继续查凶和放人的机会。具体股份与事故经过留后续，人物对继承的态度变化见增强情节线。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 三、人物行动与知识边界
    line: 237
  text: 'Vivian／Tommy 关系线的揭示边界已确认：Vivian 在 L4 被枪检与弹壳推翻认罪经过后，才怀疑知道计划的 Tommy，并简述旧怨。L5 Tommy普通调查只以妻女仍依赖Webb办理身份辩护，面对旧怨追问避而不答；遭勒索、身份承诺无望及完整保护动机留选择Tommy后的坦白，不透露照片或涉及人物。正确路线由James后巷转述同一次酒谈补足身份信息。结尾由
    Vivian 打开 Webb 办公室保险柜，玩家在唱片之外发现两人的勒索照片，才确认 Tommy 隐瞒了什么；她只简短承认当年参与设局；两人并无真实亲密关系。此处为作者层与对白信息边界，具体流程见《内容修改后的增强情节线》，不新增指证证物要求。


    | 人物 | 实际行动／知道的事 | 不知道或不能预先断言的事 |

    |---|---|---|

    | Vivian | 提出杀人计划，案发前只亲口告知 Tommy，并请他安排演出；23:05 被门内声音喝退，23:30 入室见尸并听到头顶二楼方向的枪响；知道 Webb 一般保管材料的习惯 | 不知道 Tommy
    是否另向谁透露计划，也不知道故障枪与取枪；不承担 23:18 目击 |

    | Tommy | 知道 Vivian 的杀人计划并配合演出，另行取回未修好的枪交还 Webb；入室后见尸取枪，23:18离开，随后藏进办公室抽屉 | 不知道 James 抢先杀人；取枪出于见尸后的恐惧自保，不是与
    Vivian 事先约定的善后 |

    | James | 同一次酒谈听到身份承诺骗局与音乐安排，接受 Whale 交易；利用送餐时段入室杀人，遇见 Vivian 后临时冒充 Webb 并追加嫁祸 | 不知道 Webb 的枪仍未修好及 Tommy 私下的决定；不预知
    Vivian 会在 23:05 到来 |

    | Rita | 首次出场与追讨欠薪、不愿配合交接的 James 冲突；L4 办理收购与交接，在指证前的自由探索中私搜 Webb 办公室，实际受 Whale 指派寻找勒索材料 | 自由探索只积累怀疑，身份与寻物目的到电话中综合判断；不与
    Vivian 直接对抗，不作为指证对象，不参与命案或供出真凶 |

    | Rosa | 知道女儿受到威胁，按要求作伪证；知道自己丢垃圾的时间 | 不自动知道匿名威胁者是 James，也不替玩家解答房内经过 |

    | 小酒保 | L2 与 James 一同讨薪，提供演出安排见闻；L3 向熟客 Morrison 求助遭骂；L4在Tommy办公室内讨薪并提供23:18离室目击；L5在厨房策划报复 | 不知道 Vivian 的杀人计划，未见
    Tommy 入室，不知其实际停留时长，没看清所携物件，也没见房内杀人；不提供保险柜信息 |

    | Zack、Emma | 根据分轮取得的材料推进：虚假案发时间、Vivian 杀意、Tommy 藏枪、James 去向 | 不把安排演出当成共谋铁证，不凭一种口音或缺少不在场证明就单独宣布真凶 |


    Tommy 的动机现已确定：Webb 以照片勒索他，迟迟不办移民证，使其妻女只能在屠宰场上工；对 Vivian 的利用及与 Rita 的出轨又加深他的怨恨。因此他听完计划后不阻止、不告发，并按要求安排演出。想到 Webb
    托自己送修的枪，他担心 Vivian 反被杀，决定取回尚未修好的枪，原样归还 Webb，却没告诉 Vivian。


    作者层真实经过：Tommy前一天取回枪时维修尚未完成；取消维修单后，不再通过纸质记录提前交付这段事实。他进入会客室后发现 Webb 已死，意识到警方会追查自己经手却没有修好的枪，于是在同一次入室中取走，23:18离开后锁进办公室抽屉。见尸与取枪发生于同一次入室。他的弧线是怨恨下知情协助、私下保护
    Vivian，面对真实死亡又首先自保。


    同一次酒谈仍保留两项内容：Tommy 抱怨 Webb 没有兑现员工身份承诺，同时提到音乐安排。James 因此失去继续等候的希望并掌握掩声机会；Whale 后来联系，他接受交易。Tommy 确知身份承诺未兑现的依据仍需落实，不能把醉话当成全知事实。


    Tommy 与 James 的镜像：Tommy 过去相信，只有继续替 Webb 做事，才能替妻女争取到移民证明；Webb 所谓的信任，建立在他为家人不敢离开的处境上。直到承诺不断落空，忍耐才变成怨恨。James 从他的经历中看见继续等候可能换来的结果。L5
    指证后讲述自己的计划与交易时，James 会提到，自己也希望 Tommy 有一天能够摆脱这种生活。这是对相似处境的理解，不把杀人交易改写成替 Tommy 解困的计划。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 四、真实时间线与玩家核验时间
    line: 259
  text: '| 时刻 | 幕后实际事件 | 玩家如何接近这一事实 |

    |---|---|---|

    | 案前 | Webb 的枪本有故障，托 Tommy 送修；Vivian 只把杀人计划告诉 Tommy，请他安排演出，他知情配合 | L2 小酒保先说 Tommy 有安排演出；L4 第二轮揭出 Tommy 经手安排；全部指证结束后
    Vivian 才坦白只向他告知计划及他对 Webb 的仇怨；L5 核实实际执行，枪在L4搜出，L4取得后物品详情直接说明故障、未见试枪痕迹与故障后未击发，L5回用同一物品 |

    | 案发前一天 | Tommy 取回维修未完成的 Webb 防身枪，原样交还；这是他得知计划后私下做的决定，没告诉 Vivian | 物品详情直接说明故障；完整经手经过按Tommy坦白的信息边界交代，不再通过维修单取证
    |

    | 23:00 | James 利用下楼送餐和强鼓点入室杀死 Webb | 玩家先确定十分钟窗口；节目单本身不能推出正好 23:00 开枪 |

    | 23:00—23:10 | 当晚实际足以掩盖枪声的演出段，James 在会客室内 | L5将实际节目单与音量、L3时序交叉，再核查James对应时段的实际工作行动；排班不是实际履职或入室证据，回用L2已收录的23:10—24:00厨房自述证词，送餐经过仅留普通对白，无须新增旁证
    |

    | 23:05 | Vivian 敲门，James 冒充 Webb 喝退她 | L4 指证 Vivian 后，将门内的“Do not be bothering me!”收录为她的隔门见闻证词；L5 与 James 厨房喊话证词对照
    |

    | 23:10 | James 离开会客室 | 保留幕后离开时刻；玩家以时间空档与门内声音逐步还原，不凭节目单单独推出准确离开时间 |

    | 23:18 | Tommy离开会客室；此前入室时已见尸体并取枪，之后藏枪 | 第三方只目击离开，未见进入；三分钟为Tommy在L5受询问时自述，实际进入时间和停留时长不据此确认 |

    | 23:20 | Rosa 丢垃圾，垃圾覆盖先前形成的玻璃碎片 | L3 已有时序证据，证明致命枪击早于此刻 |

    | 23:30 | Vivian 送酒入室发现尸体；James 从二楼厨房窗口向外射击，制造假案发枪声；Rosa 按威胁指认 | L3 证明它不是致命枪声，L5 最终还原；James 的实际行动地点为二楼厨房 |


    本版区分三类时间：23:00为作者侧真实杀人时刻；23:00—23:10为玩家核查的掩声窗口；23:18为小酒保亲眼看见Tommy离开会客室的时刻。小酒保没有看到他进入。Tommy自述待了三分钟，据此推算约23:15入室，不能写成第三方证实或已经核实的真实停留时长。


    要把十分钟窗口作为有效排查依据，还须确认：当晚实际按这个时间演出；相关案发前区间没有另一段同样能掩盖枪声的噪声；非掩声时段的枪声具有可被现场人员听见的条件。证据范围未闭合前，只能说找到了可作案窗口，不能宣布节目单单独排除了所有别的可能。


    作者侧真实动线：James陪Anna住在Isabel病房隔壁，案前已知道Rosa女儿的病房信息。23:05意外遇见Vivian后，他临时追加嫁祸，将威胁纸条塞进Rosa的清洁间，Rosa随后收到；不另设精确投递分钟。此经过只用于作者侧因果，不新增玩家线索、证词或真相还原台词。Vivian每晚23:30送酒的惯例来自James的日常工作知识。23:30第二枪由James独自在厨房制造；他声称在厨房，不等于有人证实他一直在正常做饭。'
