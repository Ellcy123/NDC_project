- beat_id: U1L5_narrative_detail_058
  source_anchor:
    file: 剧情设计/Unit1/内容修改后的增强情节线.md
    heading: 五、L5结尾统一顺序
    line: 237
  source_event: '以下情节点按五个连续锁定的场景AVG承载：后巷 → Anna病房门外 → Anna病房（含Tommy返店通知）→ 酒吧大厅（含Vivian下楼）→ Webb办公室（私谈、开柜与试听）。场景间不恢复自由探索；下表细分情节点，不另拆场景。


    L5后巷／酒吧后门已确认：James逃离厨房后，Zack、Emma追出，自动进入连续AVG。James、Zack、Emma在场，Anna在车内受控制，通过剧情呈现；James看见Anna后坦露家庭动机与Whale交易，随后自杀。坦白作为剧情信息；本段不收录新证词，不设置自由搜证或独立NPC问话。结束后自动衔接医院探望Anna，追赶途中不插入探索。


    L5 情绪节奏已确认：厨房正式对抗中，James 始终控制信息、反驳并退守，不主动诉苦或交心。指证结束后，他要求 Zack 完整说明自己做了什么，接原 finalexpose 真相视频；视频是 Zack 的案件还原，不是
    James 的真心自白。视频后由小酒保承担不信、动摇及替他辩护的情感，Emma 回应受害者付出的代价，提到胁迫孩子后，James 不辩解、直接冲下二楼逃到后巷。Zack、Emma 追赶；James 看见 Whale
    车内的 Anna、退路被截断后，才坦露对 Anna 与孩子的打算及真正害怕失去的生活，随后进入自杀结局。厨房还原他做了什么，后巷才由他自己说原本想得到什么。


    | 顺序 | 事件 | 此时让玩家感受到什么 |

    |---|---|---|

    | 1 | 厨房正式对抗，James 控制信息、反驳；要求 Zack 完整还原后接真相视频。视频后小酒保辩护，Emma 指出他人代价 | 真相成立，小酒保仍想替他解释；James 尚未坦露真心 |

    | 2 | Emma 提及胁迫孩子，James 不辩解，冲下二楼逃到后巷；Zack、Emma 追赶，想让他停下、自首 | 仍想让人活着承担责任，完成释放 Vivian 的约定 |

    | 3 | James 停步，Whale 的车经过，两人看见 Anna；退路被截断的 James 此时才坦露真心，随后在威胁下自杀 | 对 Whale 的愤怒与救人失败的无力 |

    | 4 | 自动转场医院，探望 Anna | 死亡的后果延续到仍要生活的人身上 |

    | 5 | 告知死讯后，Anna 盘算工作、孩子与欠款；Zack 交还欠条，Anna 攥纸崩溃；Emma 安慰，Zack 承诺共同追查，随后协助照护问题 | 死亡落到家人身上，欠条成为遗物；搭档共同承担后果，Vivian
    能否获释仍未确定 |

    | 6 | Tommy 到病房传达 Vivian 获释的消息、叫两人回酒吧取材料；Anna的照护话题留到Webb办公室私谈 | 获释先带来意外与宽慰，Anna 的困境留到见面时接住 |

    | 7 | 回酒吧大厅，小酒保与 Morrison 在场；若已确定泼水计划，Morrison 呈淋湿状态，否则正常；交代送枪放人与赌债追索 | 恶作剧得到回报，Whale 履约留下疑问；小酒保此时才听懂 L3 失态的原因
    |

    | 8 | 小酒保心软提出请酒，不承认泼水；Morrison 狐疑他快没工作还哪来的钱 | 报复后出现一点歉意与同情，重新提起遣散压力 |

    | 9 | Vivian 从楼上下来，此时才揭露不卖给 Rita、接手酒吧并留下员工的决定；她接话、认可请酒，明确为照顾他们的生计而不去巴黎 | 员工的去留有了回应；L4 主动请求查明真相的她，回来后终于作出自己的选择
    |

    | 10 | Vivian带两人到Webb办公室，在同一AVG中先私谈Anna与Tommy，再开柜；玩家发现 Tommy／Vivian 的勒索照片及唱片碎片，随后听取唱片 | 照片回收被隐去的旧怨；兑现谈判筹码，转向下一章危机
    |


    结尾的 Whale 由行动留下存在感：逼死 James、安排送枪、释放 Vivian。无需再安排一通解释或威胁电话。轻喜剧只落在 Morrison 的狼狈上，不让 Zack、Emma 把这一晚当作值得庆功的胜利。'
