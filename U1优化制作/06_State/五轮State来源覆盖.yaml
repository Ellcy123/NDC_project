    heading: 必须保留的局部顺序
    line: 453
  text: 'L5厨房窗户为可独立点击检查、不收集的环境物，呈现厨房位于会客室楼上、窗下为巷子的空间关系。玩家可直接查看，恶作剧话题仍可提及同一空间关系；环境检查只呈现位置，制造枪声的用途由玩家自行判断。


    厨房James喊话先于普通交谈取得；其余人物问话与节目单探索可自由穿插。工作表只列送餐安排，不把计划当成已核实行踪。场景内环境物与入口见核对稿。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 与其他线汇合时，玩家判断什么
    line: 459
  text: '- 两份喊话材料对应：23:05门内的人可能不是 Webb，而是说出了惯用表达的 James。

    - 独立取得的实际节目单＋音量信息＋L3枪击时序：确定应核查的掩声窗口，再与 James 的工作行动对照。

    - 时间、声音与实际行踪共同支持选择 James；不能听完喊话就由剧情自动选定他，也不能把排班当成已核实的入室证据。选人入口只选择对象，三轮出示按已确认表执行。


    先去厨房，玩家会带着声音疑问寻找时间依据；也可先到小包厢检查取得节目单，结合其他材料形成时间判断后，再进入厨房核查。两种顺序都成立，不要求先拿枪或问完Tommy。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
