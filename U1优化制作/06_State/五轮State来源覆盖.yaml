- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 1. Webb 唱片碎片的流转
    line: 550
  text: 'L5尾声物件配置：Vivian在剧情中打开Webb办公室保险柜，不设玩家密码输入玩法。唱片碎片作为正式物件取得，试听后由Zack保留，承接后续章节，不用于本章指证。Tommy／Vivian照片为开柜后可查看的环境证物，不收入Caseboard，不新增疑点或证词。


    用同一批实物把 Webb 的秘密、与 Whale 的交易、Mickey 的遗留物和后续调查连起来；具体交接方式与解密谜题以后再设计。


    | 节点 | 概念情节 | 对玩家的作用 |

    |---|---|---|

    | U1 L4 自由探索 | 在Webb办公室被Rita翻过的抽屉里取得密码提示纸条，无须向Vivian询问纸条；从Emma处取得Rita相关调查信息，检查保险柜时可回想L3的保管习惯证词 | 提供推理材料，不在这里确认
    Rita 身份或在 Vivian 指证中直接指认她 |

    | U1 L4 自由探索突发 | 玩家在指证前目击 Rita 私搜 Webb 办公室、检查保险柜 | 补上案后行动，让电话里可以交叉判断她为什么要收购酒吧 |

    | U1 L5开篇电话 | 电话中四步选择推理 Rita 为 Whale 寻找勒索材料、材料在办公室保险柜；Zack 展示密码线索，争取找到真凶即可释放 Vivian | 玩家亲自把线索变成筹码，此时未取得原物，也未听过完整录音
    |

    | U1 L5 尾声：医院 → 酒吧 | Zack、Emma 先探望 Anna，由 Tommy 到病房叫两人回酒吧，查看保险柜，取得现存唱片碎片并试听、保留 | 医院承接人物余波，酒吧回收藏处推理与碎片；录音触及 Zack
    的家人，接入下一章危机 |

    | U2 | Zack、Emma 将已经听过的这批 Webb 唱片碎片交给 Whale | 玩家亲手交出的物件离开自己，交易发生实际后果；交接不揭露 Mickey 就是 Whale |

    | U4 Mickey 坠楼后 | 在他遗留的档案袋中发现当时交给 Whale 的同一批碎片；可接现有离楼后车内开袋段落 | 玩家认出自己曾经交出去的东西，跨章经历在实物上得到回收；不提前替代 Mickey 身份指证
    |

    | U5 | Zack 寻找另一半唱片碎片，与 U4 找回的部分共同用于解密 | 曾经听过的内容仍不完整，旧物成为继续调查的起点 |


    实物流向：Webb 留存于办公室保险柜 → U1 L5 Zack、Emma 探望 Anna 后返回酒吧，查看保险柜并取得、听过碎片 → U2 交给 Whale → U4 从 Mickey 遗留档案袋中找回 → U5
    找到另一半，推进解密。U4 找回的是此前交出的那批，U5 寻找的是此前未取得的缺失部分。


    L4 的筹码现按第五节确定为有依据地判断寻物目标与藏处，并掌握密码线索，不要求先知道秘密的完整内容。跨章仍保留两个问题：既已听过现存碎片，为何仍需另一半才能完成解密；完整解密比各章已揭晓的信息多说明什么。U2 交接仍须隐藏
    Mickey 的身份，U4 的碎片回收发生在其身份揭露与坠楼之后。片数、识别旧物的特征、另一半的持有者及获得方式均留待后续讨论。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 2. Lawson 收件人伏笔（仅作者层）
    line: 570
  text: '本节只供策划、写手与后续审查，绝不搬进 L2 玩家文本。


    收件人实际为 Lawson 的母亲。根据本次用户指定，Lawson 跟母姓；与他同姓的收件人并非妻子。


    Lawson 的正式姓名是 Lawson Vanderbilt。沿用该姓名，并把 Vanderbilt 确认为本次安排中的母姓；母亲姓名沿本方案已确认的Éléonore Vanderbilt。现行人物档记载母亲为欧洲贵族女性，具体国籍与家族未在本方案锁定，本稿不能声称这些细节原已确定，也不为本谜题新增妻子人物事实。


    Unit5 大纲与 Lawson 人物档都确认其为老 Charles Miller 的私生子，V3 的父子谈话／远端录音也会确认这一关系。母姓及收件人身份可作为后续理解其身世的铺垫，但不能仅凭同姓推出父亲是谁。本稿不另行锁定母亲看到照片后会采取何种行动，亦不推定她必将转告老
    Charles、导致继承权被剥夺或 Vivian 受惩罚。


    同一伏笔分两次发挥作用：


    | 回收层次 | 玩家可以知道什么 |

    |---|---|

    | Unit1 L2 | 照片未必退还本人；收件人与 Lawson 同姓、名字不同，真实关系不明；玩家可能自行猜测为妻子 |

    | 后续主线 | 明确这张原签上的人其实是母亲，并回收 Lawson 跟母姓的事实；父子身世仍按 Unit5 已定节奏揭晓 |


    后续回收必须有材料明确把这张旧寄件签上的完整姓名与母亲对应，不能仅凭同姓宣布母子关系。L2 从未由权威文本确认妻子身份，后续揭晓才能成为对玩家理解的翻转，而非修改原有事实。后续回收证据／场景留待后续设计，本次不改 Unit5
    文档。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
