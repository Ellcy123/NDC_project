    line: 498
  source_event: '形式：接在同一L5开篇内，电话挂断后关闭专用电话UI，仍在Webb办公室面对面交谈，不单开确立关系的AVG。


    Whale电话谈妥后，两人终于争得最后一次调查机会。Zack把实际交易条件完整告诉Emma，留一个短暂停顿，再主动邀请她一起查到底。此时的邀请是Zack明确承认自己需要她；此前的临时合作在这里成为双方共同选择。邀请、交换姓名与改称呼均在电话结束后、自由调查之前完成。


    Emma 接受，并借机回扣前面的吃瘪：


    > “一直都在等你这句话呢！你这个连柜子都搬不动的侦探要是遇上什么事可咋办啊！”


    这次请求是正式结伴的明确节点。此前借身份、套消息、临时求助的经历，终于落到由 Zack 主动提出、由 Emma 自己答应的合作。


    两人在这里正式交换姓名。即便此前已经知道名字，也作为重新认识、正式成为搭档的小仪式，不演成直到此刻才得知对方是谁。


    Emma 随即开始直接称他 Zack；Zack 仍称她 O’Malley 小姐。被她指出后，他的反应是：


    > “对我来说有点太快了！”


    行动上愿意并肩，称呼上仍慢半拍，保留 Zack 对亲近关系的不习惯。两人随后带着共同目标继续调查，搭档关系不再拖到医院才成立。'
