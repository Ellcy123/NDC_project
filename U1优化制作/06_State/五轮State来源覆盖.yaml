- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 不同进入顺序的体验
    line: 501
  text: '| 探索顺序 | 玩家体验 | 需要保留的判断空间 |

    |---|---|---|

    | 先查Tommy、James，再拿节目单 | 先积累藏枪、说辞与声音疑问，再用掩声窗口重新比较嫌疑，偏重反转感 | 不把前段写成Tommy必然有罪，节目单也不直接宣布James是真凶 |

    | 调查中途取得节目单 | 先对Tommy或James产生疑问，再取得时间材料修正判断，随后继续调查另一人或回访核实，兼有发现与重审的体验 | 不要求先完成任一人物线；节目单提供核查条件，不直接完成选人判断 |

    | 先到小包厢取得节目单，再查两人 | 先掌握实际演出时间，自行结合音量与枪击时序建立条件，再带着问题检验Tommy证言和James行动，偏重主动核查 | 允许玩家较早察觉23:18说法有问题；随后仍需追查他为何撒谎，以及James与门内声音、作案时段的联系
    |


    上述是自由探索的典型例子，不是固定路线：节目单可以最先、调查中途或最后取得，Tommy、James与演出三线可以穿插。先查人再拿时间材料偏重反转，先拿时间材料再查人偏重主动核查，中途取得则会边调查边修正判断。小包厢搜证不限定顺序，不能假定玩家最后才来；不隐藏已取得的节目单时间，不靠角色替玩家总结掩声或凶手结论。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 选人分支与情感收束
    line: 511
  text: '**选 Tommy：** 玩家可能把他编造试枪交枪互动、隐瞒现场的行为直接当成杀人依据；不要求玩家先理解节目单、击破存活证言。玩家以未见所述试枪痕迹的故障手枪完成唯一一次击破后，他主动撤回“23:18 Webb还活着”，坦白自己是去取枪，入室时Webb已死。故意归还故障枪是保护Vivian，取枪是自保，存活伪证又是保护她。分支回用已有节目单与枪击时序，提醒23:18在掩声窗口之外，应寻找更早的作案时段；不直接点名James。同时坦白遭Webb勒索、身份承诺已无望。随后黑屏：时间耗尽，未能救出
    Vivian，两人未能继续搭档，城市黑暗未被揭开。结束后回选人界面，保留材料、恢复选择前剧情，不公布 James，不重走探索。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 错误分支的推理反馈
    line: 515
  text: '这一分支面向把“枪与证言有矛盾”直接等同于“Tommy杀人”的玩家，也照顾尚未理解节目单作用的玩家。典型误判是他既然编造与活着的Webb互动，就一定是在掩盖亲手杀人，而非已经正确推导死亡窗口后仍被要求选择他。


    反馈顺序：选择Tommy → 出示未见所述试枪痕迹的故障手枪，完成唯一一次击破 → Tommy为否认亲手杀人，主动撤回存活证言 → 交代取枪起因、入室见尸及袒护Vivian → 回看已有节目单，确认23:18没有掩盖致命枪声的条件，死亡须发生得更早
    → 时间耗尽提示，返回选人。


    不增加一道“先用节目单击破存活谎言”的必答题，否则未理解时间材料的玩家反而无法获得这段反馈。说明针对的是按自述约23:15入室后杀人的假说，不把节目单夸大成Tommy整晚的不在场证明；选择James仍需结合其时间、声音与行动的正面证据。人物动机可在此新揭露，选人所需时间材料已在正常探索取得。


    **选 James：** 玩家用时间、声音与行动材料建立指控，再击破其退守。真心留到后巷：案发前同一次喝酒中，Tommy 透露受勒索、身份无望及演出安排；James 从中看见自己的未来，决定不再等待 Webb，接受
    Whale 的交易。


    正确路线先用 Tommy 的家庭辩护铺垫，再由 James 简短转述那次谈话，独立完成情感。坏结局多揭一层Tommy的绝望，并回用已有节目单帮助玩家理解时间窗口；不承担正确路线缺失的必需证据。勒索照片另一人的身份仍留保险柜尾声；同情
    James 不消除其犯罪责任。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 疑点材料与证明边界
    line: 526
  text: '| 疑点工作题 | 触发材料 | 是否指证用 |

    |---|---|---|

    | Tommy隐瞒了什么？ | 23:18离室目击、Tommy的停留与存活自述、实枪及详情中未见试枪痕迹的说明 | 目击用于开启询问，物品详情用于质疑试枪；不单凭隐瞒确认射手 |

    | 什么时候能掩盖枪声？ | 完整实际节目单、可查看的音量层级、L3枪击早于23:20的时序材料 | 选人判断所需；不恢复十分钟空档谎言证词 |

    | 门内的人是谁？ | Vivian的23:05隔门见闻、James厨房喊话，并与实际工作行踪交叉 | 选人及指控所需声音材料；小酒保语言习惯闲聊不收录、不作触发材料 |

    | Webb的枪能按所述发生走火吗？ | 故障枪及其物品详情 | James最后退守的反驳用，最终只出示物品详情已说明状态的故障手枪；取消维修单 |


    上述为内容对应，不新增固定疑点数量或正式ID。出示所需材料必须在选人／指证前准备好，不设故障枪的额外检查完成条件；材料归属本轮或更早的疑点或碎片；旧材料沿原归属回用。James工作行踪依据回用L2送餐普通对白与23:10—24:00厨房自述证词，不新增旁证；不靠坏结局补证据，不以死后取得的凶器倒填前置缺口。


    Webb的故障防身枪为M1911式样、使用.45 ACP，与James实际凶器是不同枪支。同一物品详情分别说明未见所述试枪痕迹、故障后没有击发过的迹象：前者确认Tommy编造了Webb当面试枪的互动，后者反驳James所述争枪走火。物品详情不能单独确认Webb当时已死或Tommy就是射手。玩家取得后直接查看物品详情，同一物品及其信息跨轮回用，不另加维修资料或枪械知识谜题。


    L4购枪收据及电话材料按第五节的已确认取得位置和信息边界执行；Vivian的保管习惯证词改在L3取得，L4检查保险柜时回想，L5电话中综合运用。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 八、案件结局与人物情节的交接
    line: 540
  text: 'James三轮指证结束后接案件还原，J/T回扣揭出胁迫Rosa；他逃到后巷，看到受控制的Anna后才坦露Whale交易与家庭动机，随后自杀。Whale命令杀人至此揭晓；Morrison受Whale控制及赌债原因留回酒吧时本人抱怨。


    医院中Zack将欠条交还Anna，欠条留在她手中。医院、Tommy返店通知、酒吧请酒及照片的情绪回收统一见[增强情节线](./内容修改后的增强情节线.md)。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
