    line: 1
  text: '> 本文维护案件因果、证据链、指证设计与玩家推理体验；[逐 Loop 核对定稿](./Unit1_逐Loop场景人物证物与指证核对定稿.md)维护已确认的配置结果；[增强情节线](./内容修改后的增强情节线.md)维护人物心理、事件衔接与演出。跨类内容只保留必要摘要及引用。'
