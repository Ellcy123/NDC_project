    heading: 2. 自由探索中的静态调查点：Rita私自搜查办公室
    line: 306
  text: Vivian固定在歌舞厅，Emma与Rita固定在Webb办公室，两个调查点可任意顺序访问。办公室进场可见私搜与质疑处境，点击后介入争执，谈完Rita继续清点、Emma仍可问。密码纸条及购枪收据本轮搜证即可取得，不等待争执或Rita离场。Rita劝售移至点击指证后、第一轮出示前，不设置探索事件条件链；人物演出见增强情节线。广告卡、枪源问话及三轮材料条件不变。
