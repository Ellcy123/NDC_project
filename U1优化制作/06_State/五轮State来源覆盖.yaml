    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 保管习惯与保险柜：L3—L5 信息分布（已确认）
    line: 283
  text: '- L3：Vivian 自由探索对话提供并收录保管习惯证词：Webb 通常把重要私人材料放在自己办公室的保险柜里。此处不直接确认勒索材料或某份特定原件在柜内，不交代 Vivian 能开柜。

    - L4：Webb 办公室保险柜为可点击检查的环境证物，不收集。保持关闭；玩家已听过 L3 保管习惯时，检查触发 Zack 的简短回想，仅提醒该习惯，不推断勒索材料就在里面。未听过则只查看锁闭状态，不补发证词、不引用未发生的问话。L4
    不再由 Vivian 重复提供保管习惯。

    - 保险柜不提供密码输入或开锁玩法，不透露柜内物品；密码纸条仍从被 Rita 翻过的办公室抽屉取得。L5 结尾由 Vivian 开柜的安排不变。

    - L5：Whale 电话过程中不能打开 Caseboard。密码纸条必须已在L4取得，作为开柜筹码；玩家联系此前听到的习惯、现场检查与Rita私搜自行判断。Emma调查信息等可选内容漏问、漏看不锁掉正确选项，不自动复述或补发未读材料。'
