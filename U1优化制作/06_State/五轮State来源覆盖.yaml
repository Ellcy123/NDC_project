  text: 玩家追查Webb的营业与Tommy的经手事实。James与小酒保在大厅提供工作信息；James仅收录23:10—24:00未离开厨房的自述，送餐经过保留普通对白；小酒保收录22:00—24:00在吧台未离岗的证词，Tommy不提供整晚在办公室的证明。James欠条的情节见增强情节线，本节只维护其后续笔迹回扣。
