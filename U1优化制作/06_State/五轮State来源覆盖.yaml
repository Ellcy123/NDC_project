- source_anchor:
    file: 剧情设计/Unit1/Unit1_内容修改方案_双重谋杀计划与欠条版.md
    heading: 一、当前方案速览
    line: 5
  text: '| 项目 | 当前安排 |

    |---|---|

    | 整体结构 | L1 命案与调查机会 → L2 两账、花瓶与寄件签揭出勒索，援助 James → L3 医院、枪击时序与 Rosa 伪证 → L4 Vivian 指证与强押 → L5 Whale来电谈判、找到真凶、人物收束及唱片碎片
    |

    | Tommy 与 Vivian | Vivian 提出杀人计划、请 Tommy 安排演出；Tommy 知情配合，又私下把未修好的 Webb 防身枪归还，担心 Vivian 反被杀 |

    | James与玩家 | L2借款与欠条建立接触，L3医院认识家庭；人物互动和欠条回收见增强情节线 |

    | Tommy 三轮指证 | 两本同口径收款账 → 旧照与现花瓶的出现时间矛盾 → 原寄件签揭穿“退还本人”；保留照片烘烤显影，收件人与 Lawson 的关系留待后续 |

    | 演出线 | L2 小酒保只说 Tommy 有安排演出；L4 申请原件揭出 Vivian 的请求与杀人准备；L5 核实实际演出的 23:00—23:10 掩声窗口 |

    | Vivian 三轮指证 | 枪的来源 → 演出准备 → 自毁式认罪；所用材料为小手枪与磨损的购枪收据、节目修改申请、枪检与致命一枪的 .45 弹壳 |

    | Rita 与 Whale | 自由探索积累对 Rita 的怀疑并目击私搜；L5开篇电话中推理她替 Whale 寻找勒索材料，定位 Webb 办公室保险柜，以密码线索争取救人机会 |

    | Tommy 的现场行动 | 入室见尸后取走 Webb 的故障枪，23:18离开并藏枪；小酒保只见离开，没有看到何时进入；停留三分钟为Tommy自述 |

    | James调查与指控 | Tommy、James、演出三线自由调查 → 选择实际射手 → 厨房否认与退守；James不主动递出时段谎言，保留三轮指证，出示组合按已确认的James三轮表执行 |

    | 两次枪响 | 23:00 James 在会客室杀人；23:30 在二楼厨房窗口向外开枪制造假案发时间。L3 证明致命枪击更早，L5 完成还原 |

    | 结尾 | James 在 Anna 受控制的威胁下自杀。医院探望中，Anna 因独力抚养的困境打听孩子出生后能否交由慈善机构收留；Tommy 到病房传达 Vivian 获释的消息，叫两人按约回酒吧取得 Webb
    留下的勒索证物；Anna 的照护与 Tommy 的话题留到回酒吧、与 Morrison 交谈后，由Vivian在Webb办公室私谈，并在同一场景开柜，玩家发现勒索 Tommy 的照片及唱片碎片并试听 |

    | 跨章概念 | 唱片碎片在 U2 交付、U4 找回、U5 补全；L2 寄件签留下 Lawson 同姓收件人的身份疑问，真实关系与身世按后续主线节奏回收 |


    人物关系的底色：Webb 用照片勒索 Tommy，身份承诺迟迟未兑现，Tommy 妻女仍在屠宰场打黑工；Tommy 与 Vivian 之间带有怨憎。Vivian 知道 Tommy 配合演出，却不知道他私下处理枪械的事。James
    对玩家的帮助与他的隐瞒、嫁祸同时存在。'
  usage: 案件/指证/作者真相约束；不得直接全部变为角色已知或玩家证据
