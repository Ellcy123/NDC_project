    heading: 3. Vivian 三轮指证：旧枪、演出准备与自毁式认罪
    line: 328
  text: '以下为 Vivian 三轮指证的题面与证据要求。Rita 在自由探索中承担心理铺垫与寻物线，正式对白和配置待制作。


    | 轮次 | Vivian 的谎言／退守 | 主要出示材料 | 击破与承认 |

    |---|---|---|---|

    | 第一轮：枪的来源 | “这把枪是我自己买来防身的，和 Webb 没关系。他只会让我替他做事。” | Vivian 的小手枪＋Webb办公室被Rita翻出的磨损的购枪收据 | 收据磨损，仅付款人Webb与枪号可辨；枪号与实枪刻号一致，不显示枪型或购买日期。先证明她隐瞒付款来源；被击破后，由她承认这是
    Webb 当年送给她的保护礼物，不用收据证明他爱她 |

    | 第二轮：隐瞒经手人 | “曲子是我自己找乐队换的，没有经过 Tommy。” | Vivian 签署、带 Tommy 经手记录的节目修改申请原件 | 证明当晚安排确实经过 Tommy；她退守为他只是经理、仅经手演出，仍不承认他知道杀人用途。申请不直接证明
    Tommy 知情 |

    | 第三轮：虚构的射击 | “我带着这把小手枪进去，用它向 Webb 开了枪。他就是这样死的。” | 小手枪检查结果＋致命一枪留下的 .45 弹壳口径材料（沿用弹壳拓印） | 她的 .25 小手枪没有近期击发痕迹，且与致命一枪的
    .45 弹壳不匹配，推翻她描述的杀人经过。她撤回虚假认罪，开始说清自己真正做过的事 |'
