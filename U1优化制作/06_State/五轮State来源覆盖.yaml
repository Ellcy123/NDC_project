  source_anchor:
    file: 剧情设计/Unit1/内容修改后的增强情节线.md
    heading: 11. L4大厅转折与歌舞厅强押：Emma挡路、Zack担责、Vivian托付（已确认）
    line: 472
  source_event: '形式：先是大厅的Morrison转折场景AVG，再是歌舞厅的强押场景AVG；均由指证后固定续接，中间不恢复自由探索。


    Vivian在歌舞厅完成指证后的真实见闻交代。Zack与Emma到大厅向Morrison说明核查结果，弹壳引出其态度转折；Vivian不随同去大厅。这是独立的Morrison转折AVG。随后转到歌舞厅，Morrison仍要押走Vivian，强调核查机会已经给过，以催她离开结束谈话；以下阻拦与托付均发生在歌舞厅。


    Emma要求他回应射击经过的矛盾；见他不回答便要带人，一急跨到出口方向挡路。这里延续Webb办公室里的性格：她发现问题准确，却急于逼对方立即回应。Morrison警告再阻拦就连她一起带走，伸手抓她。


    Zack把Emma拉到身后，站进两人之间，伸出双手等铐，主动承担她的风险。这个动作回收L1擅自借用她身份的欠账；不靠身份豁免、幕后关系或预先安排的电话使Morrison退让。


    Vivian主动走向出口，愿意跟Morrison走，但回头请求两人继续调查。Emma让开，Zack也收住动作；原本的阻拦解除，Morrison能够带走Vivian，便顺势结束与二人的冲突。她从接受认罪转为主动托付查明真相；人仍被带走，救人失败的结果保留。


    共同出场不以读完Emma的Rita见闻为前置。已在办公室约好同行时正常承接约定；若玩家漏掉办公室交谈，进入收尾时补一个Emma加入同行、Zack应允的简短动作，不引用未发生的约定，不补发或补讲漏读材料。


    本场不揭露Morrison与Whale的关系。Emma不因被保护而收起脾气；Zack愿意共同承担，却不在此承诺信息完全透明，也不解决替她决定或过滤真相的长期问题。具体逐句对白与正式配置另行制作。'
