- beat_id: U1L4_narrative_detail_096
  source_anchor:
    file: 剧情设计/Unit1/内容修改后的增强情节线.md
    heading: 10. Emma 查 Rita，Zack 查 Vivian
    line: 457
  source_event: '两人不必举行正式的分工会议，却自然各走一边：


    - Emma 追查 Rita 急于接管酒吧、搜找私密文件的动向，取得能够帮助核实 Rita 行动目的的关键证物。

    - Zack 核实 Vivian 的枪械来源、节目变更与案发叙述，追问她为何认定自己有罪，继续核查她的认罪说法。


    Emma的L4位置已确认：开头离开调查Rita；自由探索时与Rita固定驻场Webb办公室，不要求先见Vivian。Zack进入可见Rita翻找私人文件、检查未打开的保险柜以及Emma质疑她的处境，点击后介入争执，不设自动进场事件。Rita以清点财产解释，谈完继续清点；Emma继续可问，以同场低声交流交付此前向在场者搜集的可选见闻，不当着Rita公开全部怀疑、不收录证词。点酒不喝、盯会客室走廊、接触Webb主顾仍属转述，Rita可能替Whale打探消息仍是怀疑。Emma提出稍后也要参加与Morrison的案情交涉，Zack答应。这里只约定共同参与，正式搭档认可留L5开篇Whale电话结束后，Zack替她决定或过滤真相的问题尚未解决。Rita劝售移至点击指证后、第一轮出示前的普通无背景正反打，结束交谈后切Zack与Vivian，不演离场。


    Emma的性格表现：她敏锐地抓住Rita翻私人文件与正常交接不相称的地方，遇到敷衍便直接追问，不肯轻易让步；但急于当面问穿，把谈话逼成争执，仍未问到真正目的。让玩家同时看见她的调查能力、直率与急躁。Zack点击介入，不代她完成判断或替她教训Rita；Rita继续清点时，Emma可与Zack低声谈及此前独立调查的见闻，并主动提出参与后续交涉。材料交付不替玩家串起结论，信息联系由玩家在L5电话中完成。


    两人嘴上仍可较劲，交出成果时却不再设条件。各自行动时已经会想到对方需要什么，碰头后能够马上接着往下办事。


    Emma 的证物承接现有 Rita 线，不在本文另造揭穿幕后身份的物证。Whale电话判断可参考玩家已取得的材料；Emma调查信息等可选内容漏读仍可尝试各选项，但密码纸条须在L4取得，不能漏取后进入筹码谈判。'
