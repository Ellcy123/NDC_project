  source_event: 'Zack 想知道 Emma 到底在查什么，Emma 不愿白白交出成果。


    Zack 利用试探与有意留错的判断，引她纠正自己，从反应中套出：她正在调查酒吧的勒索生意。


    这一轮明确由 Zack 得手。Emma 发现又被绕了进去，Zack 带着赢了的得意离开。这里不安排公平交换，也不顺势谈成搭档。


    Emma 透露的是调查方向与局部信息，不替玩家解开账目、照片及相关物证之间的完整勒索链。'
