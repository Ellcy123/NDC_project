- beat_id: U1L2_narrative_detail_055
  source_anchor:
    file: 剧情设计/Unit1/内容修改后的增强情节线.md
    heading: 一、共同起点：L2 大厅遣散与追款冲突
    line: 92
  source_event: 'Emma 此时在小包厢，Zack 独自进入大厅。Rita 是酒吧已有的小股东，同时代表 TideWater 推进全面收购。她提出给员工一笔钱，遣散他们；对缺乏所需移民身份、依赖酒吧工作和落脚的员工来说，这意味着失去容身之所。小酒保希望留下工作。James
    则向 Rita 追讨 Webb 尚未结清的跑腿报酬：Anna 孕检情况不好，接下来需要一笔医疗费用，Rita 不肯支付这笔款项。


    James 对其他员工担忧的移民问题没有明显反应。幕后原因是 Whale 已替他与 Anna 办妥身份；L2 不说明这一原因，也不由 Zack 当场点出异常。所谓跑腿实际涉及 Webb 的勒索业务，当前追款不直接交代完整经手内容，更不能将这笔旧报酬混同为
    Whale 的杀人酬金。


    事件按以下顺序发生：


    1. Zack 独自目睹遣散与追款冲突。Rita 推进收购交接，Zack 以 Webb 留下的遗嘱委托及 Vivian 的继承安排正面阻止：如要全面收购，应等继承手续走完，再与 Vivian 商谈；不替 Vivian
    永久决定是否出售。

    2. Rita 暂时退出这次交接、离开大厅，收购诉求仍在。大厅剩下 Zack、James 和小酒保；James 的跑腿报酬仍未拿到，小酒保的去留也未确定。

    3. 得知 Anna 的医疗需求后，Zack 临时拿出一些钱借给 James 应急，具体金额与医疗开支在制作时落实，不默认这笔钱已覆盖全部费用。

    4. James 认真写下所借金额的欠条，交给 Zack，准备之后还钱。

    5. James与小酒保留在大厅，接续Zack询问。工作与行踪的收录口径见核对稿。


    同一场事件区分两人的困境：小酒保害怕失去工作与落脚处，James 已解决身份问题，却仍为眼前医疗支出追款、借钱。Zack 垫款给 James，James 认真记下要归还的债。Emma 不在事件现场，也没有出钱；后续不能让她以亲历者身份回忆这场援助。'
