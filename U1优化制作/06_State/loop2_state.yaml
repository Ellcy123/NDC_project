    preconditions_established_on_site:
    - Tommy亲口认当前这只为仿品
    - 所称首次摆放晚于交付
    next_retreat: 撤回古董说法，承认花瓶指本组照片和底片，四千为处理销毁费，价格由Webb定
  - round: 3
    lie: 这张原签写的是Lawson本人；不付款也只是将照片退还他本人。
    lie_source: L2_R3_retreat
    required_setup:
    - Tommy认领这一单、照片底片与这张原寄件签
    - 说明Lawson付款前看过原签：12日前结清销毁，不结按签寄送
    - 将其包装为正常付费处理，并自行坚称收件人就是客户本人
    usable_evidence:
    - '1291'
    evidence_set:
    - '1291'
    result: 客户Lawson与收件人Éléonore不同；Tommy承认第三人收件，结合事前告知和付款条件确认要挟；不靠作废标记独立定案
    proof_boundary: 无需认出亲属关系，不加入贵宾合影额外槽
