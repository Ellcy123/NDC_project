    heading: 5. 搜查受阻：Zack 必须请她帮忙
    line: 387
  source_event: 'Zack 刚结束口头博弈，准备继续检查相机及相关搜查位置，就遇到实际障碍：柜子需要挪动，他一个人没能搬开，只能向 Emma 求助。


    Emma 这次掌握主动，要求 Zack 配合操作。Zack 必须放下得意，听她安排，两人配合完成挪动与后续检查；摄影相关操作也可发挥 Emma 的职业能力。


    必须让玩家实际看见“搬柜子受阻、Emma 帮忙”，供L5开篇电话后正式结伴时回扣。趣味来自刚套完话就需要求助的反差，不把 Zack 写成缺乏基本常识，也不以损坏关键证物制造笑话。


    柜子、相机与照片的精确位置和操作在搜证制作时统一。已冲印照片与机内胶卷分开处理，不能把取出胶卷直接等同于显影完成，也不能提前给出推理结论。'
