player_context:
  goals:
  - 核查Webb账外收入与员工经手的业务
  - 收集照片、账目、花瓶与寄件材料，验证Tommy营业说法
  known_facts:
  - content: Zack受Webb委托担任遗嘱执行人，确保Vivian继承遗产；协议由Zack携带
    truth_status: truth
    source: 案前委托
  - content: Vivian小手枪近期未击发；仅推翻以持枪认定刚射杀Webb的指认，未证明她完全无辜
    truth_status: truth
  - content: Rosa坚持23:30是死亡枪声、紧接玻璃碎裂且当时只有Vivian在里面
    truth_status: unverified_claim
  - content: Zack以遗嘱执行协议争取继续调查，Emma不满被擅自借用记者身份
    truth_status: truth
  new_directions:
  - Webb私人业务及照片中人物
  - 员工工作职责、枪声前后行踪
  - 遗产尚待继承，Rita拟接管与员工处境
  post_expose_knowledge:
  - content: Webb经营私密照片勒索；Tommy说明付款与寄送条件并经手执行
    truth_status: truth
  - content: 私照男子为Lawson Vanderbilt；原签收件人为另一个名字Éléonore Vanderbilt女士，关系未获证物确认
    truth_status: truth
  - content: Zack与Tommy误以为收件人是Lawson妻子
    truth_status: character_misbelief
  - content: James获Zack临时借款并交欠条，Anna有医疗需要；Emma不在场
    truth_status: truth
  - content: James自述23:10—24:00在厨房；小酒保自述22:00—00:00在吧台；酒吧演出由Tommy安排
    truth_status: recorded_claims
  - content: Tommy抽屉曾有一把枪，尚不知物主、口径和故障；Rosa的23:30说法仍未核实
    truth_status: truth
