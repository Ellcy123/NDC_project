player_context:
  goals:
  - 结合实际演出、声音与行踪，选择并指证实际射手
  - 履行与Whale交易以释放Vivian，追查案件背后胁迫
  known_facts:
  - Webb死于胸口中枪；Vivian持有的.25小手枪近期未击发。
  - Webb利用照片从事账外勒索；Tommy经手日常营运与演出联络。
  - 致命枪击早于23:20，不能以23:30枪声定死亡时间。
  - Rosa受女儿性命威胁而诬指Vivian；Emma答应保密。
  - Zack帮助James借款并持有欠条；Emma未亲历。
  - Rosa交出的现场弹壳已在L4拓印，确认.45 ACP。
  - Vivian确有杀意并请求换曲，Tommy经手演出；她认领的射击经过不成立。
  - 23:05门内传来特定喊话，她未入内；23:30再到时Webb已倒下，后听到上方枪声。
  - Vivian只向Tommy透露计划，他也怨恨Webb；只形成调查方向，不直接认定凶手。
  - Morrison无视射击矛盾强押Vivian；幕后关系尚未知。
  - 已取得密码纸条、23:18离室目击及故障枪。
  - 故障枪未见所述试枪痕迹、故障后未击发；Tommy尚未解释活人交枪。
  new_directions:
  - Whale来电的寻物交易
  - Tommy现场行为、James惯用声音、实际节目时段三线交叉
  post_expose_knowledge:
  - James是真正射手，冒充门内声音并制造后续枪响；故障枪不是实际凶器。
  - 后巷得知Whale交易和家庭胁迫，James自杀，Anna获救后在医院。
  - Whale送真凶枪使Vivian获释；Morrison赌债与强押有关。
  - Vivian保留酒吧与员工；柜内照片及唱片碎片揭新线索，Whale真身仍不揭。
