        形式: 独立AVG
        情节点: 病房外担忧与安慰
        地点: 医院走廊、Anna病房门外
        在场人物: Zack、Emma
        进入与接续: 接后巷；两人共同进入Anna病房
    - beat_id: U1L5_narrative_detail_063
      source_anchor: *id063
      requirement: '两人得知 Anna 已经苏醒，来到病房门外。他们知道必须亲口告诉她 James 的死讯，却担忧她无法接受。


        Emma 更直接地说出不安。她想到 Anna 经历的绑架、尚未出生的孩子，以及对方一醒来就可能询问丈夫，迟迟难以迈进病房。


        Zack 自己也在承受死亡的冲击，但先撑住眼前这一步。他安慰 Emma，承担进去告知的责任，让她陪在 Anna 身边。安慰落在两人能够共同做的事情上，不保证 Anna 一定能承受，也不以冷漠或看惯死亡的口吻消解她的担忧。


        两人随后一起进入病房。走廊不再安排翻看欠条、谈借款与归还的戏，欠条保留到 Anna 主动谈起债务时出现。'
