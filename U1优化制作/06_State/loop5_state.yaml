    - Bartender
    required_beats: &id041
    - 承接拘捕紧迫感，小酒保通知神秘来电找两人，不报Whale身份。
    source_anchor: 剧情设计/Unit1/Unit1_逐Loop场景人物证物与指证核对定稿.md
    runtime_exit:
      action: change_scene
      target_scene_id: 1511
      next_talk: L5_opening_office_call
      continuation: next_talk
  - event_id: office_call
    talk: L5_opening_office_call
    scene_id: 1511
    cast:
    - Zack
    - Emma
    - Whale
    required_beats: &id042
    - 接听才揭Whale；专用电话UI，Caseboard关闭。
    - Whale原要求停止调查离开，玩家组织四步判断争取救人机会。
    - 电话挂断关闭UI，同场Zack完整告知交换条件、主动邀Emma查到底。
    - Emma接受并回扣搬柜，交换姓名是重新认识的小仪式，不演此前不知姓名。
    - Emma开始称Zack，Zack仍称O’Malley小姐，承认对自己有点快；正式结伴在开放探索前完成。
    source_anchor: 剧情设计/Unit1/Unit1_逐Loop场景人物证物与指证核对定稿.md
    quiz:
    - id: phone_1
      prompt: Rita收购之外还想拿到什么？
      options:
      - key: 1
        text: 酒吧的营业账目
        correct: false
      - key: 2
        text: Webb留下的勒索材料
        correct: true
      - key: 3
        text: Vivian的私人财物
        correct: false
      wrong_feedback: 留意她没有按交接清单检查哪些东西。
      wrong_next: phone_1
      correct_next: phone_2
      optional_knowledge_locks_options: false
    - id: phone_2
      prompt: 她在替谁寻找这些材料？
      options:
      - key: 1
        text: 自己接手勒索生意
        correct: false
      - key: 2
        text: 警方搜集案件证据
        correct: false
      - key: 3
        text: Whale找回把柄
        correct: true
      wrong_feedback: 区分经营利益与谁急于取回把柄。
      wrong_next: phone_2
      correct_next: phone_3
      optional_knowledge_locks_options: false
    - id: phone_3
      prompt: Webb会把材料藏在哪里？
      options:
      - key: 1
        text: Tommy营业文件柜
        correct: false
      - key: 2
        text: Webb办公室保险柜
        correct: true
      - key: 3
        text: 营业账本
        correct: false
      wrong_feedback: 区分营业材料经手处与私人原件保管处。
      wrong_next: phone_3
      correct_next: phone_4
      optional_knowledge_locks_options: false
    - id: phone_4
      prompt: 手里什么能让Whale愿意谈？
      options:
      - key: 1
        text: 酒吧产权
        correct: false
      - key: 2
        text: 已经听过的完整秘密
        correct: false
      - key: 3
        text: 开保险柜的密码线索
        correct: true
      wrong_feedback: 区分已掌握能力与尚未取得内容。
      wrong_next: phone_4
      correct_next: agreement
      optional_knowledge_locks_options: false
    agreement:
      required_item_ids:
      - 1491
      beats:
      - 第二步答对后Whale回应确认委托Rita收购，不提前点答案。
      - 第三步仅定位最可能藏处，不能声称柜内仍有或载体是唱片。
      - 第四步用密码纸条作筹码，不报密码、不交付尚未取得物件。
      - 同意找到真凶及证据以换Vivian自由，并取得交付其需要的材料。
      failure_policy: 错选留当前电话，提示缺口，不公布答案、不发新证、不永久失败。
    runtime_exit:
      action: change_scene
      target_scene_id: 1517
      continuation: release_to_exploration
      next_talk: null
      locked_scene_after_exit: 1511
      source_note: 办公室电话与结伴结束后退出到既有相邻二楼走廊，再恢复自由控制；仅末段出场动作，不新增剧情事件。
    source_contracts:
    - beat_id: U1L5_confirmed_rule_028
      source_anchor: &id016
        file: 剧情设计/Unit1/Unit1_逐Loop场景人物证物与指证核对定稿.md
        heading: 电话推理的材料前置
        line: 481
      requirement: '- 密码纸条须在L4取得，作为谈判筹码；L5电话期间不能打开Caseboard。

        - 回用L3保管习惯、L4现场观察及Emma转述等信息；可选信息漏看不锁掉正确选项，也不补发证词。

        - Rita判断保留于电话推理。具体选项、谈判过程与信息揭示见双重谋杀方案。'
    - beat_id: U1L5_narrative_detail_061
      source_anchor: &id040
        file: 剧情设计/Unit1/内容修改后的增强情节线.md
        heading: 13. 同一开篇的电话后收尾：正式成为搭档（已确认）
        line: 498
      requirement: '形式：接在同一L5开篇内，电话挂断后关闭专用电话UI，仍在Webb办公室面对面交谈，不单开确立关系的AVG。


        Whale电话谈妥后，两人终于争得最后一次调查机会。Zack把实际交易条件完整告诉Emma，留一个短暂停顿，再主动邀请她一起查到底。此时的邀请是Zack明确承认自己需要她；此前的临时合作在这里成为双方共同选择。邀请、交换姓名与改称呼均在电话结束后、自由调查之前完成。


        Emma 接受，并借机回扣前面的吃瘪：


        > “一直都在等你这句话呢！你这个连柜子都搬不动的侦探要是遇上什么事可咋办啊！”


        这次请求是正式结伴的明确节点。此前借身份、套消息、临时求助的经历，终于落到由 Zack 主动提出、由 Emma 自己答应的合作。


        两人在这里正式交换姓名。即便此前已经知道名字，也作为重新认识、正式成为搭档的小仪式，不演成直到此刻才得知对方是谁。


        Emma 随即开始直接称他 Zack；Zack 仍称她 O’Malley 小姐。被她指出后，他的反应是：


        > “对我来说有点太快了！”


        行动上愿意并肩，称呼上仍慢半拍，保留 Zack 对亲近关系的不习惯。两人随后带着共同目标继续调查，搭档关系不再拖到医院才成立。'
  player_control_restored_after: office_call
  source_contracts:
  - beat_id: U1L5_narrative_event_001
    source_anchor: &id001
      file: 剧情设计/Unit1/内容修改后的增强情节线.md
      heading: L5
      line: 71
    requirement:
      形式: 开篇剧情（固定）
      情节点: 小酒保喊接电话 → Whale电话考验 → Zack与Emma正式结伴
      地点: 歌舞厅（来电通知）→ Webb办公室（谈判与结伴）
      在场人物: Zack、Emma；小酒保进入歌舞厅传话，Whale仅电话声音
      进入与接续: 承接L4拘捕的紧迫感；办公室通话使用专用电话UI，挂断后同场完成邀请、交换姓名与称呼，随后开放自由调查；办公室不因此成为L5自由搜证地点
  - beat_id: U1L5_narrative_detail_060
    source_anchor: &id039
      file: 剧情设计/Unit1/内容修改后的增强情节线.md
      heading: 12. L5开篇：Whale电话考验，争取最后一次调查机会
      line: 490
    requirement: 'L4以歌舞厅押走Vivian收束。L5开篇，两人在歌舞厅尚未缓过神，小酒保进入歌舞厅告知神秘电话找他们两人，催他们去Webb办公室接听；此时不报Whale身份。开篇随两人转到Webb办公室，使用专用电话UI，接听后才揭示来电者。


      Whale原本要求Zack、Emma停止调查、离开；Zack结合此前双方的调查见闻，由玩家在通话中组织判断与筹码，争取查明真凶及证据后释放Vivian。Whale不在开头主动布置查凶任务，两人也没有预先安排这通电话。


      通话时尚未打开保险柜、听到唱片，不提前得知Whale真实身份，不由Emma替玩家说出答案。电话谈妥后同场接正式结伴，开篇整体结束才开放自由调查。'
