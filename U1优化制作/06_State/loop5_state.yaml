    source_contracts:
    - beat_id: U1L5_narrative_event_010
      source_anchor: *id065
      requirement:
        形式: 独立AVG
        情节点: 告知死讯、交还欠条、Anna崩溃与共同追查承诺；Tommy到病房叫两人回酒吧
        地点: Anna病房
        在场人物: Zack、Emma、Anna；Tommy过来叫Zack、Emma回酒吧
        进入与接续: 从告知到Tommy传话都在同一病房AVG完成；安慰与照护后Tommy过来叫两人回酒吧，通知后退场；两人与Anna告别，再回酒吧
    - beat_id: U1L5_narrative_detail_064
      source_anchor: *id066
      requirement: '**告知死讯。** Anna 刚从昏迷中苏醒，孩子尚未出生。面对她对 James 下落的询问，Zack 明确告诉她 James 已死，并简短说明：James 杀了 Webb，之后看见
        Anna 被控制在车里，在胁迫下自杀。Anna 此前不知道丈夫杀人，必须在这里先得到基本事实，后面关于杀人的追问才有来源。叙述不展开血腥细节，不将自杀改成被枪杀，也不以一场案件讲解盖过她的反应。


        **先谈孩子与工作。** Anna 没有立即痛哭，反而询问身体恢复后何时能工作、工作时谁照顾孩子、怎样维持房租和食物。她可以继续问到临时机构照护、日后接回与探望的可能。她急于抓住仍能安排的事情，让生活有一个可以继续往下走的次序。


        这种冷静要有吃力的痕迹，例如没听清回答就接着问下一件事，或反复确认一项已经说过的开支。Emma 原本担心她无法接受，面对这些具体问题反而一时接不上话。可通过 Emma 的反应，或让玩家追问 Anna 的打算，使玩家自然疑惑她为何如此冷静；不直接用旁白解释心理，不让人误以为她毫不在乎丈夫。


        **Anna 提起欠款。** 她想到自己与 James 欠 Zack 的钱，认真表示等以后能够工作，一定归还。她试图把这份还款承诺也放进未来的生活安排里。


        **Zack 交还欠条。** Zack 取出 James 写下的欠条，亲手交给 Anna，表示不需要偿还。他不解释自己的懊悔，只替她卸下眼前能够卸下的一件负担。这里沿用 L2 的借款与欠条，不新增金额、期限或利息，也不把债务作为向遗属追索的要求。


        **欠条触发崩溃。** Anna 接过纸，看见 James 写下的名字，停住，随后慢慢攥紧。她刚才还能安排工作、孩子和还钱，此刻却无法继续把这些话说下去。必须留出接过、看见、停顿再攥紧的时间，避免演成一听免债就感动落泪。


        她终于哭出来，说起被绑走时的恐惧。她不知道自己会被带去哪里，不懂事情为什么变成这样，为什么 James 杀了人，又为什么最后一定要死。话可以断裂、重复，问题不必有条理。她在释放恐惧与悲伤，不负责替玩家总结案件，也不以自己的悲痛抹去
        James 的犯罪责任。


        **Emma 陪伴，Zack 再承诺。** Emma 靠近、安慰 Anna，听她把话说出来，不急着解释案件或继续询问托养。Zack 留在一旁，等她最强烈的一阵情绪过去，再主动承诺他与 Emma 会继续追查，让逼死
        James 的幕后者承担责任。


        两人已经知道 Whale 实施胁迫，承诺应落在追查到底、追究责任，不再把任务说成寻找一个全然未知的凶手。Emma 以看向 Zack、点头等动作接下这份共同承诺，再继续照顾 Anna。


        Anna 不因承诺立即平静，哭泣也不作为主角发表宣言的过场。欠条在交还后留在 Anna 手里，Zack 不收回、不撕毁；它从他保留的借款凭据，变成 Anna 此刻握着的丈夫遗留之物。


        关系变化落在各自承担的行动中：Zack 在走廊接住 Emma 的担忧，Emma 在病房接住 Anna 的崩溃，Zack 再主动以两个人的身份承担继续追查的责任。两人已在L5开篇电话后正式成为搭档，医院不重演劝退或争取留下的矛盾，也不必明说“你没了我不行”。'
    - beat_id: U1L5_narrative_detail_065
      source_anchor: *id067
      requirement: '两人先陪 Anna 待一会儿，等她能够继续交谈，再回应前面提到的孩子、工作与照护问题。她的悲伤不会因此结束，也不要求她马上振作。


        Emma与Zack留在病房，记下需要询问的事项，并向来病房的医院工作人员打听。得到的可以只是有限信息和仍需核实的事项，不凭一次询问解决困境。Anna 尚未办理送养或托养，没有确定的机构接收安排，两人不随口保证探望或团聚条件。


        能做的事务暂告一段落后，Vivian 的处境仍悬着：James 没能活着到案，Whale 是否仍会兑现释放她的约定，两人没有答案。带着这份未解的担忧，衔接 Tommy 到来。


        Tommy 的返店通知发生在告知、欠条崩溃、安慰及共同追查承诺之后，不打断 Anna 最强烈的情绪，也不承担决定 Emma 是否留下的功能。'
    - beat_id: U1L5_narrative_detail_066
      source_anchor: *id068
      requirement: 'Tommy 来到 Anna 病房门边，告诉 Zack、Emma：Vivian 已经获释，请两人回酒吧见面、取得此前约定的 Webb 勒索材料。通知后 Tommy 退场。


        消息带来有限的宽慰，但 James 的死亡与 Anna 的困境仍在。传话发生在安慰、照护之后，与前面的告知同属一个病房 AVG；取消 Vivian 来电和病房接电话安排。'
    - beat_id: U1L5_narrative_detail_067
      source_anchor: *id069
      requirement: 'Zack、Emma 听到 Tommy 的通知后与 Anna 告别；此时尚未得到 Vivian 的照护承诺，不能提前把这份帮助告诉 Anna。


        随后，两人共同返回酒吧。新的消息给他们一件能接着做的事，并不意味着悲伤已经结束。'
