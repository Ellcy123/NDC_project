open_details:
- item: 工作日期与年份
  handling: 照片及寄件采用1928年9月10/11/12日；按制作细节定稿采用1928年日期；72小时已确认，具体起算待定
- item: 枪号与借款金额已定／美术精确坐标仍待核
  handling: 制作细节定稿.md已确定枪号384216与借款20美元；场景坐标仍须结合美术核对。
- item: 小酒保23:18目击站位及记时画面
  handling: 制作核验；只见离开，不变成看到入室或携枪
- item: 现有真相视频适配
  handling: 须覆盖新版掩声时间与取枪支线；不能宣称旧视频已通过
- item: 英语书可选的对白措辞
  handling: 按用户覆盖分支；无书不凭空指认，逃跑与结尾照常
runtime_dependencies:
- key: doubt_conditions
  status: special_adapter
  contract: 可显示前两项，第三项visible:false但参与全部AND；visible不是Unity正式字段，须UI适配，不能删掉隐藏条件。type1=物品、type3=时间线验证、type4=直接收录证词。
- key: analysis_condition_compatibility
  status: special_adapter
  contract: 1201→1706、1101→1711替换背包原件；HasItem兼容派生，但Doubt全量重检当前仅遍历实际ID；必须补原物条件兼容重检及读档一致性。
- key: scene_events
  status: existing_item_and_only
  contract: SceneEnterTalkTriggerConfig只支持requiredItemIds全AND和一次性；Talk完成/前事件完成条件需special_adapter，不把普通点击争执升级条件链。
- key: dual_suspects
  status: special_adapter
  contract: L5单Chapter的Tommy/James两套指证路由；错误线完成后恢复选人前状态、保留材料、不继承错误线知识与完成标记。
- key: locked_ending_resume
  status: existing_runtime_requires_integration_verification
  contract: L5正确线postExpose→后巷→医院门外→病房→大厅→Webb办公室；持续锁定，跨场续播点优先于initTalk恢复；不另生成探索入口。
- key: five_loop_end
  status: table_migration_pending
  contract: GameFlowConfig Unit1 loopCount=5；终点loop_end+chapter_boundary:true，旧106不再可达；不使用不存在的chapter_end。
