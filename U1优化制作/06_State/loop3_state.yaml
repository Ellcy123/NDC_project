- beat_id: U1L3_narrative_detail_064
  source_anchor:
    file: 剧情设计/Unit1/内容修改后的增强情节线.md
    heading: 8. Rosa 的困境：Emma 主动保密
    line: 422
  source_text: '剧情备注：Rosa要求保密及两人的承诺只用于人物与情节表现，不属于推理配置，不限制既定弹壳使用，不新增疑点、取证或指证条件。


    Zack 击破 Rosa 的谎言后，Rosa 对女儿安全的恐惧仍在。查出真相不代表她敢公开改口，记者在场更会加重顾虑。


    Zack 此刻才真正担忧：这个一直追逐真相的记者，会不会把内容报道出去，让 Rosa 与女儿陷入危险？


    Emma 却主动答应保密，以收起记录等明确动作表示不会为了报道公开 Rosa 的处境。她的承诺不以换取勒索材料为条件。


    两人都承诺保护她与女儿之后，Rosa 才继续说明秘密经过。保密既推进了询问，也让 Zack 修正对 Emma 的判断。'
  state_path: expose.post_expose.required_beats
  mapping: exact
