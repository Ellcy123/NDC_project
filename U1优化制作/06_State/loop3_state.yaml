- beat_id: U1L3_narrative_detail_061
  source_anchor:
    file: 剧情设计/Unit1/内容修改后的增强情节线.md
    heading: L3 开篇：Morrison 告知放人，约 Zack 在大厅详谈
    line: 405
  source_text: 'Morrison 告诉 Zack，Vivian 和 Rosa 已经被放出来，但他不知道 Rosa 现在去了哪里。眼下所在的地方不方便详细聊案情，因此让 Zack 稍后到酒吧大厅找他，有什么细节在那里谈。地点沿正式版开篇落在酒吧一楼走廊，之后转到大厅详谈。


    进入自由探索后，Morrison 固定在大厅接受询问，提供原有现场勘验信息。开篇只交代放人、Rosa 去向不明与大厅碰面的约定，不一次讲完勘验证词。玩家因此知道仍可向这名警察核实案情，为后续对其处理方式的信任及 L4
    翻脸保留基础，不提前暗示 Whale 已收买他。


    医院地址仍由 Zack 在清洁间找到 Isabel 医疗单后获知，Morrison 不直接告知医院或病房。Vivian 在 L3 化妆间可供询问；Rosa 已离开酒吧，玩家需自行追查。Emma 不在此完成入队：生日吊坠移至医院病房后，玩家先到医院调查，再回清洁间开箱，才触发她跟踪现身、争取同行的事件。'
  state_path: opening.sequence[0]
  mapping: merged
  merged_with: U1L3_narrative_event_001
- beat_id: U1L3_narrative_detail_062
  source_anchor:
    file: 剧情设计/Unit1/内容修改后的增强情节线.md
    heading: 医院夫妻问路：发现就在隔壁的轻喜剧
    line: 413
  source_text: 'L3 玩家通过医院走廊中 James、Anna 共用的交谈入口问路。Zack 没找着医疗单上的病房号，夫妻帮他查看，向他指出目的地恰好就在他们病房旁边。用户指定的语气锚点为：“哎呀，这不是就在我们病房旁边的那个病房吗！”具体由夫妻中的谁接话留正式对白制作，不新增独立突发事件。


    喜剧感来自认真找路后发现目的地近在身边的巧遇。玩家在问路中听到夫妻认出相邻病房，不提前点破James已知情；不把 Zack 写成看不懂数字，也不以病情或孩子的处境取笑。对话完成后解锁从走廊前往 Isabel 病房的入口，两人仍驻场、可重复交谈。这段只建立亲近感与路线衔接，不新增收录证词，不作为
    James 知情的嫌疑提示。'
