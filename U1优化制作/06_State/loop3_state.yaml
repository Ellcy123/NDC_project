player_context:
  goals:
    primary: 核对Rosa所说23:30枪声与真实枪击时序，查清她为何指认Vivian。
    secondary:
    - 向Morrison核实勘验
    - 找到已离开酒吧的Rosa
    - 调查玻璃与垃圾的先后关系
  known_facts:
  - Webb死于会客室、胸口中枪；Rosa指认现场持枪的Vivian。
  - Vivian的.25小手枪近期未开火，推翻持枪即刚杀人的指认，不能宣告她无辜。
  - Rosa仍声称23:30是死亡枪声，随后玻璃碎裂且当时里面只有Vivian，尚未反驳。
  - Zack受Webb委托保障Vivian继承，据此争取调查并阻止Rita仓促接管。
  - Webb用私照经营勒索，Tommy说明条件并经手执行；未确定他策划整个网络。
  - 私照男子是Lawson Vanderbilt；Éléonore Vanderbilt女士与他同姓但关系未确认，Zack与Tommy误认妻子不是客观事实，Emma未自动获知。
  - Zack为Anna医疗需求向James垫款，取得欠条；Emma未亲历。
  - James自述23:10—24:00厨房未离开；小酒保自述22:00—24:00吧台未离岗。
  - 演出由Tommy联系安排；他负责账目、排班、库存、日常运转。
  - 开场Morrison告知Vivian与Rosa已释放，不知Rosa去向，约在大厅详谈。
  new_directions:
  - 大厅核实勘验
  - 清洁间个人物品寻找Rosa去向
  - 会客室核对破窗
  post_expose_knowledge:
  - 致命枪击早于23:20，尚不能锁定23:00—23:10。
  - Rosa因女儿性命被威胁而作伪证，匿名威胁者仍未知。
  - Rosa交出现场捡走留作自保的弹壳，口径及来源待L4检查拓印。
  - Emma已同行并主动保密，Zack对她改观但尚未正式认可搭档。
  optional_knowledge:
  - 若询问Vivian，得知22:00—23:00演出和通常23:30送酒。
  - 若问保管习惯，得知重要私人材料一般在办公室保险柜；不确认具体内容、开柜能力。
  - only_if: L2抽屉点击及Tommy制止事件已完成
    fact: Zack瞥见Tommy抽屉一把枪后被制止，抽屉锁起；不知来历、故障与用途。
