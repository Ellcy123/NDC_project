    heading: 7. 清洁间解谜后发现跟踪，默许同行
    line: 418
  source_text: 清洁间解谜后，Zack发现Emma跟踪而来，她坚持参与，他仍有保留但最终默许。此时只是允许同行；她随后参与Rosa的询问与保密承诺，不以亲历者口吻谈自己未在场的医院初次问话。正式认可搭档关系留L5开篇电话后。
