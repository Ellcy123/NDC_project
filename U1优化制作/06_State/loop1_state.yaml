  source_event: '枪声将事件推向犯罪现场。面对 Webb 的尸体、持枪的 Vivian 与 Morrison 的阻拦，Zack 的私家侦探身份反而招来怀疑。


    Zack 临时借用 Emma 的记者身份，把自己说成她的助手，应对 Morrison。这个主意由 Zack 主动使出，Emma 没有事先答应替他承担这种关系。


    案件推进仍依靠后续枪械与现场核查。记者助手身份只承担现场周旋的作用，不变成自动获得搜查权的通行证。


