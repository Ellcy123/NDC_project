    source_contracts:
    - beat_id: U1L4_narrative_event_001
      source_anchor: &id001
        file: 剧情设计/Unit1/内容修改后的增强情节线.md
        heading: L4
        line: 55
      requirement:
        形式: 开篇剧情（固定）
        情节点: Zack主动分享，Emma解释帮助Rosa的原因；两人分工
        地点: 酒吧大厅一侧
        在场人物: Zack、Emma
        进入与接续: 沿正式版L4开篇大厅地点；Emma离开查Rita，结束后衔接本轮大厅首次进入事件
  - event_id: confession_deadline
    talk: L4_lobby_confession_deadline
    scene_id: 1404
    cast:
    - Zack
    - Morrison
    required_beats: &id092
    - 小酒保不在；Morrison让Zack照自创配方调酒又嫌难喝。
    - 随后告知Vivian认罪并要求最后核查；用户已确认调查期限72小时，强调约定期限将至；起算与跨日未统一前不写具体剩余小时，不新增实时倒计时。
    - Zack不能公开Rosa秘密作反驳；Morrison允许核查后必须回来。
    source_anchor: 剧情设计/Unit1/Unit1_逐Loop场景人物证物与指证核对定稿.md
    runtime_binding:
      type: chained_talk
      from_talk: L4_opening_lobby_sharing
      independent_first_enter: false
    runtime_exit:
      action: release_to_exploration
    source_contracts:
    - beat_id: U1L4_narrative_event_002
      source_anchor: &id002
        file: 剧情设计/Unit1/内容修改后的增强情节线.md
        heading: L4
        line: 56
      requirement:
        形式: 突发事件（进场事件）
        情节点: Morrison让Zack按自创配方调酒又嫌难喝，随后告知Vivian认罪与核查期限
        地点: 同一大厅吧台
        在场人物: Zack、Morrison；小酒保不在
        进入与接续: 若开篇已在大厅，就在开篇结束后接本事件，无须出去再进；结束后Morrison驻场供点击询问
    - beat_id: U1L4_narrative_detail_095
      source_anchor: &id089
        file: 剧情设计/Unit1/内容修改后的增强情节线.md
        heading: 首次进入大厅：认罪消息与最后核查期限
        line: 448
      requirement: 'L4 开篇 Zack 主动分享线索、Emma 解释保密原因之后，两人开始合作调查；正式搭档认可放在L5开篇电话结束后。玩家本轮首次进入大厅，触发前台碰面的进场事件。小酒保不在，Morrison抱怨酒不够喝，让Zack按自己发明的配方调一杯；Zack照配方调完，他喝了又嫌Zack调得难喝。这个短喜剧结束后，Morrison告知Vivian已经认罪，倾向于据此结束案件。调酒作为本段剧情动作呈现。


        Zack 要先核查 Vivian 的说法，不能以 Rosa 的秘密供述公开反驳。Morrison 允许他作最后一次核查，但强调约定的调查期限将至，核查完成必须回来给出结果，说明认罪是否成立，不能继续无限拖延。用户提出的“72
        小时要过了”作为时长意向，待原案起算点与当前时间核实后再落具体数字；当前统一使用“约定的调查期限将至”。不新增实时倒计时机制。


        此处只交代认罪与期限，不提前复述 Vivian 的枪械来源、演出准备、Tommy 参与或完整案发经历。自动对话结束后恢复自由探索，Morrison 留在大厅可重复询问。喝酒、看报可以保留，谈话重心改为核查与结案，不再安排赌马闲谈。


        玩家此时既要查明 Vivian 真正做了什么，又要在期限内带回能阻止错误结案的证据。Morrison 此时仍允许核查，和本轮后段面对反证却强押她形成递进；前段不直接解释他受 Whale 控制。'
  player_control_restored_after: confession_deadline
  boundary_note: 第二段承载已确认大厅首入事件；由开篇唯一续接，不须出去再进，不再登记firstEnterTalk。
