player_context:
  goals:
  - 核查Vivian认罪是否符合枪械和现场事实
  - 查明枪的来源及演出变更经手，带回阻止草率结案的依据
  known_facts:
  - Webb死于胸口中枪；Vivian持有的.25小手枪近期未击发。
  - Webb利用照片从事账外勒索；Tommy经手日常营运与演出联络。
  - 致命枪击早于23:20，不能以23:30枪声定死亡时间。
  - Rosa受女儿性命威胁而诬指Vivian；Emma答应保密。
  - Zack帮助James借款并持有欠条；Emma未亲历。
  - Rosa已亲手交出现场弹壳，尚未完成本轮口径拓印。
  new_directions:
  - 核查认罪枪械、演出申请及Tommy现场行动
  - 调查Rita私搜；保存密码线索供后续谈判
  post_expose_knowledge:
  - Vivian确有杀意并请求换曲，Tommy经手演出；她认领的射击经过不成立。
  - 23:05门内传来特定喊话，她未入内；23:30再到时Webb已倒下，后听到上方枪声。
  - Vivian只向Tommy透露计划，他也怨恨Webb；只形成调查方向，不直接认定凶手。
  - Morrison无视射击矛盾强押Vivian；幕后关系尚未知。
