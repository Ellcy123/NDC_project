- key: analysis_condition_compatibility
  status: special_adapter
  contract: 1201→1706、1101→1711替换背包原件；HasItem兼容派生，但Doubt全量重检当前仅遍历实际ID；必须补原物条件兼容重检及读档一致性。
- key: scene_events
  status: existing_item_and_only
  contract: SceneEnterTalkTriggerConfig只支持requiredItemIds全AND和一次性；Talk完成/前事件完成条件需special_adapter，不把普通点击争执升级条件链。
- key: dual_suspects
  status: special_adapter
  contract: L5单Chapter的Tommy/James两套指证路由；错误线完成后恢复选人前状态、保留材料、不继承错误线知识与完成标记。
- key: locked_ending_resume
  status: existing_runtime_requires_integration_verification
  contract: L5正确线postExpose→后巷→医院门外→病房→大厅→Webb办公室；持续锁定，跨场续播点优先于initTalk恢复；不另生成探索入口。
- key: five_loop_end
  status: table_migration_pending
  contract: GameFlowConfig Unit1 loopCount=5；终点loop_end+chapter_boundary:true，旧106不再可达；不使用不存在的chapter_end。
ending_sequence:
  type: locked_sequence
  entry_from: L4_post_expose_true_account
  player_control: false
  scenes:
  - event_id: morrison_turn
    talk: L4_post_lobby_turn
    scene_id: 1424
    cast:
    - Zack
    - Emma
    - Morrison
    required_beats: *id100
    source_anchor: 剧情设计/Unit1/Unit1_逐Loop场景人物证物与指证核对定稿.md
    runtime_exit:
      action: change_scene
      target_scene_id: 1425
      next_talk: L4_post_arrest
      continuation: next_talk
    source_contracts:
    - beat_id: U1L4_narrative_event_010
      source_anchor: *id101
      requirement:
        形式: 独立AVG
        情节点: 向Morrison说明核查结果，弹壳引出态度转折
        地点: 酒吧大厅
        在场人物: Zack、Emma、Morrison
        进入与接续: 衔接Vivian指证后交代；本场完成Morrison转折，随后到歌舞厅押人
    runtime_binding:
      type: chained_talk
      from_talk: L4_post_expose_true_account
  - event_id: arrest
    talk: L4_post_arrest
    scene_id: 1425
    cast:
    - Zack
    - Emma
    - Morrison
    - Vivian
    required_beats: *id102
    source_anchor: 剧情设计/Unit1/Unit1_逐Loop场景人物证物与指证核对定稿.md
    runtime_exit:
      action: loop_end
      chapter_boundary: false
    source_contracts:
    - beat_id: U1L4_narrative_event_011
      source_anchor: *id103
      requirement:
        形式: 独立AVG
        情节点: Morrison强押，Emma挡路，Zack担责，Vivian托付
        地点: 歌舞厅
        在场人物: Zack、Emma、Morrison、Vivian；小酒保不在
        进入与接续: 接大厅Morrison转折AVG；以Vivian被带走收束L4
    runtime_binding:
      type: chained_talk
      from_talk: L4_post_lobby_turn
  source_contracts:
  - beat_id: U1L4_narrative_detail_097
    source_anchor: *id104
    requirement: '形式：先是大厅的Morrison转折场景AVG，再是歌舞厅的强押场景AVG；均由指证后固定续接，中间不恢复自由探索。


      Vivian在歌舞厅完成指证后的真实见闻交代。Zack与Emma到大厅向Morrison说明核查结果，弹壳引出其态度转折；Vivian不随同去大厅。这是独立的Morrison转折AVG。随后转到歌舞厅，Morrison仍要押走Vivian，强调核查机会已经给过，以催她离开结束谈话；以下阻拦与托付均发生在歌舞厅。


      Emma要求他回应射击经过的矛盾；见他不回答便要带人，一急跨到出口方向挡路。这里延续Webb办公室里的性格：她发现问题准确，却急于逼对方立即回应。Morrison警告再阻拦就连她一起带走，伸手抓她。


      Zack把Emma拉到身后，站进两人之间，伸出双手等铐，主动承担她的风险。这个动作回收L1擅自借用她身份的欠账；不靠身份豁免、幕后关系或预先安排的电话使Morrison退让。


      Vivian主动走向出口，愿意跟Morrison走，但回头请求两人继续调查。Emma让开，Zack也收住动作；原本的阻拦解除，Morrison能够带走Vivian，便顺势结束与二人的冲突。她从接受认罪转为主动托付查明真相；人仍被带走，救人失败的结果保留。


      共同出场不以读完Emma的Rita见闻为前置。已在办公室约好同行时正常承接约定；若玩家漏掉办公室交谈，进入收尾时补一个Emma加入同行、Zack应允的简短动作，不引用未发生的约定，不补发或补讲漏读材料。


      本场不揭露Morrison与Whale的关系。Emma不因被保护而收起脾气；Zack愿意共同承担，却不在此承诺信息完全透明，也不解决替她决定或过滤真相的长期问题。具体逐句对白与正式配置另行制作。'
