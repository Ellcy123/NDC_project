      requirement: '1. 她先说清真正经历：23:05 敲门，听见门内“Do not be bothering me!”后离开，并未进去；23:30 再入时 Webb 已经倒下，随后听到的枪声来自头顶二楼。隔门见闻按既定安排收录，供
        L5 回用；门内说话者尚未确定。

        2. 原先“是我杀的人”不成立，她才开始考虑别人如何利用这场计划。此时首次坦白，她只把杀人计划告诉过 Tommy；他也怨恨 Webb。这比第二轮承认普通经手多了一层关键信息。

        3. 她进一步猜测，二楼那声枪响会不会是 Tommy 制造的，目的是让持枪抵达现场的自己被认成凶手。她说明两人很早以前有过纠葛，此后不再一条心，但不展开事件经过。这里的旧怨是她怀疑对方的原因，不是 Tommy
        实施犯罪的证据。

        4. Zack 只在内心想起 Tommy 曾关心 Vivian 的处境，注意到两人的态度对不上。不当面告诉 Vivian，不用这句话替 Tommy 排除嫌疑或逼她回答。

        5. 接回 Morrison 强押 Vivian 的既定冲突。她已不再一心认罪，主动请求 Zack、Emma 查明真相；L5开篇先经Whale电话争取继续调查，再正式结伴。


        这个转变必须发生在证据击破之后：她先想独自认罪、不牵连 Tommy；随后发现自己的认罪解释不成立，旧怨才让她转而怀疑他。不能在前段就把她写成一面确信 Tommy 栽赃自己，一面无缘由地替他隐瞒。'
