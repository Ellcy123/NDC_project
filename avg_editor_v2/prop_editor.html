<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDC · 道具摆放器</title>
    <style>
        :root { --bg:#0d100f; --panel:#151a18; --panel-2:#1c221f; --line:#343c37; --gold:#c5a35d; --gold-bright:#e0c57d; --paper:#e9dfc9; --muted:#8d968f; --green:#7ea87e; --danger:#bd6b61; --shadow:0 18px 50px rgba(0,0,0,.42); }
        * { box-sizing:border-box; } html,body { width:100%; height:100%; margin:0; overflow:hidden; }
        body { background:var(--bg); color:var(--paper); font:13px "Segoe UI","Microsoft YaHei",sans-serif; }
        button,input { font:inherit; } button { color:inherit; }
        .app { height:100%; display:grid; grid-template-rows:58px 1fr 28px; }
        .topbar { z-index:5; display:flex; align-items:center; gap:14px; padding:0 18px; background:linear-gradient(180deg,#202721,#161b18); border-bottom:1px solid #3a403b; box-shadow:0 5px 24px rgba(0,0,0,.25); }
        .back { padding:7px 10px; color:var(--muted); text-decoration:none; border:1px solid var(--line); border-radius:4px; white-space:nowrap; }
        .back:hover { color:var(--gold-bright); border-color:var(--gold); }
        .title-block { min-width:250px; } .title { font:18px Georgia,serif; letter-spacing:.08em; } .subtitle { margin-top:2px; color:var(--muted); font-size:11px; }
        .top-actions { display:flex; gap:8px; margin-left:auto; }
        .btn { padding:8px 12px; border:1px solid var(--line); border-radius:4px; background:#232a26; cursor:pointer; transition:.15s ease; white-space:nowrap; }
        .btn:hover { color:var(--gold-bright); border-color:var(--gold); } .btn.primary { color:#fff8e5; background:#746037; border-color:#a1874b; } .btn.primary:hover { background:#8b7340; } .btn:disabled { opacity:.38; cursor:default; }
        .workspace { min-height:0; display:grid; grid-template-columns:340px 1fr; } .controls { min-height:0; padding:16px; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); }
        .section { padding:13px; margin-bottom:14px; background:var(--panel-2); border:1px solid var(--line); border-radius:6px; }
        .section-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:11px; color:var(--gold-bright); font:12px Georgia,serif; letter-spacing:.08em; text-transform:uppercase; }
        .source-name { display:block; margin-bottom:8px; color:var(--muted); font-size:11px; line-height:1.45; overflow-wrap:anywhere; }
        .file-label { display:inline-block; padding:7px 9px; color:#c5cec7; border:1px dashed #59625c; border-radius:4px; cursor:pointer; } .file-label:hover { color:var(--gold-bright); border-color:var(--gold); } input[type=file] { display:none; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:9px; } .field { display:grid; gap:5px; } .field label { color:var(--muted); font-size:11px; }
        .field input[type=number] { width:100%; padding:8px; color:var(--paper); outline:none; background:#101411; border:1px solid var(--line); border-radius:4px; } .field input:focus { border-color:var(--gold); box-shadow:0 0 0 2px rgba(197,163,93,.12); }
        .range-row { display:grid; grid-template-columns:1fr 58px; gap:9px; align-items:center; } input[type=range] { width:100%; accent-color:var(--gold); } .percent { padding:6px; color:var(--gold-bright); text-align:center; background:#101411; border:1px solid var(--line); border-radius:4px; }
        .metrics { margin-top:10px; padding-top:9px; color:var(--muted); font:11px/1.7 Consolas,monospace; border-top:1px solid var(--line); } .hint { margin:0; color:var(--muted); font-size:11px; line-height:1.6; } kbd { padding:1px 4px; color:#d5ddd6; background:#252c28; border:1px solid #4a534d; border-bottom-width:2px; border-radius:3px; }
        .layer-list { display:grid; gap:6px; max-height:302px; overflow-y:auto; padding-right:2px; } .layer-row { display:grid; grid-template-columns:28px 1fr auto; align-items:center; gap:7px; padding:7px; color:#c9d0ca; background:#131815; border:1px solid #303832; border-radius:4px; cursor:pointer; } .layer-row:hover { border-color:#697061; } .layer-row.active { color:#fff6df; background:#302c20; border-color:var(--gold); box-shadow:inset 3px 0 0 var(--gold); } .layer-row.hidden { opacity:.48; }
        .eye,.layer-mini { width:25px; height:25px; padding:0; color:#bbc4bc; background:#202721; border:1px solid #485149; border-radius:3px; cursor:pointer; } .eye:hover,.layer-mini:hover { color:var(--gold-bright); border-color:var(--gold); } .layer-info { min-width:0; } .layer-name { overflow:hidden; color:inherit; font-size:12px; text-overflow:ellipsis; white-space:nowrap; } .layer-type { margin-top:2px; color:var(--muted); font-size:10px; } .layer-actions { display:flex; gap:3px; } .selected-chip { display:inline-flex; max-width:184px; padding:3px 6px; overflow:hidden; color:#c9d4cb; font:10px Consolas,monospace; text-overflow:ellipsis; white-space:nowrap; background:#101411; border:1px solid #303832; border-radius:3px; }
        .stage-area { position:relative; min-width:0; min-height:0; background:#090b0a; } .stage-toolbar { position:absolute; z-index:4; top:14px; left:18px; display:flex; align-items:center; gap:8px; padding:7px 9px; background:rgba(18,23,20,.9); border:1px solid rgba(197,163,93,.28); border-radius:5px; box-shadow:var(--shadow); backdrop-filter:blur(8px); } .stage-toolbar .btn { padding:5px 8px; } .zoom-readout { min-width:42px; color:var(--gold-bright); text-align:center; }
        .viewport { position:absolute; inset:0; padding:70px 56px 56px; overflow:auto; background-color:#101412; background-image:linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.025) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.025) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.025) 75%); background-size:26px 26px; background-position:0 0,0 13px,13px -13px,-13px 0; }
        .plane-shell { position:relative; margin:0 auto; } .scene-plane { --inv-zoom:1; position:absolute; top:0; left:0; transform-origin:top left; box-shadow:0 30px 80px rgba(0,0,0,.58); user-select:none; } #sceneCanvas { display:block; cursor:crosshair; background:#000; }
        .selection { position:absolute; border:calc(1.5px * var(--inv-zoom)) solid var(--gold-bright); box-shadow:0 0 0 calc(1px * var(--inv-zoom)) rgba(0,0,0,.65),inset 0 0 0 calc(1px * var(--inv-zoom)) rgba(0,0,0,.38); cursor:move; touch-action:none; } .selection::before { content:attr(data-label); position:absolute; top:calc(-24px * var(--inv-zoom)); left:0; height:calc(20px * var(--inv-zoom)); padding:0 calc(7px * var(--inv-zoom)); color:#11140f; font-size:calc(10px * var(--inv-zoom)); line-height:calc(20px * var(--inv-zoom)); letter-spacing:.08em; white-space:nowrap; background:var(--gold); }
        .handle { position:absolute; width:calc(13px * var(--inv-zoom)); height:calc(13px * var(--inv-zoom)); background:var(--gold-bright); border:calc(1px * var(--inv-zoom)) solid #24271f; border-radius:50%; touch-action:none; } .handle[data-handle=nw] { top:0; left:0; cursor:nwse-resize; transform:translate(-50%,-50%); } .handle[data-handle=ne] { top:0; right:0; cursor:nesw-resize; transform:translate(50%,-50%); } .handle[data-handle=sw] { bottom:0; left:0; cursor:nesw-resize; transform:translate(-50%,50%); } .handle[data-handle=se] { right:0; bottom:0; cursor:nwse-resize; transform:translate(50%,50%); }
        .statusbar { display:flex; align-items:center; gap:18px; padding:0 12px; color:var(--muted); font-size:11px; background:#121613; border-top:1px solid var(--line); } .statusbar .ok { color:var(--green); } .statusbar .dirty { color:var(--gold-bright); } .statusbar .right { margin-left:auto; font-family:Consolas,monospace; }
        .toast { position:fixed; z-index:20; right:20px; bottom:42px; max-width:360px; padding:11px 14px; color:#f4eedf; pointer-events:none; background:#27312b; border:1px solid var(--gold); border-radius:5px; box-shadow:var(--shadow); opacity:0; transform:translateY(10px); transition:.2s ease; } .toast.show { opacity:1; transform:translateY(0); }
        @media (max-width:900px) { .workspace { grid-template-columns:285px 1fr; } .topbar { gap:8px; padding:0 10px; overflow-x:auto; } .title-block { min-width:0; } .subtitle { display:none; } .top-actions { gap:5px; } .top-actions .btn { padding:6px 8px; } }
    </style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <a class="back" href="index.html">← 返回编辑器</a>
        <div class="title-block"><div class="title">道具摆放器</div><div class="subtitle">PROP COMPOSITOR · 8 个独立图层，设计期中间态</div></div>
        <div class="top-actions"><button class="btn" id="undoBtn" type="button">撤销</button><button class="btn" id="resetBtn" type="button">重置八层</button><button class="btn" id="exportJsonBtn" type="button">导出摆放 JSON</button><button class="btn primary" id="exportPngBtn" type="button">导出拼合 PNG</button></div>
    </header>
    <main class="workspace">
        <aside class="controls">
            <section class="section"><div class="section-title"><span>01 · 清理底图</span><span id="baseSize">—</span></div><span class="source-name" id="baseName">正在载入默认底图…</span><label class="file-label">更换底图<input id="baseFile" type="file" accept="image/png,image/jpeg,image/webp"></label></section>
            <section class="section"><div class="section-title"><span>02 · 8 个独立图层</span><span id="layerCount">0 / 8</span></div><div class="layer-list" id="layerList"></div><div style="height:10px"></div><span class="source-name" id="selectedSource">请选择图层</span><label class="file-label">替换选中透明 PNG<input id="propFile" type="file" accept="image/png,image/webp"></label></section>
            <section class="section"><div class="section-title"><span>03 · 选中图层</span><span class="selected-chip" id="selectedChip">—</span></div><div class="grid-2"><div class="field"><label for="xInput">X（原图像素）</label><input id="xInput" type="number" step="1"></div><div class="field"><label for="yInput">Y（原图像素）</label><input id="yInput" type="number" step="1"></div></div></section>
            <section class="section"><div class="section-title"><span>04 · 尺寸</span><span>等比例</span></div><div class="range-row"><input id="scaleRange" type="range" min="10" max="300" value="100" step="1"><div class="percent" id="scaleReadout">100%</div></div><div class="grid-2" style="margin-top:10px"><div class="field"><label for="widthInput">宽度</label><input id="widthInput" type="number" min="1" step="1"></div><div class="field"><label for="heightInput">高度</label><input id="heightInput" type="number" min="1" step="1"></div></div><div class="metrics" id="metrics">等待素材…</div></section>
            <section class="section"><div class="section-title"><span>操作</span><span>快捷键</span></div><p class="hint">点击左侧图层或画面中的道具以选中。拖动金色选框移动，拖动四角等比例缩放。<br><kbd>方向键</kbd> 1 像素；<kbd>Shift</kbd> + <kbd>方向键</kbd> 10 像素；<kbd>Ctrl</kbd> + <kbd>Z</kbd> 撤销。</p></section>
        </aside>
        <section class="stage-area"><div class="stage-toolbar"><button class="btn" id="zoomOutBtn" type="button">−</button><span class="zoom-readout" id="zoomReadout">100%</span><button class="btn" id="zoomInBtn" type="button">＋</button><button class="btn" id="fitBtn" type="button">适应窗口</button></div><div class="viewport" id="viewport"><div class="plane-shell" id="planeShell"><div class="scene-plane" id="scenePlane"><canvas id="sceneCanvas"></canvas><div class="selection" id="selection" hidden><i class="handle" data-handle="nw"></i><i class="handle" data-handle="ne"></i><i class="handle" data-handle="sw"></i><i class="handle" data-handle="se"></i></div></div></div></div></section>
    </main>
    <footer class="statusbar"><span id="loadStatus">正在载入默认案例…</span><span id="dirtyStatus" class="ok">未修改</span><span class="right" id="cursorStatus">X — · Y —</span></footer>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
    'use strict';
    const BASE_SOURCE='/ProjectImage/Art/Scene/Backgrounds/SC4003_courthouse_archive_day_clean_plate_v03.png';
    const ASSET_ROOT='/ProjectImage/Art/Scene/EVIDENCE/EPI04/CourthouseArchive/';
    const DEFAULT_LAYERS=[
        {id:'archive_index_drawer',name:'案号卡抽屉',type:'可互动 · 环境检视',source:'prop_archive_index_drawer_open_lit_rgba_v02.png',x:287,y:573,targetWidth:126},
        {id:'env_bankers_lamp',name:'绿罩银行灯',type:'环境 · 不可点击',source:'prop_env_bankers_lamp_lit_rgba_v02.png',x:584,y:594,targetWidth:151},
        {id:'item_4115',name:'4115 Harrison 调阅索引',type:'可互动 · 证据',source:'prop_4115_archive_checkout_ledger_lit_rgba_v02.png',x:694,y:618,targetWidth:272},
        {id:'item_4114',name:'4114 圣心医院资助卷宗',type:'可互动 · 证据',source:'prop_4114_sacred_heart_funding_file_lit_rgba_v03.png',x:1398,y:491,targetWidth:77},
        {id:'item_4116',name:'4116 Mary / Helen 往来信',type:'可互动 · 证据',source:'prop_4116_mary_helen_correspondence_lit_rgba_v02.png',x:932,y:583,targetWidth:129},
        {id:'old_case_directory',name:'旧案目录夹',type:'可互动 · 环境检视',source:'prop_archive_old_case_directory_lit_rgba_v03.png',x:1059,y:586,targetWidth:161},
        {id:'harrison_file_tray',name:'Harrison 调阅文件托盘',type:'可互动 · 环境检视',source:'prop_harrison_retrieval_file_tray_lit_rgba_v02.png',x:-70,y:162,targetWidth:334,visible:false},
        {id:'env_service_telephone',name:'黑色服务电话',type:'环境 · 不可点击',source:'prop_env_archive_service_telephone_lit_rgba_v02.png',x:1145,y:473,targetWidth:45}
    ];
    const $=id=>document.getElementById(id);
    const els={canvas:$('sceneCanvas'),plane:$('scenePlane'),shell:$('planeShell'),viewport:$('viewport'),selection:$('selection'),x:$('xInput'),y:$('yInput'),width:$('widthInput'),height:$('heightInput'),scale:$('scaleRange'),scaleReadout:$('scaleReadout'),metrics:$('metrics'),baseFile:$('baseFile'),propFile:$('propFile'),baseName:$('baseName'),baseSize:$('baseSize'),layerList:$('layerList'),layerCount:$('layerCount'),selectedSource:$('selectedSource'),selectedChip:$('selectedChip'),zoomReadout:$('zoomReadout'),loadStatus:$('loadStatus'),dirtyStatus:$('dirtyStatus'),cursorStatus:$('cursorStatus'),undoBtn:$('undoBtn'),toast:$('toast')};
    const ctx=els.canvas.getContext('2d');
    const state={zoom:1,activeId:'item_4115',dirty:false};
    const base={image:null,source:BASE_SOURCE,label:imageName(BASE_SOURCE)};
    const layers=DEFAULT_LAYERS.map((spec,index)=>Object.assign({},spec,{order:index,image:null,shadowImage:null,alphaBounds:null,defaultScale:1,scale:1,visible:spec.visible ?? true,source:ASSET_ROOT+spec.source,sourceLabel:spec.source,shadow:spec.shadow?ASSET_ROOT+spec.shadow:null}));
    let history=[],interaction=null,toastTimer=null;
    function imageName(src){return src&&src.startsWith('blob:')?'本地导入素材':decodeURIComponent((src||'').split('/').pop()||src||'—');}
    function loadImage(src){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('无法载入图片：'+src));image.src=src;});}
    function visibleAlphaBounds(image){const c=document.createElement('canvas');c.width=image.naturalWidth;c.height=image.naturalHeight;const cctx=c.getContext('2d',{willReadFrequently:true});cctx.drawImage(image,0,0);const data=cctx.getImageData(0,0,c.width,c.height).data;let left=c.width,top=c.height,right=-1,bottom=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){if(data[(y*c.width+x)*4+3]>10){if(x<left)left=x;if(x>right)right=x;if(y<top)top=y;if(y>bottom)bottom=y;}}return right<left?{left:0,top:0,right:c.width,bottom:c.height}:{left:left,top:top,right:right+1,bottom:bottom+1};}
    function activeLayer(){return layers.find(layer=>layer.id===state.activeId)||layers[0];}
    function layerRect(layer){const b=layer.alphaBounds,s=layer.scale;return{left:layer.x+b.left*s,top:layer.y+b.top*s,right:layer.x+b.right*s,bottom:layer.y+b.bottom*s};}
    function layerDrawSize(layer){return{width:layer.image.naturalWidth*layer.scale,height:layer.image.naturalHeight*layer.scale};}
    function snapshot(){return{activeId:state.activeId,layers:layers.map(layer=>({id:layer.id,x:layer.x,y:layer.y,scale:layer.scale,visible:layer.visible}))};}
    function pushHistory(){const snap=snapshot(),last=history[history.length-1],serial=JSON.stringify(snap),lastSerial=last&&JSON.stringify(last);if(serial!==lastSerial){history.push(snap);if(history.length>80)history.shift();}updateUndo();}
    function restoreSnapshot(snap){const saved=new Map(snap.layers.map(layer=>[layer.id,layer]));layers.sort((a,b)=>snap.layers.findIndex(item=>item.id===a.id)-snap.layers.findIndex(item=>item.id===b.id));layers.forEach(layer=>Object.assign(layer,saved.get(layer.id)));state.activeId=snap.activeId;}
    function undo(){const previous=history.pop();if(!previous)return;restoreSnapshot(previous);setDirty(true);render();updateUndo();notify('已撤销上一步摆放');}
    function updateUndo(){els.undoBtn.disabled=history.length===0;}
    function setDirty(value=true){state.dirty=value;els.dirtyStatus.textContent=value?'有未导出的修改':'未修改';els.dirtyStatus.className=value?'dirty':'ok';}
    function render(){if(!base.image)return;const w=base.image.naturalWidth,h=base.image.naturalHeight;if(els.canvas.width!==w||els.canvas.height!==h){els.canvas.width=w;els.canvas.height=h;els.plane.style.width=w+'px';els.plane.style.height=h+'px';}ctx.clearRect(0,0,w,h);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(base.image,0,0,w,h);layers.forEach(layer=>{if(!layer.visible||!layer.image)return;const size=layerDrawSize(layer);if(layer.shadowImage)ctx.drawImage(layer.shadowImage,layer.x,layer.y,size.width,size.height);ctx.drawImage(layer.image,layer.x,layer.y,size.width,size.height);});updateSelection();updateControls();renderLayerList();}
    function updateSelection(){const layer=activeLayer();if(!layer||!layer.image||!layer.visible){els.selection.hidden=true;return;}const r=layerRect(layer);els.selection.hidden=false;els.selection.dataset.label=layer.name.toUpperCase();els.selection.style.left=r.left+'px';els.selection.style.top=r.top+'px';els.selection.style.width=(r.right-r.left)+'px';els.selection.style.height=(r.bottom-r.top)+'px';}
    function updateControls(){const layer=activeLayer();if(!layer||!layer.image)return;const size=layerDrawSize(layer),r=layerRect(layer),percent=Math.round(layer.scale/layer.defaultScale*100);els.x.value=Math.round(layer.x);els.y.value=Math.round(layer.y);els.width.value=Math.round(size.width);els.height.value=Math.round(size.height);els.scale.value=Math.max(10,Math.min(300,percent));els.scaleReadout.textContent=percent+'%';els.selectedSource.textContent=layer.sourceLabel+(layer.shadow?'  ·  自带接触阴影':'');els.selectedChip.textContent=layer.name;els.metrics.innerHTML='图层画布：'+Math.round(size.width)+' × '+Math.round(size.height)+' px<br>可见物：'+Math.round(r.right-r.left)+' × '+Math.round(r.bottom-r.top)+' px<br>位置：'+Math.round(layer.x)+', '+Math.round(layer.y);}
    function renderLayerList(){els.layerList.textContent='';els.layerCount.textContent=layers.filter(layer=>layer.visible).length+' / '+layers.length;layers.slice().reverse().forEach(layer=>{const row=document.createElement('div');row.className='layer-row'+(layer.id===state.activeId?' active':'')+(layer.visible?'':' hidden');row.title='选择 '+layer.name;row.addEventListener('click',()=>{state.activeId=layer.id;render();});const eye=document.createElement('button');eye.className='eye';eye.type='button';eye.title=layer.visible?'隐藏图层':'显示图层';eye.textContent=layer.visible?'◉':'○';eye.addEventListener('click',event=>{event.stopPropagation();pushHistory();layer.visible=!layer.visible;setDirty(true);render();});const info=document.createElement('div');info.className='layer-info';const name=document.createElement('div');name.className='layer-name';name.textContent=layer.name;const type=document.createElement('div');type.className='layer-type';type.textContent=layer.type;info.append(name,type);const actions=document.createElement('div');actions.className='layer-actions';const up=document.createElement('button');up.className='layer-mini';up.type='button';up.title='向前一层';up.textContent='↑';up.addEventListener('click',event=>{event.stopPropagation();moveLayer(layer,1);});const down=document.createElement('button');down.className='layer-mini';down.type='button';down.title='向后一层';down.textContent='↓';down.addEventListener('click',event=>{event.stopPropagation();moveLayer(layer,-1);});actions.append(up,down);row.append(eye,info,actions);els.layerList.append(row);});}
    function moveLayer(layer,direction){const index=layers.indexOf(layer),target=index+direction;if(target<0||target>=layers.length)return;pushHistory();layers.splice(index,1);layers.splice(target,0,layer);setDirty(true);render();}
    function applyZoom(zoom){state.zoom=Math.max(.1,Math.min(2,zoom));const w=base.image?base.image.naturalWidth:1,h=base.image?base.image.naturalHeight:1;els.plane.style.transform='scale('+state.zoom+')';els.plane.style.setProperty('--inv-zoom',1/state.zoom);els.shell.style.width=(w*state.zoom)+'px';els.shell.style.height=(h*state.zoom)+'px';els.zoomReadout.textContent=Math.round(state.zoom*100)+'%';}
    function fitToViewport(){if(!base.image)return;const usableW=Math.max(200,els.viewport.clientWidth-112),usableH=Math.max(160,els.viewport.clientHeight-126);applyZoom(Math.min(usableW/base.image.naturalWidth,usableH/base.image.naturalHeight,1));els.viewport.scrollTo({left:0,top:0});}
    function scenePoint(event){const rect=els.canvas.getBoundingClientRect();return{x:(event.clientX-rect.left)/state.zoom,y:(event.clientY-rect.top)/state.zoom};}
    function beginMove(event){if(event.target.classList.contains('handle'))return;event.preventDefault();pushHistory();const p=scenePoint(event),layer=activeLayer();interaction={type:'move',pointerId:event.pointerId,start:p,x:layer.x,y:layer.y};els.selection.setPointerCapture(event.pointerId);}
    function beginResize(event){event.preventDefault();event.stopPropagation();pushHistory();const layer=activeLayer(),handle=event.currentTarget.dataset.handle,r=layerRect(layer),b=layer.alphaBounds,anchors={nw:{x:r.right,y:r.bottom,bx:b.right,by:b.bottom},ne:{x:r.left,y:r.bottom,bx:b.left,by:b.bottom},sw:{x:r.right,y:r.top,bx:b.right,by:b.top},se:{x:r.left,y:r.top,bx:b.left,by:b.top}};interaction={type:'resize',pointerId:event.pointerId,anchor:anchors[handle]};event.currentTarget.setPointerCapture(event.pointerId);}
    function onPointerMove(event){const p=scenePoint(event);els.cursorStatus.textContent='X '+Math.round(p.x)+' · Y '+Math.round(p.y);if(!interaction||interaction.pointerId!==event.pointerId)return;const layer=activeLayer();if(interaction.type==='move'){layer.x=interaction.x+p.x-interaction.start.x;layer.y=interaction.y+p.y-interaction.start.y;}else{const a=interaction.anchor,b=layer.alphaBounds,sx=Math.abs(p.x-a.x)/Math.max(1,b.right-b.left),sy=Math.abs(p.y-a.y)/Math.max(1,b.bottom-b.top);layer.scale=Math.max(.01,Math.min(6,(sx+sy)/2));layer.x=a.x-a.bx*layer.scale;layer.y=a.y-a.by*layer.scale;}setDirty(true);render();}
    function endPointer(event){if(interaction&&interaction.pointerId===event.pointerId){interaction=null;updateUndo();}}
    function selectAt(point){const selected=layers.slice().reverse().find(layer=>{if(!layer.visible||!layer.image)return false;const r=layerRect(layer);return point.x>=r.left&&point.x<=r.right&&point.y>=r.top&&point.y<=r.bottom;});if(selected&&selected.id!==state.activeId){state.activeId=selected.id;render();}}
    function commitNumber(kind,value){const layer=activeLayer();if(!Number.isFinite(value)||!layer||!layer.image)return;pushHistory();if(kind==='x')layer.x=value;if(kind==='y')layer.y=value;if(kind==='width')layer.scale=Math.max(.01,value/layer.image.naturalWidth);if(kind==='height')layer.scale=Math.max(.01,value/layer.image.naturalHeight);setDirty(true);render();}
    function resetLayers(){pushHistory();DEFAULT_LAYERS.forEach((spec,index)=>{const layer=layers.find(item=>item.id===spec.id);layer.x=spec.x;layer.y=spec.y;layer.scale=layer.defaultScale;layer.visible=spec.visible ?? true;layers.splice(layers.indexOf(layer),1);layers.splice(index,0,layer);});state.activeId='item_4115';setDirty(false);render();notify('已恢复 8 个图层的预设摆放');}
    async function replaceBase(file){if(!file)return;try{const image=await loadImage(URL.createObjectURL(file));base.image=image;base.source='blob:'+file.name;base.label=file.name;els.baseName.textContent=file.name;els.baseSize.textContent=image.naturalWidth+'×'+image.naturalHeight;setDirty(true);render();fitToViewport();notify('底图已替换');}catch(error){notify(error.message,true);}}
    async function replaceActiveProp(file){if(!file)return;const layer=activeLayer();if(!layer)return;try{const oldWidth=layer.image.naturalWidth*layer.scale,image=await loadImage(URL.createObjectURL(file));layer.image=image;layer.alphaBounds=visibleAlphaBounds(image);layer.scale=oldWidth/image.naturalWidth;layer.defaultScale=layer.scale;layer.source='blob:'+file.name;layer.sourceLabel=file.name;layer.shadowImage=null;layer.shadow=null;setDirty(true);render();notify(layer.name+' 已替换为本地透明 PNG');}catch(error){notify(error.message,true);}}
    function exportPng(){render();els.canvas.toBlob(blob=>{if(!blob)return notify('PNG 导出失败',true);downloadBlob(blob,'SC4003_courthouse_archive_eight_layers_composite.png');setDirty(false);notify('已导出 '+els.canvas.width+'×'+els.canvas.height+' 拼合 PNG');},'image/png');}
    function exportJson(){if(!base.image)return;const payload={schema:'ndc-prop-placement/v2',scene:'SC4003 Courthouse Archive',baseImage:base.source.startsWith('blob:')?base.label:base.source,canvas:{width:base.image.naturalWidth,height:base.image.naturalHeight},layers:layers.map((layer,index)=>{const size=layerDrawSize(layer),r=layerRect(layer);return{order:index,id:layer.id,name:layer.name,type:layer.type,visible:layer.visible,propImage:layer.source.startsWith('blob:')?layer.sourceLabel:layer.source,shadowImage:layer.shadow&&!layer.shadow.startsWith('blob:')?layer.shadow:null,placement:{x:round3(layer.x),y:round3(layer.y),scale:round4(layer.scale),width:round3(size.width),height:round3(size.height)},visibleBounds:{x:round3(r.left),y:round3(r.top),width:round3(r.right-r.left),height:round3(r.bottom-r.top)}};})};downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),'SC4003_courthouse_archive_eight_layers_placement.json');setDirty(false);notify('已导出 8 图层摆放 JSON');}
    function round3(n){return Math.round(n*1000)/1000;}function round4(n){return Math.round(n*10000)/10000;}function downloadBlob(blob,filename){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
    function notify(message,error){clearTimeout(toastTimer);els.toast.textContent=message;els.toast.style.borderColor=error?'var(--danger)':'var(--gold)';els.toast.classList.add('show');toastTimer=setTimeout(()=>els.toast.classList.remove('show'),2400);}
    function bindEvents(){els.selection.addEventListener('pointerdown',beginMove);els.selection.querySelectorAll('.handle').forEach(handle=>handle.addEventListener('pointerdown',beginResize));els.canvas.addEventListener('pointerdown',event=>selectAt(scenePoint(event)));window.addEventListener('pointermove',onPointerMove);window.addEventListener('pointerup',endPointer);window.addEventListener('pointercancel',endPointer);[['x',els.x],['y',els.y],['width',els.width],['height',els.height]].forEach(pair=>{const kind=pair[0],input=pair[1];input.addEventListener('change',()=>commitNumber(kind,Number(input.value)));input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();commitNumber(kind,Number(input.value));input.blur();}});});els.scale.addEventListener('input',()=>{const layer=activeLayer();if(!layer||!layer.image)return;if(!els.scale.dataset.editing){pushHistory();els.scale.dataset.editing='1';}layer.scale=layer.defaultScale*Number(els.scale.value)/100;setDirty(true);render();});els.scale.addEventListener('change',()=>{delete els.scale.dataset.editing;});els.baseFile.addEventListener('change',event=>replaceBase(event.target.files[0]));els.propFile.addEventListener('change',event=>replaceActiveProp(event.target.files[0]));els.undoBtn.addEventListener('click',undo);$('resetBtn').addEventListener('click',resetLayers);$('exportPngBtn').addEventListener('click',exportPng);$('exportJsonBtn').addEventListener('click',exportJson);$('fitBtn').addEventListener('click',fitToViewport);$('zoomOutBtn').addEventListener('click',()=>applyZoom(state.zoom-.1));$('zoomInBtn').addEventListener('click',()=>applyZoom(state.zoom+.1));window.addEventListener('resize',fitToViewport);window.addEventListener('keydown',event=>{if(event.target.matches('input'))return;if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();undo();return;}const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(!moves[event.key])return;event.preventDefault();pushHistory();const layer=activeLayer(),step=event.shiftKey?10:1;layer.x+=moves[event.key][0]*step;layer.y+=moves[event.key][1]*step;setDirty(true);render();});}
    async function boot(){bindEvents();updateUndo();try{base.image=await loadImage(BASE_SOURCE);await Promise.all(layers.map(async layer=>{const loaded=await Promise.all([loadImage(layer.source),layer.shadow?loadImage(layer.shadow):Promise.resolve(null)]);layer.image=loaded[0];layer.shadowImage=loaded[1];layer.alphaBounds=visibleAlphaBounds(layer.image);layer.defaultScale=layer.targetWidth/layer.image.naturalWidth;layer.scale=layer.defaultScale;}));els.baseName.textContent=base.label;els.baseSize.textContent=base.image.naturalWidth+'×'+base.image.naturalHeight;els.loadStatus.textContent='档案室清底图与 8 个独立道具图层已载入';render();requestAnimationFrame(fitToViewport);}catch(error){els.loadStatus.textContent='默认案例载入失败';notify(error.message+'。请确认使用 avg_editor_v2/server.py 启动。',true);}}
    boot();
})();
</script>
