        对 James 是"差一点上岸的孩子"。
        Zack 把听筒扣回叉簧，没有立刻转身——cutscene 在他的沉默中解除。
        全程不切场景：Zack 始终在 1016 书房；Emma 始终在 1013 客厅放风见证（但不发声）；
        Mrs. Morrison 始终在厨房未察觉。事件结束后 Zack 直接在书房继续 retrieve 1401。
